    <div class="cg" id="cg0"><span>Sangramento uterino anormal.</span></div>

    <div class="cg" id="cg2"><span>você vai aprender a reconhecer,</span></div>
    <div class="cg" id="cg3"><span>investigar e tratar.</span></div>
    <div class="cg" id="cg4"><span>E tudo cabe em quatro perguntas:</span></div>

    <div class="cg" id="cg6"><span>Está grávida?</span></div>
    <div class="cg" id="cg7"><span>De onde vem?</span></div>
    <div class="cg" id="cg8"><span>E por quê?</span></div>
    <div class="cg" id="cg9"><span>Sangramento uterino anormal é qualquer alteração</span></div>
    <div class="cg" id="cg10"><span>do padrão menstrual,</span></div>
    <div class="cg" id="cg11"><span>fora da gestação,</span></div>
    <div class="cg" id="cg12"><span>na mulher em idade fértil.</span></div>
    <div class="cg" id="cg13"><span>São quatro eixos:</span></div>
    <div class="cg" id="cg14"><span>frequência, duração, regularidade e volume.</span></div>
    <div class="cg" id="cg15"><span>Pela FIGO, o normal é:</span></div>
    <div class="cg" id="cg16"><span>ciclo de 24 a 38 dias,</span></div>
    <div class="cg" id="cg17"><span>menstruação de até 8 dias,</span></div>
    <div class="cg" id="cg18"><span>variação de até 7 a 9 dias</span></div>
    <div class="cg" id="cg19"><span>entre os ciclos,</span></div>
    <div class="cg" id="cg20"><span>e um volume que não atrapalha</span></div>
    <div class="cg" id="cg21"><span>a vida.</span></div>
    <div class="cg" id="cg22"><span>O quadro pode ser agudo,</span></div>
    <div class="cg" id="cg23"><span>intenso a ponto de exigir intervenção</span></div>
    <div class="cg" id="cg24"><span>imediata, ou crônico,</span></div>
    <div class="cg" id="cg25"><span>quando a alteração aparece na maioria</span></div>
    <div class="cg" id="cg26"><span>dos ciclos dos últimos seis meses.</span></div>
    <div class="cg" id="cg27"><span>Imagine uma paciente de 26 anos,</span></div>
    <div class="cg" id="cg28"><span>sangrando muito há três dias.</span></div>
    <div class="cg" id="cg29"><span>Por onde começar?</span></div>
    <div class="cg" id="cg30"><span>Primeiro, a hemodinâmica:</span></div>
    <div class="cg" id="cg31"><span>frequência cardíaca, pressão,</span></div>
    <div class="cg" id="cg32"><span>pulsos, consciência e diurese.</span></div>
    <div class="cg" id="cg33"><span>Atenção:</span></div>
    <div class="cg" id="cg34"><span>a pressão só cai na hipovolemia</span></div>
    <div class="cg" id="cg35"><span>classe três, com perda de 30 a 40% e</span></div>
    <div class="cg" id="cg36"><span>frequência acima de 120.</span></div>
    <div class="cg" id="cg37"><span>A taquicardia vem antes.</span></div>
    <div class="cg" id="cg38"><span>Segundo:</span></div>
    <div class="cg" id="cg39"><span>β-hCG em toda mulher em idade</span></div>
    <div class="cg" id="cg40"><span>fértil que sangra.</span></div>
    <div class="cg" id="cg41"><span>Gestação se exclui antes de qualquer</span></div>
    <div class="cg" id="cg42"><span>conduta.</span></div>
    <div class="cg" id="cg43"><span>Só com a paciente estável e o teste</span></div>
    <div class="cg" id="cg44"><span>negativo, vamos atrás da causa.</span></div>
    <div class="cg" id="cg45"><span>A idade orienta.</span></div>
    <div class="cg" id="cg46"><span>Na adolescência, pense em imaturidade do eixo,</span></div>
    <div class="cg" id="cg47"><span>gestação, infecção e coagulopatia.</span></div>
    <div class="cg" id="cg48"><span>Na adulta, disfunção ovulatória e gestação</span></div>
    <div class="cg" id="cg49"><span>anormal.</span></div>
    <div class="cg" id="cg50"><span>Na pós-menopausa, atrofia e terapia hormonal,</span></div>
    <div class="cg" id="cg51"><span>mas câncer de endométrio até prova</span></div>
    <div class="cg" id="cg52"><span>em contrário.</span></div>
    <div class="cg" id="cg53"><span>No exame especular,</span></div>
    <div class="cg" id="cg54"><span>confirme que o sangue vem do colo</span></div>
    <div class="cg" id="cg55"><span>e procure pólipo,</span></div>
    <div class="cg" id="cg56"><span>mioma parido ou cervicite.</span></div>
    <div class="cg" id="cg57"><span>No toque, o útero dá a pista:</span></div>
    <div class="cg" id="cg58"><span>aumentado, nodular e indolor sugere mioma;</span></div>
    <div class="cg" id="cg59"><span>amolecido e doloroso,</span></div>
    <div class="cg" id="cg60"><span>adenomiose.</span></div>
    <div class="cg" id="cg61"><span>Para as causas,</span></div>
    <div class="cg" id="cg62"><span>a FIGO criou o PALM-COEIN.</span></div>
    <div class="cg" id="cg63"><span>PALM são as causas estruturais,</span></div>
    <div class="cg" id="cg64"><span>que a imagem ou a histologia</span></div>
    <div class="cg" id="cg65"><span>mostram.</span></div>
    <div class="cg" id="cg66"><span>Pólipo:</span></div>
    <div class="cg" id="cg67"><span>20 a 30% dos casos,</span></div>
    <div class="cg" id="cg68"><span>perto da menopausa.</span></div>
    <div class="cg" id="cg69"><span>Adenomiose:</span></div>
    <div class="cg" id="cg70"><span>endométrio dentro do miométrio,</span></div>
    <div class="cg" id="cg71"><span>com fluxo aumentado e cólica forte.</span></div>
    <div class="cg" id="cg72"><span>Leiomioma:</span></div>
    <div class="cg" id="cg73"><span>o submucoso dá metrorragia,</span></div>
    <div class="cg" id="cg74"><span>sangramento fora de hora;</span></div>
    <div class="cg" id="cg75"><span>o intramural dá menorragia,</span></div>
    <div class="cg" id="cg76"><span>fluxo aumentado.</span></div>
    <div class="cg" id="cg77"><span>O subseroso costuma não sangrar.</span></div>
    <div class="cg" id="cg78"><span>Malignidade e hiperplasia:</span></div>
    <div class="cg" id="cg79"><span>na pós-menopausa, endométrio acima de 4 mm</span></div>
    <div class="cg" id="cg80"><span>pede biópsia.</span></div>
    <div class="cg" id="cg81"><span>COEIN são as causas não estruturais.</span></div>
    <div class="cg" id="cg82"><span>Coagulopatia:</span></div>
    <div class="cg" id="cg83"><span>a mais comum é a doença</span></div>
    <div class="cg" id="cg84"><span>de von Willebrand.</span></div>
    <div class="cg" id="cg85"><span>Desconfie de quem sangra muito desde</span></div>
    <div class="cg" id="cg86"><span>a menarca.</span></div>
    <div class="cg" id="cg87"><span>Ovulatória, a causa mais comum de todas.</span></div>
    <div class="cg" id="cg88"><span>Na SOP, a mulher não ovula,</span></div>
    <div class="cg" id="cg89"><span>não forma corpo lúteo e fica</span></div>
    <div class="cg" id="cg90"><span>sem progesterona.</span></div>
    <div class="cg" id="cg91"><span>O estrogênio age sem oposição,</span></div>
    <div class="cg" id="cg92"><span>e o endométrio descama de forma</span></div>
    <div class="cg" id="cg93"><span>irregular.</span></div>
    <div class="cg" id="cg94"><span>Endometrial:</span></div>
    <div class="cg" id="cg95"><span>falha da hemostasia local,</span></div>
    <div class="cg" id="cg96"><span>com ciclos regulares e fluxo intenso.</span></div>
    <div class="cg" id="cg97"><span>Iatrogênica:</span></div>
    <div class="cg" id="cg98"><span>DIU de cobre,</span></div>
    <div class="cg" id="cg99"><span>hormônios e anticoagulantes.</span></div>
    <div class="cg" id="cg100"><span>E as não classificadas,</span></div>
    <div class="cg" id="cg101"><span>como a malformação arteriovenosa e a istmocele.</span></div>
    <div class="cg" id="cg102"><span>Para todas:</span></div>
    <div class="cg" id="cg103"><span>β-hCG, hemograma com plaquetas e coagulograma.</span></div>
    <div class="cg" id="cg104"><span>Se a suspeita é ovulatória:</span></div>
    <div class="cg" id="cg105"><span>FSH, prolactina e TSH.</span></div>
    <div class="cg" id="cg106"><span>Fogachos antes dos 40 anos?</span></div>
    <div class="cg" id="cg107"><span>Pense em insuficiência ovariana precoce e dose</span></div>
    <div class="cg" id="cg108"><span>o FSH.</span></div>
    <div class="cg" id="cg109"><span>Na imagem, a primeira linha é</span></div>
    <div class="cg" id="cg110"><span>o ultrassom transvaginal.</span></div>
    <div class="cg" id="cg111"><span>A histerossonografia avalia melhor as lesões</span></div>
    <div class="cg" id="cg112"><span>focais;</span></div>
    <div class="cg" id="cg113"><span>a histeroscopia vê e já trata.</span></div>
    <div class="cg" id="cg114"><span>Biópsia de endométrio:</span></div>
    <div class="cg" id="cg115"><span>a partir dos 45 anos,</span></div>
    <div class="cg" id="cg116"><span>com fatores de risco como obesidade</span></div>
    <div class="cg" id="cg117"><span>e anovulação crônica,</span></div>
    <div class="cg" id="cg118"><span>ou na pós-menopausa com endométrio acima</span></div>
    <div class="cg" id="cg119"><span>de 4 mm.</span></div>
    <div class="cg" id="cg120"><span>De volta à paciente de 26 anos.</span></div>
    <div class="cg" id="cg121"><span>A conduta tem cinco passos:</span></div>
    <div class="cg" id="cg122"><span>estabilizar, excluir gravidez,</span></div>
    <div class="cg" id="cg123"><span>parar o sangramento,</span></div>
    <div class="cg" id="cg124"><span>tratar a anemia e prevenir,</span></div>
    <div class="cg" id="cg125"><span>investigando a causa.</span></div>
    <div class="cg" id="cg126"><span>Instável:</span></div>
    <div class="cg" id="cg127"><span>volume, transfusão, estrogênio conjugado endovenoso e tamponamento</span></div>
    <div class="cg" id="cg128"><span>com balão.</span></div>
    <div class="cg" id="cg129"><span>Estável:</span></div>
    <div class="cg" id="cg130"><span>anticoncepcional combinado de 35 mcg,</span></div>
    <div class="cg" id="cg131"><span>três vezes ao dia.</span></div>
    <div class="cg" id="cg132"><span>Se o estrogênio for contraindicado,</span></div>
    <div class="cg" id="cg133"><span>medroxiprogesterona 20 mg,</span></div>
    <div class="cg" id="cg134"><span>três vezes ao dia,</span></div>
    <div class="cg" id="cg135"><span>por sete dias.</span></div>
    <div class="cg" id="cg136"><span>Depois:</span></div>
    <div class="cg" id="cg137"><span>ferro, hormônio por três meses e investigação</span></div>
    <div class="cg" id="cg138"><span>da causa.</span></div>
    <div class="cg" id="cg139"><span>No crônico, as opções hormonais são</span></div>
    <div class="cg" id="cg140"><span>o anticoncepcional combinado,</span></div>
    <div class="cg" id="cg141"><span>o progestagênio e o DIU de levonorgestrel.</span></div>
    <div class="cg" id="cg142"><span>Sem hormônio:</span></div>
    <div class="cg" id="cg143"><span>ácido tranexâmico, anti-inflamatório e ferro.</span></div>
    <div class="cg" id="cg144"><span>Mas lembre:</span></div>
    <div class="cg" id="cg145"><span>o remédio controla o sintoma,</span></div>
    <div class="cg" id="cg146"><span>não remove a causa estrutural.</span></div>
    <div class="cg" id="cg147"><span>Pólipo se resolve com polipectomia.</span></div>
    <div class="cg" id="cg148"><span>Na cirurgia, prefira a histeroscopia à curetagem,</span></div>
    <div class="cg" id="cg149"><span>que é às cegas.</span></div>
    <div class="cg" id="cg150"><span>Embolização, principalmente na malformação arteriovenosa.</span></div>
    <div class="cg" id="cg151"><span>E a histerectomia fica como última</span></div>
    <div class="cg" id="cg152"><span>opção.</span></div>
    <div class="cg" id="cg153"><span>Um capítulo à parte:</span></div>
    <div class="cg" id="cg154"><span>a obesidade.</span></div>
    <div class="cg" id="cg155"><span>A gordura converte androgênio em estrona,</span></div>
    <div class="cg" id="cg156"><span>a mulher deixa de ovular,</span></div>
    <div class="cg" id="cg157"><span>e o estrogênio fica sem oposição,</span></div>
    <div class="cg" id="cg158"><span>levando à hiperplasia.</span></div>
    <div class="cg" id="cg159"><span>A cada 5 pontos a mais</span></div>
    <div class="cg" id="cg160"><span>de IMC, o risco de câncer</span></div>
    <div class="cg" id="cg161"><span>de endométrio sobe cerca de 60%.</span></div>
    <div class="cg" id="cg162"><span>E perder de 5 a 10% do peso</span></div>
    <div class="cg" id="cg163"><span>pode devolver a ovulação.</span></div>
    <div class="cg" id="cg164"><span>Caso Joana:</span></div>
    <div class="cg" id="cg165"><span>38 anos, IMC de 36,</span></div>
    <div class="cg" id="cg166"><span>ciclos de 35 a 90 dias</span></div>
    <div class="cg" id="cg167"><span>e hirsutismo.</span></div>
    <div class="cg" id="cg168"><span>Hemoglobina 9,4, ferritina 8,</span></div>
    <div class="cg" id="cg169"><span>endométrio de 16 mm.</span></div>
    <div class="cg" id="cg170"><span>Diagnóstico:</span></div>
    <div class="cg" id="cg171"><span>sangramento ovulatório por SOP.</span></div>
    <div class="cg" id="cg172"><span>Como é obesa e tem endométrio</span></div>
    <div class="cg" id="cg173"><span>espesso, faz biópsia,</span></div>
    <div class="cg" id="cg174"><span>mesmo antes dos 45:</span></div>
    <div class="cg" id="cg175"><span>hiperplasia sem atipia.</span></div>
    <div class="cg" id="cg176"><span>Conduta:</span></div>
    <div class="cg" id="cg177"><span>DIU de levonorgestrel de 52 mg,</span></div>
    <div class="cg" id="cg178"><span>ferro e perda de peso.</span></div>
    <div class="cg" id="cg179"><span>Para fechar, as quatro perguntas:</span></div>
    <div class="cg" id="cg180"><span>está estável?</span></div>
    <div class="cg" id="cg181"><span>Está grávida?</span></div>
    <div class="cg" id="cg182"><span>De onde vem o sangue?</span></div>

    <div class="cg" id="cg184"><span>Responda nessa ordem,</span></div>
    <div class="cg" id="cg185"><span>e o sangramento uterino anormal deixa</span></div>
    <div class="cg" id="cg186"><span>de ser um mistério.</span></div>
