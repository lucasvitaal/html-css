<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Paleta do Ensaio SUA (modo escuro). */
      :root {
        --bg: #0e1424;
        --card: #161e33;
        --soft: #1e2a46;
        --line: #2a3552;
        --fg: #e7ecf6;
        --mute: #9aa6c0;
        --navy: #8fb0f0;
        --green: #3fcf85;
        --wine: #e58aab;
        --amber: #f0b154;
        --f-display: "Montserrat", sans-serif;
        --f-body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #bg { position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, #18223d 0%, var(--bg) 65%); }
      #prog { position: absolute; left: 0; top: 0; height: 6px; width: 1920px; background: var(--green); transform-origin: left center; }

      .scene { position: absolute; inset: 0; color: var(--fg); font-family: var(--f-body); }
      .stage { position: absolute; inset: 0; padding: 78px 120px 250px; display: flex; flex-direction: column; gap: 30px; }
      .stage.center { align-items: center; justify-content: center; text-align: center; padding-bottom: 230px; }
      .chap { font: 700 28px var(--f-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
      .chap b { color: var(--green); margin-right: 14px; }
      .hero { font: 800 110px/1.02 var(--f-display); letter-spacing: -0.02em; max-width: 1500px; }
      .hero em, .h em, .quote em { font-style: normal; color: var(--amber); }
      .sub { font-size: 44px; color: var(--mute); }
      .h { font: 800 60px/1.1 var(--f-display); letter-spacing: -0.01em; }
      .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
      .qs { margin-top: 20px; gap: 24px; justify-content: center; }
      .pill { padding: 18px 36px; border-radius: 999px; border: 3px solid var(--wine); font: 700 42px var(--f-display); }

      .grid { display: grid; gap: 24px; }
      .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 26px 30px; display: flex; flex-direction: column; gap: 12px; }
      .card.bw { border-color: var(--wine); }
      .card.bn { border-color: var(--navy); }
      .card.bg { border-color: var(--green); }
      .card.hot { border-color: var(--amber); background: #241f1a; }
      .lbl { font: 700 30px var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg); }
      .val { font: 800 44px/1.1 var(--f-display); color: var(--amber); }
      .txt { font-size: 34px; line-height: 1.3; }
      .big { font: 800 46px/1.15 var(--f-display); }
      .mega { font: 800 96px/1 var(--f-display); }
      .w { color: var(--wine); } .n { color: var(--navy); } .g { color: var(--green); } .a { color: var(--amber); } .m { color: var(--mute); }
      .b { font-weight: 700; }
      .txt b { color: var(--fg); }

      .case { flex-direction: row; align-items: baseline; gap: 28px; border-color: var(--amber); }
      .case .lbl { color: var(--amber); }
      .chips { gap: 14px; }
      .chip { padding: 12px 24px; border-radius: 999px; background: var(--soft); font: 700 32px var(--f-body); }
      .chip.hot { background: var(--green); color: #07140d; }
      .note { font-size: 32px; color: var(--mute); padding: 0 8px; }
      .hypo { display: grid; gap: 10px; margin-top: 8px; }
      .hr { display: grid; grid-template-columns: 190px 160px 1fr; padding: 10px 18px; border-radius: 12px; background: var(--soft); font-size: 30px; }
      .hr b { color: var(--mute); }
      .hr.hot { background: #3a1f2c; color: #ffd4e2; }
      .hr.hot b { color: var(--wine); }
      .strip { align-self: flex-start; padding: 16px 30px; border-radius: 16px; background: #12301f; color: var(--green); font: 700 36px var(--f-body); }

      .letters .card { gap: 10px; }
      .L { font: 800 120px/1 var(--f-display); color: var(--amber); }
      .L.n { color: var(--navy); }
      .g5.letters .lbl { font-size: 28px; }
      .g5.letters .txt { font-size: 30px; }
      .tag { align-self: flex-start; padding: 8px 18px; border-radius: 999px; background: var(--amber); color: #2a1a00; font: 700 30px var(--f-body); }
      .chain { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 34px; }
      .chain span { padding: 12px 22px; border-radius: 14px; background: var(--soft); font-weight: 700; }
      .chain span.hot { background: var(--amber); color: #2a1a00; }
      .chain i { font-style: normal; color: var(--mute); font-size: 40px; }
      .chain.big { font-size: 42px; margin: 30px 0 20px; }
      .rows { display: grid; gap: 22px; }
      .card.line { flex-direction: row; align-items: center; gap: 30px; padding: 22px 30px; }
      .card.line .lbl { width: 250px; flex: none; }
      .steps .card { min-height: 190px; }
      .num { font: 800 64px/1 var(--f-display); color: var(--green); }
      .quote { font: 800 48px/1.2 var(--f-display); padding: 10px 0; display: flex; flex-direction: column; gap: 12px; }
      .quote span { font: 700 34px var(--f-body); color: var(--green); }
      .stat { gap: 18px; padding: 40px; }
      .stat .mega { font-size: 130px; }
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
      .facts span { padding: 18px 22px; border-radius: 14px; background: var(--soft); font: 700 38px var(--f-body); }
      .col { display: flex; flex-direction: column; gap: 24px; }
      .tall { flex: 1; }
      .qgrid .card { flex-direction: row; align-items: center; gap: 28px; padding: 34px; flex-wrap: wrap; }
      .qgrid .big { font-size: 56px; }
      .qgrid .txt { flex-basis: 100%; padding-left: 74px; margin-top: -14px; }
    </style>
  </head>
