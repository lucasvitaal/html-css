<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha de estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F1EC;--card:#fff;--ink:#231C1E;--ink2:#5C5153;--ink3:#8E8284;--line:#E6D9D2;
--wine:#7A2E4A;--wine2:#9A4466;--cream:#FBF3E9;--grey:#F0EEEC;--amber:#B07D3A;--amberbg:#FBF0DD;--brick:#A8432A;--brickbg:#FBECE6;
--teal:#1E5E6E;--tealbg:#E4EFF2;--green:#2E6B4F;--greenbg:#E6F1EA;--purple:#5B3F8C;--purplebg:#EEE8F7;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1517;--card:#251E21;--ink:#F1E9EA;--ink2:#C9BCBE;--ink3:#97898C;--line:#3A3033;--wine:#E08AAA;--wine2:#F0A8C2;--cream:#2E2427;--grey:#2A2426;--amber:#E2B36C;--amberbg:#3A2E1C;--brick:#F08E74;--brickbg:#3A2420;--teal:#7CC3D3;--tealbg:#1C2E33;--green:#86CDA8;--greenbg:#1C2E25;--purple:#C2A8F0;--purplebg:#2B2338}}
:root[data-theme="dark"]{--bg:#1A1517;--card:#251E21;--ink:#F1E9EA;--ink2:#C9BCBE;--ink3:#97898C;--line:#3A3033;--wine:#E08AAA;--wine2:#F0A8C2;--cream:#2E2427;--grey:#2A2426;--amber:#E2B36C;--amberbg:#3A2E1C;--brick:#F08E74;--brickbg:#3A2420;--teal:#7CC3D3;--tealbg:#1C2E33;--green:#86CDA8;--greenbg:#1C2E25;--purple:#C2A8F0;--purplebg:#2B2338}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--wine)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{max-width:760px;margin:0 auto;padding:10px 14px 6px;display:flex;align-items:center;gap:10px}
.brand{font:800 19px/1.1 var(--serif);color:var(--wine);flex:1;letter-spacing:-.01em}
.brand small{display:block;font:400 12px var(--sans);color:var(--ink3);letter-spacing:0}
.clock{font:700 13px var(--sans);color:var(--teal);background:var(--tealbg);padding:4px 9px;border-radius:999px;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:17px}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink2)}
.tab.on{background:var(--wine);border-color:var(--wine);color:#fff}
.filters{max-width:760px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--ink2)}
.chip.on{border-color:var(--wine);color:var(--wine);background:var(--cream);font-weight:700}
.view{display:none;padding-top:14px}.view.on{display:block}
h2.vt{font:800 24px/1.15 var(--serif);color:var(--wine);margin:6px 0 4px}
p.lead{color:var(--ink2);margin:0 0 14px}
/* mapa */
.capcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.caphead{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.caphead h3{font:800 18px/1.2 var(--serif);margin:0;color:var(--ink)}
.caphead .aula{font-size:12px;color:var(--ink3)}
.bar{height:8px;border-radius:6px;background:var(--grey);margin:8px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple)}
.inc{width:100%;border-collapse:collapse;font-size:14px}
.inc td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.inc td:first-child{font-weight:700}
.inc .n0{color:var(--ink3);font-style:italic}
.caiu{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;color:#fff;background:var(--purple)}
.caiu.l1{background:#A08BC6}.caiu.l2{background:#7B62AA}
.never{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;color:var(--ink3);border:1px dashed var(--ink3)}
.go{text-align:left;border:0;background:none;color:var(--wine);font-weight:700;padding:0;text-decoration:underline}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin:10px 0 18px}
.legend span{display:flex;gap:6px;align-items:center}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* blocos */
.capbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.capsec{margin:0 0 22px}
.capsec>h3{font:800 21px/1.2 var(--serif);color:var(--wine);margin:18px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk{background:var(--card);border:1.5px solid var(--wine);border-radius:14px;margin:0 0 14px;overflow:hidden}
.blk>header{padding:12px 14px 8px;display:flex;gap:8px;align-items:flex-start}
.blk>header h4{font:700 17px/1.3 var(--serif);margin:0;flex:1}
.blk .bdg{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 8px}
.sb{display:inline-block;font:700 11px var(--sans);color:#fff;background:var(--wine);border-radius:5px;padding:1px 6px;border:0}
.sb.ghost{background:transparent;color:var(--wine);border:1px solid var(--wine)}
.enfb{display:inline-block;font:700 11px var(--sans);color:#fff;background:var(--amber);border-radius:5px;padding:1px 6px}
.slides{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scroll-snap-type:x mandatory}
.slides figure{margin:0;flex:0 0 88%;scroll-snap-align:start;position:relative}
.slides figure:only-child{flex-basis:100%}
.slides img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.slides figcaption{position:absolute;top:6px;left:6px}
.l1{padding:2px 14px 12px}
.l1 b{color:var(--wine)}
b.n,.n{background:var(--tealbg);color:var(--teal)!important;border-radius:4px;padding:0 3px;font-weight:700}
.l2{margin:0 14px 12px;background:var(--cream);border-left:4px solid var(--wine2);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
.l2 .lab,.l3 summary,.enf .lab,.pega .lab,.dv .lab{font:700 12px var(--sans);letter-spacing:.02em;display:block;margin-bottom:2px}
.l2 .lab{color:var(--wine2)}
.enf{margin:0 14px 12px;background:var(--amberbg);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
.enf .lab{color:var(--amber)}
.l3{margin:0 14px 12px;background:var(--grey);border-radius:10px;font-size:14px;color:var(--ink2)}
.l3 summary{padding:8px 12px;color:var(--teal);list-style:none;cursor:pointer}
.l3 summary::-webkit-details-marker{display:none}
.l3 summary:before{content:"▸ ";}.l3[open] summary:before{content:"▾ "}
.l3 .it{padding:0 12px 9px}
.cite{font:700 11px ui-monospace,Menlo,Consolas,monospace;color:var(--teal);background:var(--tealbg);border-radius:4px;padding:1px 5px;white-space:nowrap}
.pega{margin:0 14px 12px;background:var(--brickbg);border-left:4px solid var(--brick);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
.pega .lab{color:var(--brick)}
.dv{margin:0 14px 12px;background:var(--greenbg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:9px 12px;font-size:14px}
.dv .lab{color:var(--green)}
.ill{margin:0 14px 12px;cursor:zoom-in}.ill svg{display:block;width:100%;height:auto;border-radius:12px}
.qlinks{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
.ql{border:1px solid var(--purple);color:var(--purple);background:var(--purplebg);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700}
.acts{display:flex;gap:6px;padding:8px 14px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink2)}
.act.on{border-color:var(--amber);color:var(--amber);font-weight:700}
.act.rev.on{border-color:var(--brick);color:var(--brick)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.t th{background:var(--wine);color:#fff;text-align:left;padding:6px 8px;font-size:13px}
table.t td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tw{overflow-x:auto}
body.soslide .l2,body.soslide .l3,body.soslide .ill,body.soslide .dv{display:none}
.hide{display:none!important}
/* questões */
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.q .qh{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;background:var(--purplebg);color:var(--purple);font-size:13px;font-weight:700}
.q .qh.aut{background:var(--grey);color:var(--ink3)}
.q .en{padding:12px 14px 6px}
.q .al{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px}
.q .al button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:15px}
.q .al button.ok{border-color:var(--green);background:var(--greenbg);font-weight:700}
.q .al button.bad{border-color:var(--brick);background:var(--brickbg);text-decoration:line-through}
.q .why{display:none;padding:10px 14px 12px;border-top:1px solid var(--line);font-size:15px}
.q.done .why{display:block}
.q .why .mini{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.q .why .mini img{height:80px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
/* slides */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{position:relative;border:0;padding:0;background:none;text-align:left}
.st img{width:100%;aspect-ratio:1456/840;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
.st span{position:absolute;top:5px;left:5px}
.st .used{position:absolute;top:5px;right:5px;background:var(--green);color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
input.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;margin:0 0 10px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,10,14,.82);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 20px)}
.modal.on{display:block}
.modal .box{max-width:900px;margin:0 auto;background:var(--card);border-radius:14px;overflow:hidden}
.modal .box img{width:100%;display:block;background:#fff}
.modal .box .mb{padding:12px 14px}
.modal .x{position:sticky;top:0;float:right;margin:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:18px}
/* aula guiada */
.stage{background:var(--card);border:1.5px solid var(--wine);border-radius:16px;overflow:clip}
.stage .where{font-size:13px;color:var(--ink3);padding:10px 14px 0}
.stage h3{font:800 20px/1.25 var(--serif);color:var(--wine);margin:4px 14px 8px}
.ctrl{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.big{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
.big.play{background:var(--teal);color:#fff}.big.next{background:var(--wine);color:#fff;flex:1}.big.prev{background:var(--grey)}
.speaking{outline:3px solid var(--teal);outline-offset:-3px}
/* véspera, cola */
.flash{display:grid;gap:8px}
.fc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left}
.fc .a{display:none;color:var(--green);font-weight:700;margin-top:6px}.fc.open .a{display:block}
.fc .c{font-size:11px;color:var(--ink3)}
.pg{background:var(--brickbg);border-left:4px solid var(--brick);border-radius:0 10px 10px 0;padding:8px 12px;margin:0 0 8px;font-size:15px}
.pg small{display:block;color:var(--ink3)}
.cola h3{font:800 18px var(--serif);color:var(--wine);margin:16px 0 6px}
.cola table{width:100%;border-collapse:collapse;font-size:14px}
.cola td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.cola td:first-child{color:var(--ink2);width:42%}
.cola td:last-child{font-weight:700;color:var(--teal)}
.dvt td{font-size:14px}
.dvt td:last-child{background:var(--greenbg);font-weight:700}
/* caderno */
.cadi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.cadi .meta{font-size:12px;color:var(--ink3)}
.cadi .del{float:right;border:0;background:none;color:var(--ink3)}
.syncst{font-size:12px;color:var(--ink3);margin:0 0 10px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:var(--bg);color:var(--ink)}
#hlb{position:fixed;z-index:50;display:none;border:0;background:var(--amber);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;font-size:14px;z-index:70;display:none}
mark.hl{background:#FCE5A8;color:inherit;border-radius:3px}

/* ===== redesenho iPhone: barra inferior, slides protagonistas ===== */
html{-webkit-text-size-adjust:100%}
body{font-size:calc(16px * var(--fs,1));-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);min-height:54px}
.bnav button i{font-style:normal;font-size:21px;line-height:1}
.bnav button.on{color:var(--wine);font-weight:700}
.sheet{position:fixed;inset:0;z-index:55;display:none;background:rgba(20,10,14,.45)}
.sheet.on{display:block}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 16px);max-width:760px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet .opt{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:13px 6px;border-bottom:1px solid var(--line);font-size:17px}
.sheet .opt i{font-style:normal;font-size:22px;width:30px;text-align:center}
.sheet .opt small{display:block;font-size:13px;color:var(--ink3)}
.sheet .tools{display:flex;gap:8px;padding-top:12px;flex-wrap:wrap}
.top .row{padding-bottom:8px}
.top .tabs{display:none}
/* slide como protagonista */
.shero{position:relative;background:#fff;border-bottom:1px solid var(--line)}
.shero .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.shero .track::-webkit-scrollbar{display:none}
.shero figure{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative}
.shero img{width:100%;display:block;aspect-ratio:1456/840;object-fit:contain;background:#fff}
.shero .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px;pointer-events:none}
.shero .who{position:absolute;left:8px;top:8px;display:flex;gap:4px;align-items:center}
.fac{font:700 10px var(--sans);letter-spacing:.04em;background:#fff;color:var(--wine);border:1px solid var(--wine);border-radius:5px;padding:1px 5px}
.blk>header{padding-top:12px}
.blk .bdg{padding-top:2px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none}
.thumbs button{flex:0 0 auto;border:2px solid transparent;border-radius:7px;padding:0;background:none}
.thumbs button.on{border-color:var(--wine)}
.thumbs img{height:46px;border-radius:5px;display:block}
.toleitor{border:0;background:none;color:var(--wine);font-weight:700;font-size:14px;padding:6px 14px 0}
/* leitor de slides */
.reader{background:var(--card);border:1.5px solid var(--wine);border-radius:16px;overflow:hidden}
.reader .rtop{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px}
.reader .rtop b{color:var(--wine)}
.reader .pos{margin-left:auto;color:var(--ink3);font-size:13px}
.reader .stagei{position:relative;background:#fff;touch-action:pan-y}
.reader .stagei img{width:100%;display:block;aspect-ratio:1456/840;object-fit:contain}
.reader .nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
.reader .nav2 button{border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px;background:var(--grey)}
.reader .nav2 button.nx{background:var(--wine);color:#fff}
.prog{height:4px;background:var(--grey)}.prog i{display:block;height:100%;background:var(--wine)}
.rsec{padding:4px 14px 12px}
.rsec h5{font:700 13px var(--sans);color:var(--ink3);margin:12px 0 6px;letter-spacing:.02em}
.rblk{border:1px solid var(--line);border-left:4px solid var(--wine);border-radius:0 10px 10px 0;padding:9px 12px;margin:0 0 8px;background:var(--bg)}
.rblk h6{font:700 15px/1.3 var(--serif);margin:0 0 4px;color:var(--wine)}
.rblk .l1{padding:0;font-size:15px}
.rtxt{font-size:14px;color:var(--ink2);background:var(--grey);border-radius:10px;padding:8px 12px}
.rtxt summary{color:var(--teal);font-weight:700;cursor:pointer}
.modebar{display:flex;gap:6px;margin:0 0 10px}
.cont{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--wine);border-radius:14px;padding:10px;margin:0 0 14px;width:100%;text-align:left}
.cont img{width:116px;border-radius:8px;border:1px solid var(--line)}
.cont b{color:var(--wine)}
.capthumbs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px;scrollbar-width:none}
.capthumbs img{height:62px;border-radius:6px;border:1px solid var(--line);background:#fff}
.zoomwrap{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}
.zoomwrap img{width:100%;transition:width .2s}
.zoomwrap.z2 img{width:220%;max-width:none}
.zbar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.act,.chip,.ql{min-height:34px}

.gv{margin:6px 0 0;font-size:15px}
.gcite{color:var(--wine2);background:var(--cream);border:1px solid var(--line)}
.agprog{height:5px;background:var(--grey)}.agprog i{display:block;height:100%;background:var(--wine)}
.agcap{margin:10px 14px 4px;background:var(--tealbg);border-radius:12px;padding:10px 12px;font-size:17px;line-height:1.45;min-height:64px}
.caplab{display:inline-block;font:700 11px var(--sans);letter-spacing:.03em;color:var(--teal);margin-bottom:3px}
.caplab.k-grav{color:var(--wine2)}.caplab.k-pega{color:var(--brick)}.caplab.k-caiu{color:var(--purple)}
.agsegs{display:flex;gap:3px;padding:0 14px 8px}.agsegs i{flex:1;height:4px;border-radius:2px;background:var(--grey)}.agsegs i.done{background:var(--teal)}.agsegs i.cur{background:var(--wine)}
.agsum{margin:0 14px 10px;background:var(--grey);border-radius:10px;font-size:15px}

for(let i=0;i<n;i++)v.setInt16(44+i*2,(i%2?1:-1),true);let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'data:audio/wav;base64,'+btoa(bin)}

const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);let q=.72,d=c.toDataURL('image/jpeg',q);
while(d.length>180000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}if(d.length>180000){const c2=document.createElement('canvas');c2.width=Math.round(w*.7);c2.height=Math.round(h*.7);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);d=c2.toDataURL('image/jpeg',.6)}res(d)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function simRun(){const box=$('#v-prova');const it=simItems();if(SIM.i>=it.length)SIM.i=it.length-1;const cur=it[SIM.i];const nAns=it.filter(x=>x.t==='q'?SIM.pick[x.id]!=null:(KBY[x.id].p.some((p,i)=>(SIM.txt[x.id+':'+i]||'').trim()))).length;
let body='';if(cur.t==='q'){const q=QBY[cur.id];const pk=SIM.pick[q.id];body=`<div class="simq"><div class="xs" style="margin:0 0 6px">Questão ${SIM.i+1} · cap. ${q.cap}</div><div class="en">${q.enun}</div><div class="al">${q.alts.map((a,i)=>`<button data-simpick="${i}" class="${pk===i?'pick':''}">${String.fromCharCode(65+i)}) ${a}</button>`).join('')}</div></div>`}
else{const k=KBY[cur.id];body=`<div class="simq"><div class="xs" style="margin:0 0 6px">Caso ${SIM.i+1} · cap. ${k.cap}</div><b>${esc(k.t)}</b><div class="kenun" style="margin:8px 0">${k.enun}</div>${k.p.map((p,i)=>`<div class="kq"><div class="kp"><b>${String.fromCharCode(97+i)})</b> ${p.p}</div><textarea class="kans simtxt" data-simk="${k.id}:${i}" placeholder="Escreva como na prova: conceito → números → conduta. Pode ditar.">${esc(SIM.txt[k.id+':'+i]||'')}</textarea></div>`).join('')}</div>`}
box.innerHTML=`<div class="simbar"><span class="simclock" id="simclock">${mmss(SIM.lim-simEl())}</span><span class="xs">${nAns}/${it.length} respondidas</span><span class="sp"></span><button class="pill" id="simpause">${SIM.run?'⏸ Pausar':'▶ Retomar'}</button><button class="big next" id="simend">Entregar</button></div>
<div class="simgrid">${it.map((x,i)=>{const a=x.t==='q'?SIM.pick[x.id]!=null:KBY[x.id].p.some((p,j)=>(SIM.txt[x.id+':'+j]||'').trim());return `<button data-simi="${i}" class="${a?'ans':''}${i===SIM.i?' cur':''}${SIM.flag[i]?' flag':''}" title="${x.t==='q'?'objetiva':'caso'}">${x.t==='k'?'✍':''}${i+1}</button>`}).join('')}</div>
${SIM.run?body:`<div class="intro" style="text-align:center"><b>⏸ Pausado.</b><br>A questão fica escondida enquanto o relógio está parado.</div>`}
<div class="simnav"><button class="big prev" id="simprev" ${SIM.i?'':'disabled'}>◀ Anterior</button><button class="pill" id="simflag">${SIM.flag[SIM.i]?'🚩 Marcada':'🏳 Marcar para revisar'}</button><button class="big play" id="simnext">${SIM.i<it.length-1?'Próxima ▶':'Revisar e entregar'}</button></div>`;
clearInterval(SIMT);SIMT=setInterval(simTick,1000);simTick()}
function simEnd(){if(SIM.run){SIM.acc+=Date.now()-SIM.run;SIM.run=0}clearInterval(SIMT);
const R0=CAD.answers();let ok=0;SIM.Q.forEach(id=>{const q=QBY[id];const pk=SIM.pick[id];if(pk==null)return;const hit=pk===q.ok;if(hit)ok++;
CAD.put(simKey(id),{tipo:'resp',ref:q.id,pick:pk,ok:hit,cap:q.cap,titulo:q.tag,t:Date.now(),sim:true})});
let kt=0,kh=0;SIM.K.forEach(id=>{const k=KBY[id];k.p.forEach((P,i)=>{const ans=(SIM.txt[id+':'+i]||'').trim();kt+=P.c.length;if(!ans)return;const hit=autoHits(P,ans);kh+=hit.length;
kput(id,i,{texto:ans,chk:hit,self:Math.round(hit.length/P.c.length*100),shown:true})})});
const nobj=SIM.Q.length,pct=nobj?Math.round(ok/nobj*100):0,pctk=kt?Math.round(kh/kt*100):0,over=Math.max(0,SIM.acc-SIM.lim);
SIM.res={ok,nobj,pct,pctk,nk:SIM.K.length,dur:SIM.acc,over};SIM.fase='fim';simSave();
CAD.put('sim_'+Date.now().toString(36),{tipo:'sim',t:Date.now(),ok,nobj,pct,pctk,nk:SIM.K.length,dur:SIM.acc,over,caps:SIM.cfg.caps});
const answered=SIM.Q.filter(id=>SIM.pick[id]!=null).length;gain(answered*2+ok*5+(pct>=80&&nobj>=5?20:0),'simulado entregue',pct>=80);if(pct>=80&&nobj>=5)confetti(160);
checkMedals();checkMissions();gsave();renderHero();renderQuest();renderProva();window.scrollTo(0,0)}
function simResult(){const box=$('#v-prova');const r=SIM.res;
const byCap=D.caps.map(c=>{const L=SIM.Q.filter(id=>QBY[id].cap===c.n);if(!L.length)return '';const k=L.filter(id=>SIM.pick[id]===QBY[id].ok).length;const p=Math.round(k/L.length*100);return `<div class="simcap"><span>${c.n}. ${esc(c.short)}</span><i><b style="width:${p}%;background:${p>=70?'var(--green)':p>=50?'var(--amber)':'var(--brick)'}"></b></i><span>${k}/${L.length}</span></div>`}).join('');
const rev=SIM.Q.map((id,n)=>{const q=QBY[id];const pk=SIM.pick[id];const hit=pk===q.ok;return `<div class="q done" id="sq-${q.id}"><div class="qh"><span>${n+1}. ${hit?'✔':pk==null?'— em branco':'✘'} · ${esc(q.orig||q.tag)}</span><span>${q.pct?q.pct+'% acertaram':''}</span></div><div class="en">${q.enun}</div><div class="al">${q.alts.map((a,i)=>`<button class="${i===q.ok?'ok':i===pk?'bad':''}" disabled>${String.fromCharCode(65+i)}) ${a}</button>`).join('')}</div><div class="why" style="display:block">${q.coment}<div style="margin-top:6px">${q.blk.map(b=>BYID[b]?`<button class="go" data-blk="${b}">🎧 rever: ${esc(BYID[b].t)}</button>`:'').join('<br>')}</div></div></div>`}).join('');
const kr=SIM.K.map(id=>{const k=KBY[id];return `<div class="caso"><div class="khead"><span class="klab">✍️ CASO DO SIMULADO</span><b>${esc(k.t)}</b></div>${k.p.map((P,i)=>{const v=kget(id,i);return `<div class="kq shown"><div class="kp"><b>${String.fromCharCode(97+i)})</b> ${P.p}</div><div class="xs">Sua resposta: ${esc(v.texto||'(em branco)')}</div><div class="xs">Correção automática: <b>${v.self!=null?v.self+'%':'—'}</b>${v.chk&&P.c.length>v.chk.length?' · faltou: '+P.c.filter((c,j)=>!(v.chk||[]).includes(j)).map(esc).join(' · '):''}</div><div class="kmod" style="display:block"><div class="klab">RESPOSTA-MODELO</div>${P.m}</div></div>`}).join('')}<div class="kfoot"><button class="go" data-kgo="${id}">🤖 abrir em Casos para a correção do Claude</button></div></div>`}).join('');
const msg=r.nobj?(r.pct>=80?'Aprovado. Não se acostume.':r.pct>=60?'Passou raspando. Revisa os erros antes de comemorar.':'Reprovado no simulado. Ainda bem que foi o simulado. Revisa os erros comigo.'):'Casos entregues. Agora compara com o modelo.';
box.innerHTML=`<h2 class="sec">⏱️ Resultado do simulado</h2><div class="simres">${r.nobj?`<div><b>${r.pct}%</b><span>objetivas · ${r.ok}/${r.nobj}</span></div>`:''}${r.nk?`<div><b>${r.pctk}%</b><span>casos (correção automática)</span></div>`:''}<div><b>${mmss(r.dur)}</b><span>tempo usado${r.over?' · <span style="color:var(--brick)">estourou '+mmss(r.over)+'</span>':''}</span></div></div>
<div class="intro">🦍 <b>Dr. Gorila:</b> ${esc(msg)}</div>${byCap?`<h3 style="margin:16px 0 6px">Por capítulo</h3>${byCap}`:''}
<div class="kbtns" style="margin:14px 0"><button class="big next" id="simnew">Novo simulado</button><button class="pill" data-v2="flash">🃏 Revisar erros no Meu flash</button></div>
${rev?`<h3 style="margin:16px 0 8px">Revisão das objetivas</h3>${rev}`:''}${kr?`<h3 style="margin:16px 0 8px">Casos</h3>${kr}`:''}`}
$('#v-prova').addEventListener('click',e=>{const t=e.target;const sv=$('#v-prova')._sv;
const st=t.closest('[data-simt]');if(st){simCfgRead();sv.tipo=st.dataset.simt;LS.set('simcfg',sv);renderProva();return}
const sc=t.closest('[data-simc]');if(sc){simCfgRead();const v=sc.dataset.simc;if(v==='all')sv.caps=D.caps.map(c=>c.n);else{const n=+v;sv.caps=sv.caps.includes(n)?sv.caps.filter(x=>x!==n):sv.caps.concat(n);if(!sv.caps.length)sv.caps=[n]}LS.set('simcfg',sv);renderProva();return}
const sf=t.closest('[data-simf]');if(sf){simCfgRead();sv.fonte=sf.dataset.simf;LS.set('simcfg',sv);renderProva();return}
if(t.id==='simgo'){simStart();return}
if(t.id==='simnew'){SIM=null;simSave();renderProva();return}
if(!SIM||SIM.fase!=='run')return;
const pk=t.closest('[data-simpick]');if(pk){SIM.pick[simItems()[SIM.i].id]=+pk.dataset.simpick;simSave();simRun();return}
const si=t.closest('[data-simi]');if(si){SIM.i=+si.dataset.simi;simSave();simRun();window.scrollTo(0,0);return}
if(t.id==='simprev'&&SIM.i>0){SIM.i--;simSave();simRun();return}
if(t.id==='simnext'){const n=simItems().length;if(SIM.i<n-1){SIM.i++;simSave();simRun();window.scrollTo(0,0)}else t.closest('.simnav')&&$('#simend').click();return}
if(t.id==='simflag'){SIM.flag[SIM.i]=!SIM.flag[SIM.i];simSave();simRun();return}
if(t.id==='simpause'){if(SIM.run){SIM.acc+=Date.now()-SIM.run;SIM.run=0}else SIM.run=Date.now();simSave();simRun();return}
if(t.id==='simend'){const it=simItems();const blank=it.filter(x=>x.t==='q'?SIM.pick[x.id]==null:!KBY[x.id].p.some((p,j)=>(SIM.txt[x.id+':'+j]||'').trim())).length;const fl=Object.values(SIM.flag).filter(Boolean).length;
if(!confirm(`Entregar o simulado?${blank?`\n${blank} em branco.`:''}${fl?`\n${fl} marcada(s) para revisar.`:''}`))return;simEnd()}});
$('#v-prova').addEventListener('input',e=>{const ta=e.target.closest('[data-simk]');if(!ta||!SIM)return;SIM.txt[ta.dataset.simk]=ta.value;clearTimeout(ta._t);ta._t=setTimeout(simSave,500)});
document.addEventListener('keydown',e=>{if(!$('#v-prova').classList.contains('on')||!SIM||SIM.fase!=='run'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
if(e.key==='ArrowRight')$('#simnext')&&$('#simnext').click();if(e.key==='ArrowLeft')$('#simprev')&&$('#simprev').click();const n='abcde'.indexOf(e.key.toLowerCase());if(n>=0){const b=document.querySelector(`[data-simpick="${n}"]`);if(b)b.click()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SIM&&SIM.fase==='run'&&$('#v-prova').classList.contains('on'))simTick()});
{const _shP=show;show=function(v,sc){_shP(v,sc);document.body.classList.toggle('provamode',v==='prova');if(v==='prova')renderProva();else clearInterval(SIMT)}}

renderMapa();applyF();renderQuest();renderAula();renderVesp();renderCola();renderDiv();
renderHero();show('aula');CAD.init().then(()=>{const r=CAD.all().game_state;if(r&&r.xp>GS.xp){Object.assign(GS,r,{combo:0});LS.set('game',GS);renderHero()}paintMission()});
</script>
