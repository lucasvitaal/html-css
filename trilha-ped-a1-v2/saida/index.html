o. Apresenta dezenas de pápulas peroladas, cor da pele, com depressão central, assintomáticas, no tronco. A mãe pergunta se é obrigatório tratar. Qual resposta está de acordo com a aula?", "alts": ["Não é obrigatório: é autolimitado, some em 6 meses a 2 anos; se tratar, há expressão manual com iodo, substâncias químicas ou laser/crioterapia.", "Sim: é causado por HPV e sempre deve ser tratado com ácido salicílico sob oclusão.", "Sim: é infecção fúngica e exige cetoconazol tópico por 30 dias.", "Não, mas ela deve suspender o tratamento da dermatite atópica, que causou as lesões."], "ok": 0, "coment": "<p><b>A.<\/b> Slides 50–51. A piscina e a atopia são exatamente os fatores do slide 50.<\/p>\n<p><b>B<\/b> errada: HPV causa verruga (ácido salicílico é o tratamento da verruga). <b>C<\/b> errada: o agente é um <b>poxvírus<\/b>. <b>D<\/b> errada: a atopia torna a criança mais suscetível, mas não se suspende o controle da doença de base.<\/p>", "blk": ["d_vir"], "slides": [], "pct": null}, {"id": "q01_6", "cap": 1, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Dermatite das fraldas", "tag": "Dermatite das fraldas", "enun": "Lactente de 5 meses, 7 kg, com eritema vivo na região das fraldas que invade as dobras inguinais, com pequenas pápulas satélites nas bordas, há 6 dias, sem melhora com creme de óxido de zinco. Qual é a melhor conduta?", "alts": ["Manter só o creme de barreira e aumentar a frequência de trocas.", "Tratar como infecção fúngica: nistatina ou miconazol 1% por 14 dias, mantendo os cuidados com a fralda.", "Corticoide tópico de média potência por 14 dias.", "Antibiótico oral, pois há lesões satélites."], "ok": 1, "coment": "<p><b>B.<\/b> Acometimento de dobras e lesões satélites sugerem <i>Candida<\/i>  <i>(Sl. 48)<\/i>; o slide 29 indica <b>nistatina ou miconazol 1% (14 dias) se infecção fúngica<\/b> (o slide 49 dá nistatina creme 6/6 h por 7–14 dias).<\/p>\n<p><b>A<\/b> errada: barreira isolada não trata candidíase. <b>C<\/b> errada: o slide só admite corticoide de <b>baixa<\/b> potência, por <b>2–3 dias<\/b>, e para hiperemia intensa. <b>D<\/b> errada: não há indicação de antibiótico.<\/p>", "blk": ["d_frald"], "slides": [], "pct": null}, {"id": "q02_1", "cap": 2, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Reconhecimento", "tag": "Reconhecimento", "enun": "Lactente de 10 meses, 9 kg, com febre de 39,5 °C por 3 dias, sem tosse ou coriza, ativo entre os picos. Iniciou amoxicilina ontem à noite; a febre desapareceu e hoje surgiram máculas róseas no tronco que se espalham para o pescoço. Bom estado geral. Qual a conduta?", "alts": ["Trocar amoxicilina por azitromicina, pela alergia.", "Manter amoxicilina até completar 10 dias.", "Diagnosticar exantema súbito, suspender o antimicrobiano e manter observação.", "Coletar sorologia para sarampo e notificar."], "ok": 2, "coment": "<p><b>C.<\/b> Lactente, febre alta sem toxemia que cessa em crise e exantema no tronco = exantema súbito  <i>(Sl. 80)<\/i>; se a indicação do antibiótico estava errada, suspende-se  <i>(S41 B02 25:59–28:39)<\/i>.<\/p><p><b>A<\/b>: não é alergia — a coincidência temporal é da doença. <b>B<\/b>: não há infecção bacteriana. <b>D<\/b>: sarampo teria pródromo catarral, Koplik e exantema retroauricular com febre subindo.<\/p>", "blk": ["e_subito"], "slides": [], "pct": null}, {"id": "q02_2", "cap": 2, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Profilaxia do sarampo", "tag": "Profilaxia do sarampo", "enun": "Em uma creche, confirmou-se sarampo em uma criança. Um lactente de 8 meses (8 kg), não vacinado, teve contato há 2 dias; outro, de 4 meses, também há 2 dias. Segundo o MEDCURSO, qual a conduta para cada um?", "alts": ["Imunoglobulina para ambos.", "Vacina de bloqueio para o de 8 meses (dose extra, não vale para rotina) e imunoglobulina para o de 4 meses.", "Vacina para ambos, pois estão dentro de 72 horas.", "Nada; abaixo de 12 meses não se faz profilaxia."], "ok": 1, "coment": "<p><b>B.<\/b> Bloqueio a partir de 6 meses até 72 h; imunoglobulina para &lt; 6 meses até 6 dias  <i>(S41 B01 28:58–32:16)<\/i>; a dose entre 6 e 11 meses não é válida para a rotina  <i>(B01 33:35–34:53)<\/i>.<\/p><p>Atenção: o <b>slide 28<\/b> indica imunoglobulina para <b>&lt; 1 ano<\/b> — pela régua da professora, ambos receberiam imunoglobulina (alternativa A). Numa prova da faculdade, siga o slide.<\/p>", "blk": ["e_sarprof"], "slides": [], "pct": null}, {"id": "q02_3", "cap": 2, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Varicela no berçário", "tag": "Varicela no berçário", "enun": "RN prematuro de 30 semanas, 1.400 g, internado na UTI neonatal, foi exposto há 24 h a um visitante com varicela. A mãe teve varicela na infância. E se a mãe nunca tivesse tido varicela? Qual a sequência correta de condutas?", "alts": ["VZIG nos dois cenários.", "Mãe com varicela prévia: observar; mãe sem história (ou sorologia negativa): VZIG até 96 h.", "Vacina de bloqueio nos dois cenários.", "Aciclovir venoso profilático nos dois cenários."], "ok": 1, "coment": "<p><b>B.<\/b> Prematuro ≥ 28 semanas só recebe VZIG se a mãe não tem história de varicela  <i>(Sl. 67)<\/i> — recebeu anticorpos transplacentários  <i>(S41 B03 29:59–31:19)<\/i>.<\/p><p><b>A<\/b> seria correta se tivesse &lt; 28 semanas ou &lt; 1.000 g. <b>C<\/b>: vacina só a partir de 9 meses. <b>D<\/b>: aciclovir é tratamento, não profilaxia pós-exposição da aula.<\/p>", "blk": ["e_varprof"], "slides": [], "pct": null}, {"id": "q02_4", "cap": 2, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Escarlatina × Kawasaki", "tag": "Escarlatina × Kawasaki", "enun": "Menina de 7 anos, 24 kg, com febre há 2 dias, odinofagia, exsudato amigdaliano, exantema micropapular áspero no tronco, palidez perioral e acentuação em pregas de cotovelo. Sem conjuntivite. Qual o diagnóstico e o tratamento com penicilina benzatina?", "alts": ["Kawasaki; imunoglobulina 2 g/kg.", "Escarlatina; penicilina benzatina 600.000 UI IM dose única.", "Escarlatina; penicilina benzatina 1.200.000 UI IM dose única.", "Mononucleose; sintomáticos."], "ok": 1, "coment": "<p><b>B.<\/b> Lixa + Filatov + Pastia + faringite exsudativa = escarlatina; com <b>24 kg<\/b> (&lt; 25 kg), 600.000 UI  <i>(Sl. 53)<\/i>.<\/p><p><b>A<\/b>: Kawasaki exige febre ≥ 5 dias, conjuntivite e não tem exsudato  <i>(S41 B04 24:38–25:51)<\/i>. <b>C<\/b>: dose de &gt; 25 kg. <b>D<\/b>: mono não tem Filatov/Pastia; o exantema viria após amoxicilina.<\/p>", "blk": ["e_escarl", "e_kawa"], "slides": [], "pct": null}, {"id": "q02_5", "cap": 2, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Eritema infeccioso", "tag": "Eritema infeccioso", "enun": "Escolar de 8 anos, 27 kg, com anemia falciforme, chega pálida e prostrada. Há 10 dias um colega teve “bochechas vermelhas”. Hb caiu de 8 para 4,5 g/dL; reticulócitos muito baixos. Qual a explicação e o cuidado na internação?", "alts": ["Sequestro esplênico; pode dividir quarto com outras falcêmicas.", "Crise hiper-hemolítica; reticulocitose esperada.", "Crise aplásica transitória pelo parvovírus B19; transfusão e isolamento de outras crianças com hemoglobinopatia.", "Eritema infeccioso típico; alta com antitérmico."], "ok": 2, "coment": "<p><b>C.<\/b> B19 interrompe a eritropoiese → anemia com <b>reticulocitopenia<\/b>; nessa fase a criança é contagiosa  <i>(S41 B02 21:44–24:46)<\/i>. O slide prevê <b>transfusão em anemia grave<\/b>  <i>(Sl. 78)<\/i> e alerta para hemoglobinopatas  <i>(Sl. 72, 77)<\/i>.<\/p><p><b>A/B<\/b> cursariam com reticulocitose. <b>D<\/b>: ignora a anemia grave.<\/p>", "blk": ["e_b19"], "slides": [], "pct": null}, {"id": "qa_saramp", "cap": 2, "src": "antiga", "orig": "Prova A1 (7 pts) · Q7 objetiva — caiu 2×", "tag": "prova antiga · 2×", "enun": "Sarah, 3 anos, há 3 dias com tosse, febre alta, coriza e conjuntivite. Hoje os sinais pioraram e surgiram manchas vermelhas <b>retroauriculares acompanhando a linha de implantação do cabelo<\/b>. Diagnóstico?", "alts": ["Rubéola", "Eritema infeccioso", "Sarampo", "Exantema súbito"], "ok": 2, "coment": "<b>C — Sarampo.<\/b> Pródromo dos 3 C com febre alta e exantema que começa atrás das orelhas/linha do cabelo e desce, no auge dos sintomas. <b>A<\/b>: rubéola é mais leve e tem adenomegalia retroauricular/occipital. <b>B<\/b>: face esbofeteada. <b>D<\/b>: exantema quando a febre cai.", "blk": ["e_saramp"], "slides": [], "pct": null}, {"id": "qa_mono", "cap": 2, "src": "antiga", "orig": "Prova A1 (7 pts) · Q8 objetiva — caiu 2×", "tag": "prova antiga · 2×", "enun": "Luís, 15 anos, há 2 semanas com febre baixa, tosse, mal-estar, fadiga e odinofagia. Tomou por conta própria um antibiótico e surgiu rash difuso. Exame: linfadenopatia generalizada, esplenomegalia e edema palpebral. Hemograma: linfocitose com grande atipia linfocitária. Diagnóstico?", "alts": ["Mononucleose", "Escarlatina", "Eritema infeccioso", "Dengue"], "ok": 0, "coment": "<b>A — Mononucleose (EBV).<\/b> Febre + faringite + adenomegalia generalizada, esplenomegalia, edema palpebral (Hoagland), linfócitos atípicos e exantema após amoxicilina/ampicilina. <b>B<\/b>: não há lixa/Filatov/Pastia. <b>C<\/b>: face esbofeteada. <b>D<\/b>: dengue tem leucopenia, não linfocitose atípica com esplenomegalia.", "blk": ["e_mono"], "slides": [], "pct": null}, {"id": "q03_1", "cap": 3, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Definição e conduta", "tag": "Definição e conduta", "enun": "Menino de 7 anos, 24 kg, com dor periumbilical 1–2 vezes por semana há 8 meses, sem relação com evacuações, que o faz faltar à escola. Crescimento no canal, exame físico normal, sem febre, vômitos ou sangramentos. Pais muito ansiosos, já com 6 parasitológicos negativos. Qual a melhor conduta?", "alts": ["Endoscopia digestiva alta e tomografia de abdome para afastar causa orgânica.", "Tranquilizar dizendo que “não é nada” e dar alta.", "Abordagem ambulatorial detalhada (entrevistar criança e pais separadamente, investigar estressores), orientar os pais sobre sinais de alerta e acompanhar.", "Tratar empiricamente para parasitose, repetindo o antiparasitário a cada 3 meses."], "ok": 2, "coment": "<p><b>C.<\/b> Dor recorrente (≥ 3 episódios/3 meses, interferindo nas atividades) sem nenhum sinal de alerta: 90–95% funcional  <i>(Sl. 16, 22)<\/i>; conduta: abordagem ambulatorial e orientação sobre alertas  <i>(Sl. 24)<\/i>.<\/p><p><b>A<\/b> e <b>B<\/b> são os dois erros do slide 10 (investigação extensa × atitude simplista). <b>D<\/b>: o próprio slide põe “antiparasitário (?)” com interrogação.<\/p>", "blk": ["c_geral", "c_abd"], "slides": [], "pct": null}, {"id": "q03_2", "cap": 3, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Sinal de alerta", "tag": "Sinal de alerta", "enun": "Menina de 9 anos, 25 kg, com dor abdominal recorrente há 1 ano. Qual achado <b>mais<\/b> justifica investigação de causa orgânica?", "alts": ["Dor periumbilical que melhora após evacuar.", "Crises desencadeadas antes de provas escolares.", "Queda do peso e da velocidade de crescimento na curva nos últimos 12 meses.", "Mãe com cefaleia tensional."], "ok": 2, "coment": "<p><b>C.<\/b> Perda de peso e parada/desaceleração do crescimento são sinal de alerta explícito  <i>(Sl. 22)<\/i>; o peso é o parâmetro mais sensível a doença  <i>(S26 Aval. 10:52–11:10)<\/i>.<\/p><p><b>A<\/b>: sugere disfunção funcional (intestino irritável). <b>B<\/b>: estresse é desencadeante funcional. <b>D<\/b>: a história familiar de alerta é de doença <b>orgânica<\/b> GI (péptica, DII, celíaca).<\/p>", "blk": ["c_abdal"], "slides": [], "pct": null}, {"id": "q03_3", "cap": 3, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Dor em membros", "tag": "Dor em membros", "enun": "Escolar de 8 anos, 27 kg, acorda algumas noites chorando com dor nas duas pernas (panturrilhas e atrás dos joelhos), que passa em 15 minutos com massagem. Brinca normalmente de dia. Exame físico normal. Qual conduta?", "alts": ["Diagnosticar dor de crescimento, explicar o caráter benigno e orientar calor/massagem e sinais de alerta.", "Radiografia e cintilografia óssea pela dor noturna.", "Encaminhar à reumatologia por fibromialgia.", "Hemograma e VHS obrigatórios antes de qualquer orientação."], "ok": 0, "coment": "<p><b>A.<\/b> Bilateral, difusa, curta, noturna, melhora com massagem, exame normal: dor de crescimento  <i>(Sl. 27)<\/i>; prognóstico benigno  <i>(Sl. 36)<\/i>.<\/p><p><b>B<\/b>: acordar a criança é esperado na dor de crescimento (ver divergência). <b>C<\/b>: fibromialgia é de adolescentes, com tender points, sono e humor. <b>D<\/b>: o laboratório do slide 34 é útil, mas o slide manda aprofundar se houver sinal de alerta.<\/p>", "blk": ["c_cresc"], "slides": [], "pct": null}, {"id": "q03_4", "cap": 3, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Cefaleia", "tag": "Cefaleia", "enun": "Menino de 4 anos, 16 kg, com cefaleia há 2 meses, pior ao acordar, com vômitos cada vez mais frequentes, e que piora ao abaixar a cabeça. PA normal. Qual a hipótese que deve ser afastada com prioridade?", "alts": ["Migrânea sem aura.", "Cefaleia tensional por dificuldade escolar.", "Processo expansivo com hipertensão intracraniana.", "Sinusite frontal."], "ok": 2, "coment": "<p><b>C.<\/b> Matinal, progressiva, vômitos crescentes, piora com mudança de posição da cabeça e idade &lt; 5 anos são alertas  <i>(Sl. 41, 43)<\/i>.<\/p><p><b>A/B<\/b>: primárias, diagnóstico após afastar alertas. <b>D<\/b>: em menor de 5 anos o seio frontal <b>não existe<\/b>  <i>(S33 02:42–03:05)<\/i>.<\/p>", "blk": ["c_cefal_al", "c_cefal"], "slides": [], "pct": null}, {"id": "q04_1", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Adenite aguda", "tag": "Adenite aguda", "enun": "Menino de 5 anos, 18 kg, com febre há 3 dias e “caroço” doloroso no ângulo da mandíbula à direita, de 3 cm, com pele avermelhada e quente. Teve impetigo na face há uma semana. Bom estado geral, sem hepatoesplenomegalia. Hemograma com leucocitose e neutrofilia; PCR elevada. Qual a conduta?", "alts": ["Biópsia excisional imediata, pelo tamanho acima de 2,5 cm.", "Sorologias para EBV, CMV e toxoplasmose e observação sem antibiótico.", "Antibiótico oral com cobertura para <i>S. aureus<\/i> e estreptococo (ex.: cefalexina 25–50 mg/kg/dia de 6/6 h), por 10 dias, reavaliando em 24–48 h e a necessidade de drenagem.", "Mielograma, pela leucocitose."], "ok": 2, "coment": "<p><b>C.<\/b> Localizada, sem gravidade, inflamada, cervical superior, com porta de entrada (piodermite) = adenite  <i>(Sl. 26)<\/i>; dose e reavaliação  <i>(Sl. 29)<\/i>.<\/p><p><b>A<\/b>: o tamanho isolado não indica biópsia num gânglio agudo com sinais inflamatórios; biópsia é se não melhorar ou persistir &gt; 4 semanas  <i>(Sl. 23, 26)<\/i>. <b>B<\/b>: sorologias são do fluxograma de adenomegalia <b>generalizada<\/b>  <i>(Sl. 33)<\/i>. <b>D<\/b>: mielograma é para blastos/pancitopenia, não para leucocitose neutrofílica  <i>(Sl. 30, 34)<\/i>.<\/p>", "blk": ["a_adenite"], "slides": [], "pct": null}, {"id": "q04_2", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Generalizada com comprometimento", "tag": "Generalizada com comprometimento", "enun": "Menina de 6 anos, 17 kg (perdeu 2 kg em um mês), febre baixa há 10 dias sem foco, palidez intensa, petéquias em membros, fígado a 4 cm e baço a 3 cm do rebordo, gânglios cervicais, axilares e inguinais. Qual o próximo passo mais importante?", "alts": ["Biópsia do maior gânglio cervical.", "Hemograma — e, se blastos ou pancitopenia, mielograma.", "Antibiótico empírico por 10 dias e reavaliar.", "PPD e tomografia de tórax."], "ok": 1, "coment": "<p><b>B.<\/b> É o caso 2 da aula e o fluxograma do slide 34: generalizada com estado geral comprometido → hemograma; blastos/pancitopenia → mielograma. Petéquias e palidez sugerem falência medular (leucemia)  <i>(Sl. 46)<\/i>.<\/p><p><b>A<\/b>: a biópsia do gânglio é o passo quando hemograma e RX são normais  <i>(Sl. 34)<\/i>. <b>C<\/b>: não há foco para adenite, e atrasar o diagnóstico é o erro que a aula condena  <i>(Sl. 37, 42)<\/i>. <b>D<\/b>: PPD e TC vêm se o RX de tórax estiver alterado.<\/p>", "blk": ["a_grav", "a_leuc"], "slides": [], "pct": null}, {"id": "q04_3", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Supraclavicular", "tag": "Supraclavicular", "enun": "Adolescente de 14 anos, 50 kg, com linfonodo supraclavicular <b>esquerdo<\/b> endurecido, indolor, aderido, de 3 cm, há 5 semanas. Qual a interpretação correta?", "alts": ["Provável hiperplasia reacional; reavaliar em 6 meses.", "Sugere lesão intratorácica; pedir apenas RX de tórax.", "Sugere lesão intra-abdominal (tumor ou processo inflamatório); investigar e indicar biópsia.", "Sugere adenite piogênica; tratar com clindamicina."], "ok": 2, "coment": "<p><b>C.<\/b> Supraclavicular esquerda → abdome  <i>(Sl. 21, 30)<\/i>; supraclavicular, &gt; 4 semanas, duro, aderido = biópsia  <i>(Sl. 12, 23, 24)<\/i>.<\/p><p><b>A<\/b>: supraclavicular nunca é “só reacional”. <b>B<\/b>: intratorácica é a <b>direita<\/b>. <b>D<\/b>: não tem nenhum sinal inflamatório (dor, flutuação, pele).<\/p>", "blk": ["a_infl"], "slides": [], "pct": null}, {"id": "q04_4", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Pós-BCG (segundo a aula)", "tag": "Pós-BCG (segundo a aula)", "enun": "Lactente de 3 meses, 6 kg, vacinado com BCG ao nascer, com linfonodo na axila direita, bom estado geral, sem outros achados. Segundo a aula da faculdade, qual a conduta?", "alts": ["Punção aspirativa e cultura para micobactéria.", "Notificar e iniciar isoniazida.", "Biópsia excisional pela localização atípica.", "Cefalexina por 10 dias."], "ok": 1, "coment": "<p><b>B<\/b> — é o que diz o slide 32 (“com ou sem sinais flogísticos”). No MEDCURSO, isoniazida é para linfadenopatia <b>supurada<\/b>; gânglio &lt; 3 cm é evolução esperada em ~10% e &gt; 3 cm não supurado só se acompanha  <i>(S27 03:38–09:58)<\/i> — ver a divergência no bloco C.<\/p><p><b>A<\/b>: gânglio pós-BCG supurado <b>não se punciona<\/b>  <i>(S27 07:14–09:58)<\/i>. <b>C<\/b>: a axila direita é exatamente a drenagem do deltoide direito vacinado. <b>D<\/b>: não é adenite piogênica.<\/p>", "blk": ["a_bcg"], "slides": [], "pct": null}, {"id": "q04_5", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Leucocoria", "tag": "Leucocoria", "enun": "Mãe de menino de 18 meses, 11 kg, nota em fotos com flash que um dos olhos “brilha branco”. Qual a hipótese a afastar e a conduta?", "alts": ["Estrabismo fisiológico; reavaliar aos 3 anos.", "Conjuntivite; colírio antibiótico.", "Retinoblastoma; encaminhar imediatamente ao oftalmologista.", "Repetir o teste do reflexo vermelho em 1 mês."], "ok": 2, "coment": "<p><b>C.<\/b> Leucocoria ocorre em mais de 50% dos retinoblastomas, com média de diagnóstico aos 2 anos  <i>(Sl. 53)<\/i>. Teste alterado ou leucocoria → <b>não repetir, encaminhar imediatamente<\/b>  <i>(01 Triagem 35:33–35:59)<\/i>.<\/p><p><b>A<\/b>: estrabismo recente também é alerta (campanha, Sl. 58–62). <b>B<\/b>: conjuntivite não altera o reflexo pupilar. <b>D<\/b>: repetir atrasa o diagnóstico.<\/p>", "blk": ["a_solidos"], "slides": [], "pct": null}, {"id": "q04_6", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Massa abdominal", "tag": "Massa abdominal", "enun": "Menina de 3 anos e meio, 15 kg, em bom estado geral; a mãe percebeu no banho um “endurecimento” no flanco esquerdo. PA acima do esperado para a idade; EAS com hematúria. Qual a hipótese mais provável?", "alts": ["Neuroblastoma.", "Tumor de Wilms.", "Malformação congênita benigna.", "Linfoma de Burkitt."], "ok": 1, "coment": "<p><b>B.<\/b> Wilms: pico 3–4 anos, massa assintomática achada pelos pais (60%), HAS (25%), hematúria (15%)  <i>(Sl. 52)<\/i>; hematúria → Wilms no quadro 5  <i>(Sl. 43)<\/i>.<\/p><p><b>A<\/b>: neuroblastoma tem pico aos 2 anos e criança doente (dor óssea, febre, perda de peso). <b>C<\/b>: malformação benigna é a massa do <b>período neonatal<\/b>. <b>D<\/b>: Burkitt dá massa abdominal, mas não HAS/hematúria como marca.<\/p>", "blk": ["a_solidos"], "slides": [], "pct": null}, {"id": "q04_7", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 7 · Cefaleia", "tag": "Cefaleia", "enun": "Menino de 7 anos, 22 kg, com cefaleia há 1 mês, que o acorda de madrugada e vem com vômitos pela manhã. A professora nota queda do rendimento escolar; ao exame, marcha com base alargada. Qual afirmação é correta?", "alts": ["Sem convulsão, tumor cerebral é improvável.", "É quadro sugestivo de tumor cerebral: cefaleia com padrão de alerta e achado neurológico, presente em 95% desses casos.", "Trata-se de migrânea, frequente nessa idade.", "Tumor cerebral é raro em crianças; investigar só se houver papiledema."], "ok": 1, "coment": "<p><b>B.<\/b> Cefaleia que acorda, matinal com vômitos, queda do rendimento e alteração da marcha  <i>(Sl. 50)<\/i>; 95% têm achados neurológicos  <i>(Sl. 49)<\/i>.<\/p><p><b>A<\/b>: convulsão é só um dos sinais. <b>C<\/b>: migrânea não explica marcha alterada. <b>D<\/b>: é o <b>tumor sólido maligno mais comum<\/b> da criança  <i>(Sl. 49)<\/i>.<\/p>", "blk": ["a_solidos"], "slides": [], "pct": null}, {"id": "q04_8", "cap": 4, "src": "autoral", "orig": "Trilha 1.0 · Questão 8 · Mediastino", "tag": "Mediastino", "enun": "Adolescente de 13 anos, 40 kg, com tosse seca há 3 semanas e agora dispneia ao deitar. RX de tórax: alargamento do mediastino e derrame pleural. Qual o diagnóstico mais provável e o cuidado imediato?", "alts": ["Pneumonia com derrame; antibiótico e alta.", "Sombra tímica fisiológica; tranquilizar.", "Linfoma linfoblástico; risco de compressão da via aérea — investigação urgente.", "Linfoma de Burkitt; massa mandibular."], "ok": 2, "coment": "<p><b>C.<\/b> Linfoma linfoblástico: &gt; 10 anos, mediastino em 50–70%, derrame, desconforto respiratório grave por compressão  <i>(Sl. 48)<\/i>; tosse → massa mediastinal  <i>(Sl. 43)<\/i>.<\/p><p><b>A<\/b>: tosse no quadro 5 tem infecção no diferencial, mas mediastino alargado é alerta  <i>(Sl. 44)<\/i>. <b>B<\/b>: sombra tímica é até 3 anos  <i>(Sl. 9)<\/i>. <b>D<\/b>: Burkitt é &lt; 10 anos, abdome ou mandíbula.<\/p>", "blk": ["a_leuc"], "slides": [], "pct": null}, {"id": "q05_1", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Bebê sacudido", "tag": "Bebê sacudido", "enun": "Lactente de 4 meses, 6 kg, trazido pelo padrasto à emergência por “moleza e vômitos desde a manhã”, sem febre. Nega queda. Está sonolento, com fontanela abaulada e sem nenhum hematoma ou escoriação no couro cabeludo. A tomografia mostra hematoma subdural, e a fundoscopia, hemorragias retinianas bilaterais. Qual a hipótese mais provável?", "alts": ["Meningite bacteriana.", "Queda acidental do trocador não relatada.", "Síndrome do bebê sacudido.", "Síndrome de Munchausen por procuração."], "ok": 2, "coment": "<p><b>C.<\/b> Hematoma subdural + hemorragia retiniana + ausência de trauma craniano, em menor de 6 meses, é a tríade do slide 36; é a causa mais comum de TCE fechado grave em menores de 1 ano  <i>(Sl. 34–36)<\/i>.<\/p><p><b>A<\/b>: não há febre, e meningite não produz hematoma subdural com hemorragia retiniana. <b>B<\/b>: queda de baixa altura não explica lesão grave sem marca externa — é a “falta de elementos que expliquem a lesão” do slide 35. <b>D<\/b>: Munchausen é mentira, simulação ou indução de doença com quadro recorrente, não TCE agudo.<\/p>", "blk": ["v_sacud"], "slides": [], "pct": null}, {"id": "q05_2", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Conduta diante da suspeita", "tag": "Conduta diante da suspeita", "enun": "Menina de 2 anos, 12 kg, atendida no pronto-socorro com três pequenas lesões circulares no dorso, em estágios diferentes de cicatrização. A mãe diz que “encostou no fogão”. O pediatra não tem certeza de que houve agressão. A conduta correta é:", "alts": ["Aguardar a confirmação diagnóstica antes de comunicar qualquer órgão, para não expor a família.", "Registrar boletim de ocorrência na delegacia, que substitui a comunicação ao Conselho Tutelar.", "Tratar as lesões, avaliar o risco real de a criança voltar para casa (internar se necessário) e comunicar a suspeita ao Conselho Tutelar, preenchendo a ficha de notificação.", "Manter o caso em sigilo profissional, por se tratar de informação do prontuário."], "ok": 2, "coment": "<p><b>C.<\/b> Queimaduras circulares (cigarro) em estágios diferentes com história incompatível são sinais de alerta  <i>(Sl. 32, 50)<\/i>; a <b>suspeita<\/b> já obriga a comunicação ao Conselho Tutelar  <i>(Sl. 54–55)<\/i>, e a internação serve quando o risco é real  <i>(Sl. 55–56)<\/i>.<\/p><p><b>A<\/b>: o ECA manda comunicar a suspeita, com multa ao médico que não comunica. <b>B<\/b>: a notificação é para o Conselho Tutelar e “não é e nem vale como denúncia policial”  <i>(Sl. 57)<\/i>. <b>D<\/b>: o dever de notificar é superior ao sigilo  <i>(Sl. 59)<\/i>.<\/p>", "blk": ["v_conduta", "v_fis"], "slides": [], "pct": null}, {"id": "q05_3", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Não confundir", "tag": "Não confundir", "enun": "Lactente de 7 meses, 8 kg, em consulta de rotina. A creche encaminhou por “manchas roxas nas costas”. Há manchas azul-acinzentadas, de cor uniforme, em região sacral e glútea, que a mãe refere existirem desde o nascimento e não mudaram de cor. O restante do exame é normal. Conduta:", "alts": ["Notificar ao Conselho Tutelar por equimoses em área coberta.", "Coagulograma e radiografias de esqueleto.", "Reconhecer manchas mongólicas, tranquilizar a família e registrá-las no prontuário.", "Tentar remover com álcool, pois pode ser tintura da roupa."], "ok": 2, "coment": "<p><b>C.<\/b> Manchas mongólicas “não perdem a cor”  <i>(Sl. 51)<\/i>, são sacrais, presentes desde o nascimento e benignas (ver Cap. 1); documentá-las evita suspeita futura.<\/p><p><b>A<\/b>: equimose muda de cor em dias; não é o caso. <b>B<\/b>: investigação de coagulopatia e fraturas faria sentido diante de equimoses verdadeiras ou múltiplas sem explicação. <b>D<\/b>: a tintura de roupa sai com álcool, mas a história (desde o nascimento, local típico) já define o diagnóstico.<\/p>", "blk": ["v_desconf"], "slides": [], "pct": null}, {"id": "q05_4", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Munchausen por procuração", "tag": "Munchausen por procuração", "enun": "Menino de 5 anos, 18 kg, com a quinta internação no ano por “crises de hematúria e febre” que ocorrem sempre quando está sozinho com a mãe. Uroculturas negativas, exames de imagem normais. A mãe, muito presente e conhecedora de termos médicos, pede novos exames e reclama da equipe. Um irmão morreu no primeiro ano de vida sem causa esclarecida. A melhor interpretação é:", "alts": ["Doença renal rara ainda não diagnosticada; solicitar biópsia.", "Suspeita de síndrome de Munchausen por procuração — forma de abuso físico de diagnóstico difícil e demorado.", "Negligência, pela demora em resolver o quadro.", "Síndrome da criança espancada."], "ok": 1, "coment": "<p><b>B.<\/b> Recorrência, múltiplas internações, insistência em exames, insatisfação com a conduta, sinais só com a mesma pessoa, mãe superenvolvida, óbito inexplicado de irmão e falta de resposta às terapias  <i>(Sl. 38)<\/i>; diagnóstico leva em média 3 a 6 meses  <i>(Sl. 39)<\/i>.<\/p><p><b>A<\/b>: mais exames invasivos é justamente o dano que a síndrome produz. <b>C<\/b>: negligência é omissão de cuidados; aqui há excesso de procura. <b>D<\/b>: criança espancada tem lesões traumáticas de épocas diversas.<\/p>", "blk": ["v_munch"], "slides": [], "pct": null}, {"id": "q05_5", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Abuso sexual", "tag": "Abuso sexual", "enun": "Sobre o abuso sexual na infância, segundo a aula, assinale a correta:", "alts": ["O abusador é, na maioria das vezes, um desconhecido da família.", "Exame físico normal afasta a hipótese.", "Só é abuso quando há contato físico.", "Em cerca de 80% dos casos o abusador é um dos pais ou pessoa com laço afetivo com a família, e o exame físico muitas vezes é normal."], "ok": 3, "coment": "<p><b>D.<\/b> Slides 42 e 43, literalmente.<\/p><p><b>A<\/b>: contraria os 80%  <i>(Sl. 42)<\/i> e o infográfico (pai/padrasto e amigo/conhecido lideram)  <i>(Sl. 11)<\/i>. <b>B<\/b>: “muitas vezes exame físico normal”  <i>(Sl. 43)<\/i>. <b>C<\/b>: “práticas sexuais <b>com ou sem contato<\/b>”  <i>(Sl. 40)<\/i>.<\/p>", "blk": ["v_sex"], "slides": [], "pct": null}, {"id": "q05_6", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Sigilo e ética", "tag": "Sigilo e ética", "enun": "Adolescente de 13 anos, 45 kg, revela em consulta que o padrasto a toca à noite e pede que o médico não conte a ninguém. O médico deve:", "alts": ["Respeitar o pedido, pois o sigilo médico é absoluto na adolescência.", "Orientar a adolescente a procurar a delegacia por conta própria.", "Acolher, anotar o relato sem induzir, explicar à adolescente que precisará acionar a proteção e notificar ao Conselho Tutelar, garantindo acompanhamento multiprofissional.", "Confrontar o padrasto na próxima consulta antes de qualquer notificação."], "ok": 2, "coment": "<p><b>C.<\/b> Ambiente acolhedor, respeitar e anotar, não induzir  <i>(Sl. 56)<\/i>; notificação é dever do médico (art. 28, parágrafo único, CEM)  <i>(Sl. 58)<\/i> e supera o sigilo quando há risco  <i>(Sl. 59)<\/i>; acompanhamento infecto/gineco/psico/social/legal  <i>(Sl. 60)<\/i>.<\/p><p><b>A<\/b>: o sigilo cede ao risco. <b>B<\/b>: transfere à vítima um dever que é do médico. <b>D<\/b>: expõe a vítima e não está na conduta da aula.<\/p>", "blk": ["v_conduta", "v_sex"], "slides": [], "pct": null}, {"id": "q05_7", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 7 · Pista na história", "tag": "Pista na história", "enun": "Qual dos dados abaixo, isoladamente, é o mais sugestivo de violência física num lactente de 5 meses, 7 kg, levado ao pronto-socorro?", "alts": ["Mãe muito ansiosa, que chora durante o atendimento.", "Fratura de fêmur com a explicação de que “ele se virou e caiu do sofá correndo atrás do irmão”.", "Dermatite de fraldas leve nas superfícies convexas.", "Mancha azulada sacral presente desde o nascimento."], "ok": 1, "coment": "<p><b>B.<\/b> Fratura inexplicada em criança que não anda  <i>(Sl. 50)<\/i> + trauma incompatível com idade ou atividade  <i>(Sl. 47)<\/i> + lesão não compatível com o desenvolvimento  <i>(Sl. 32)<\/i>.<\/p><p><b>A<\/b>: ansiedade não é pista; o slide cita pais <b>indiferentes<\/b>. <b>C<\/b>: dermatite leve é comum (ver Cap. 1); a negligência do slide 24 é a forma grave. <b>D<\/b>: mancha mongólica  <i>(Sl. 51)<\/i>.<\/p>", "blk": ["v_fis"], "slides": [], "pct": null}, {"id": "q05_8", "cap": 5, "src": "autoral", "orig": "Trilha 1.0 · Questão 8 · Abuso psicológico e enurese", "tag": "Abuso psicológico e enurese", "enun": "Menina de 8 anos, 26 kg, que estava sem molhar a cama desde os 4 anos, voltou a urinar durante o sono há 2 meses. Ficou mais retraída, chora sem motivo e passou a ter notas baixas. EAS e glicemia normais. O próximo passo mais adequado é:", "alts": ["Tranquilizar: enurese é normal até os 10 anos.", "Iniciar desmopressina e alarme.", "Investigar ativamente situações de violência (entrevista cuidadosa, escuta da criança), por se tratar de enurese secundária com alteração de comportamento.", "Classificar como enurese primária monossintomática de origem genética."], "ok": 2, "coment": "<p><b>C.<\/b> Enurese, choro sem causa, isolamento e problemas escolares são sinais de abuso psicológico  <i>(Sl. 28)<\/i>,  <i>(Sl. 20)<\/i>; enurese secundária exige procurar causa, incluindo violência  <i>(S36 Outros 31:20–31:53)<\/i>.<\/p><p><b>A<\/b>: o corte é 5 anos  <i>(S36 Outros 29:37–30:01)<\/i>. <b>B<\/b>: tratar o sintoma sem procurar a causa. <b>D<\/b>: ela ficou seca por anos — é secundária  <i>(S36 Outros 30:39–31:17)<\/i>.<\/p>", "blk": ["v_neg"], "slides": [], "pct": null}, {"id": "q06_1", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Classificação no lactente", "tag": "Classificação no lactente", "enun": "Lactente de 18 meses, 11 kg, mora em área de transmissão, febre há 3 dias sem foco aparente. Ativo, hidratado, sem vômitos, sem dor abdominal, sem sangramentos; prova do laço negativa. PA e enchimento capilar normais. Qual a classificação e a conduta?", "alts": ["Grupo A — hidratação oral em casa, retorno no 5º dia.", "Grupo B — observação na unidade, hemograma obrigatório e hidratação oral supervisionada de no mínimo 550 mL em 4 a 6 horas.", "Grupo C — internação e SF 0,9% 220 mL em 1 hora.", "Não é caso suspeito, pois não tem 2 sintomas associados à febre."], "ok": 1, "coment": "<p><b>B.<\/b> Criança com febre de 2–7 dias sem foco em área de transmissão já é suspeita  <i>(Sl. 17)<\/i>; <b>&lt; 2 anos<\/b> é condição especial → Grupo B  <i>(Sl. 30)<\/i>; hemograma obrigatório  <i>(Sl. 31)<\/i>; mínimo 50 mL/kg em 4–6 h = 550 mL  <i>(Sl. 32)<\/i>.<\/p><p><b>A<\/b> ignora a idade. <b>C<\/b> exige sinal de alarme, que ele não tem. <b>D<\/b>: na criança, febre sem foco + epidemiologia basta — os “2 sintomas” são do adulto.<\/p>", "blk": ["g_grupos", "g_ab"], "slides": [], "pct": null}, {"id": "q06_2", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Volume do Grupo A", "tag": "Volume do Grupo A", "enun": "Escolar de 7 anos, 22 kg, com dengue suspeita no 2º dia de febre, sem sangramento, prova do laço negativa, sem sinais de alarme e sem comorbidades. Qual orientação de hidratação está de acordo com a aula?", "alts": ["2.860 mL/dia, todo em SRO.", "SF 0,9% 440 mL em 1 hora na unidade.", "Cerca de 1.760 mL/dia, 1/3 em SRO e o restante em líquidos caseiros, com dipirona ou paracetamol para febre.", "1.760 mL/dia e ibuprofeno para a febre alta."], "ok": 2, "coment": "<p><b>C.<\/b> Acima de 20 kg: <b>80 mL/kg/dia<\/b> × 22 = 1.760 mL; SRO = 1/3 das necessidades + líquidos caseiros; antitérmico dipirona ou paracetamol  <i>(Sl. 28)<\/i>.<\/p><p><b>A<\/b> usa 130 mL/kg (faixa até 10 kg) e só SRO. <b>B<\/b> é expansão do Grupo C. <b>D<\/b>: anti-inflamatório não se usa na dengue  <i>(Sl. 28)<\/i>.<\/p>", "blk": ["g_ab"], "slides": [], "pct": null}, {"id": "q06_3", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Sinal de alarme", "tag": "Sinal de alarme", "enun": "Menina de 9 anos, 30 kg, 5º dia de dengue, febre cedeu ontem. Qual achado a coloca, isoladamente, no Grupo C?", "alts": ["Prova do laço positiva com 14 petéquias.", "Exantema maculopapular pruriginoso em tronco.", "Dor abdominal intensa e contínua.", "Leucopenia com linfócitos atípicos."], "ok": 2, "coment": "<p><b>C.<\/b> Dor abdominal intensa e contínua é sinal de alarme; basta 1  <i>(Sl. 18)<\/i>, e alarme = Grupo C  <i>(Sl. 25)<\/i>. A defervescência é o momento típico  <i>(Sl. 15)<\/i>.<\/p><p><b>A<\/b>: laço positivo (≥ 10 na criança) leva ao Grupo B, não ao C  <i>(Sl. 23, 30)<\/i>. <b>B<\/b>: exantema e prurido são da fase febril/recuperação  <i>(Sl. 14, 16)<\/i>. <b>D<\/b>: leucopenia é achado comum da dengue  <i>(Sl. 22)<\/i>.<\/p>", "blk": ["g_def", "g_grupos"], "slides": [], "pct": null}, {"id": "q06_4", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Expansão do Grupo C", "tag": "Expansão do Grupo C", "enun": "Pré-escolar de 4 anos, 16 kg, com dengue no 4º dia, vômitos persistentes e hepatomegalia dolorosa. PA 96 × 60 mmHg, pulsos cheios, enchimento capilar de 2 s. Qual a conduta inicial?", "alts": ["SRO 800 mL em 4 a 6 horas na unidade.", "SF 0,9% ou Ringer 320 mL em 1 hora, até 3 vezes, com reavaliação clínica horária e hematócrito após 2 horas.", "SF 0,9% 320 mL em até 20 minutos e internação em UTI.", "Soro glicosado 5% 320 mL em 1 hora."], "ok": 1, "coment": "<p><b>B.<\/b> Sinais de alarme sem choque = Grupo C: <b>20 mL/kg/hora<\/b> (16 × 20 = 320 mL), até 3×; reavaliação horária, Ht após 2 h  <i>(Sl. 36)<\/i>.<\/p><p><b>A<\/b> é o Grupo B. <b>C<\/b> é o Grupo D — PA não convergente (diferencial 36 mmHg), pulso cheio e TEC 2 s não são choque  <i>(Sl. 19)<\/i>. <b>D<\/b>: expansão é com cristaloide, nunca glicosado  <i>(S30 P2 18:29–20:04)<\/i>.<\/p>", "blk": ["g_cd"], "slides": [], "pct": null}, {"id": "q06_5", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Grupo D", "tag": "Grupo D", "enun": "Escolar de 6 anos, 20 kg, 5º dia de dengue, sonolento, extremidades frias, pulso rápido e fino, enchimento capilar de 4 s, PA 90 × 76 mmHg. Qual a conduta?", "alts": ["SF 0,9% 400 mL em 1 hora, reavaliar em 2 horas.", "Aguardar hemograma e NS1 antes de iniciar volume.", "O₂, acesso calibroso, SF 0,9% ou Ringer 400 mL em até 20 minutos com reavaliação contínua, repetindo até 3 vezes; Ht após 2 horas; UTI.", "Albumina 1 g/kg imediatamente."], "ok": 2, "coment": "<p><b>C.<\/b> Pulso fino, TEC &gt; 2 s e PA convergente (diferencial 14 &lt; 20 mmHg) = choque → Grupo D  <i>(Sl. 19, 38)<\/i>; 20 mL/kg em até 20 min, até 3×, Ht após 2 h  <i>(Sl. 40)<\/i>.<\/p><p><b>A<\/b> é o ritmo do Grupo C. <b>B<\/b>: o manejo não depende de laboratório; hidratar de imediato  <i>(Sl. 21, 26)<\/i>. <b>D<\/b>: albumina só se o Ht sobe e o choque persiste <b>após<\/b> hidratação adequada  <i>(Sl. 41)<\/i>.<\/p>", "blk": ["g_cd", "g_def"], "slides": [], "pct": null}, {"id": "q06_6", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Hematócrito depois da expansão", "tag": "Hematócrito depois da expansão", "enun": "A criança da questão anterior recebeu três expansões de 20 mL/kg. Continua em choque, com melena volumosa; o hematócrito caiu de 48% para 30%. Qual o próximo passo?", "alts": ["Albumina, por persistência do choque.", "Furosemida, por hiper-hidratação.", "Concentrado de hemácias e investigação de coagulopatia (plasma, vitamina K, crioprecipitado conforme necessidade).", "Quarta expansão de cristaloide e observar."], "ok": 2, "coment": "<p><b>C.<\/b> Ht em queda + choque + hemorragia → concentrado de hemácias; investigar coagulopatias  <i>(Sl. 41)<\/i>.<\/p><p><b>A<\/b>: albumina é para Ht em <b>ascensão<\/b>. <b>B<\/b>: diurético é para Ht em queda <b>sem<\/b> sangramento (diluição). <b>D<\/b>: o slide limita a 3 repetições  <i>(Sl. 40)<\/i> e o problema aqui é sangue, não volume.<\/p>", "blk": ["g_cd"], "slides": [], "pct": null}, {"id": "q06_7", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 7 · Laboratório e prova do laço", "tag": "Laboratório e prova do laço", "enun": "Menino de 5 anos, 18 kg, no 3º dia de febre. Sobre a investigação, assinale a correta.", "alts": ["Pedir IgM para dengue, que já é positiva no 3º dia.", "Pedir NS1 ou PCR; a prova do laço é positiva se houver 10 ou mais petéquias no quadrado de 2,5 × 2,5 cm após 3 minutos de manguito.", "A prova do laço é positiva a partir de 20 petéquias, após 5 minutos.", "A hidratação só deve ser iniciada após o resultado do NS1."], "ok": 1, "coment": "<p><b>B.<\/b> Até o 5º dia: PCR ou NS1  <i>(Sl. 21)<\/i>; na criança, 3 min e ≥ 10 petéquias  <i>(Sl. 23)<\/i>.<\/p><p><b>A<\/b>: IgM a partir do 6º dia  <i>(Sl. 21)<\/i>. <b>C<\/b>: esses são os valores do <b>adulto<\/b>. <b>D<\/b>: manejo clínico não depende de laboratório  <i>(Sl. 21)<\/i>.<\/p>", "blk": ["g_diag"], "slides": [], "pct": null}, {"id": "q06_8", "cap": 6, "src": "autoral", "orig": "Trilha 1.0 · Questão 8 · Vacinas", "tag": "Vacinas", "enun": "Adolescente de 12 anos, que nunca teve dengue (sorologia negativa), pergunta sobre vacina. Mãe, de 34 anos, amamenta um bebê de 8 meses. Qual a orientação correta?", "alts": ["Dengvaxia para o adolescente, em 3 doses.", "Qdenga para o adolescente, 2 doses com intervalo de 3 meses; a mãe não deve receber a vacina enquanto amamenta.", "Qdenga para os dois, pois o bebê já tem mais de 6 meses.", "Nenhuma vacina é possível em soronegativos."], "ok": 1, "coment": "<p><b>B.<\/b> Qdenga: 2 doses, intervalo de 3 meses, pode em soronegativos  <i>(Sl. 42)<\/i>; vacina viva, contraindicada na lactante independentemente da idade da criança  <i>(S27 Aspectos iniciais 31:53–32:24)<\/i>.<\/p><p><b>A<\/b>: Dengvaxia só com primoinfecção comprovada  <i>(Sl. 42)<\/i>. <b>C<\/b>: o corte de 6 meses é da <b>febre amarela<\/b>, não da dengue  <i>(S27 Aspectos iniciais 31:26–31:52)<\/i>. <b>D<\/b>: a Qdenga pode.<\/p>", "blk": ["g_vac"], "slides": [], "pct": null}, {"id": "q07_1", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Marcadores", "tag": "Marcadores", "enun": "Adolescente de 16 anos, 58 kg, com icterícia, colúria e mal-estar há uma semana. Sorologia: HBsAg reagente, anti-HBc IgM reagente, anti-HBs não reagente. Qual a interpretação?", "alts": ["Hepatite B crônica em fase de replicação.", "Hepatite B aguda.", "Imunidade por vacinação prévia.", "Infecção passada curada."], "ok": 1, "coment": "<p><b>B.<\/b> HBsAg + anti-HBc IgM = hepatite B aguda  <i>(Sl. 16)<\/i>.<\/p><p><b>A<\/b>: crônica exige anti-HBc <b>IgG/total<\/b> com HBsAg persistente &gt; 6 meses  <i>(Sl. 14, 16)<\/i>; replicação se lê pelo HBeAg. <b>C<\/b>: o vacinado tem <b>só anti-HBs<\/b>  <i>(S27 P1 16:45–17:39)<\/i>. <b>D<\/b>: na infecção curada o HBsAg já negativou.<\/p>", "blk": ["h_marc"], "slides": [], "pct": null}, {"id": "q07_2", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Vacinado × curado", "tag": "Vacinado × curado", "enun": "Estudante de medicina de 20 anos faz sorologia pré-estágio: HBsAg não reagente, anti-HBc total não reagente, anti-HBs reagente. O que isso significa?", "alts": ["Infecção passada curada.", "Janela imunológica; repetir em 6 meses.", "Imunidade vacinal.", "Suscetível; precisa vacinar."], "ok": 2, "coment": "<p><b>C.<\/b> A vacina contém só o HBsAg, então gera <b>apenas anti-HBs<\/b>  <i>(S27 P1 16:45–17:39)<\/i>.<\/p><p><b>A<\/b>: quem teve a infecção tem <b>anti-HBc<\/b>, porque viu o core. <b>B<\/b>: na janela o anti-HBc (IgM) está positivo. <b>D<\/b>: anti-HBs reagente = protegido.<\/p>", "blk": ["h_marc"], "slides": [], "pct": null}, {"id": "q07_3", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · RN exposto à hepatite B", "tag": "RN exposto à hepatite B", "enun": "RN a termo, 3.100 g, nascido de parto vaginal há 2 horas; mãe HBsAg reagente e HBeAg não reagente no pré-natal. Qual a conduta?", "alts": ["Só a vacina, porque a mãe é HBeAg negativa e o risco é baixo.", "Dosar HBsAg do RN e decidir conforme o resultado.", "Vacina hepatite B + imunoglobulina (IGHAHB), em grupamentos musculares diferentes, o quanto antes.", "Imunoglobulina agora e vacina só após 30 dias, para não haver interferência.", "Contraindicar o aleitamento materno."], "ok": 2, "coment": "<p><b>C.<\/b> Criança exposta: <b>vacina + IGHAHB<\/b>, preferencialmente nas primeiras 24 h (slide) — ou 12 h (MEDCURSO)  <i>(Sl. 17)<\/i>  <i>(S27 P1 21:17–22:44)<\/i>.<\/p><p><b>A<\/b>: mesmo HBeAg negativa, o risco chega a <b>10–40%<\/b>  <i>(Sl. 12)<\/i>; a indicação independe do HBeAg. <b>B<\/b>: no RN não se dosa HBsAg — resultado transitório  <i>(Sl. 14)<\/i>. <b>D<\/b>: vacina não viva não sofre interferência; aplica-se tudo junto  <i>(S27 P1 21:17–22:44)<\/i>. <b>E<\/b>: HBsAg+ não contraindica amamentar  <i>(Apostila PED 2)<\/i>.<\/p>", "blk": ["h_prevB"], "slides": [], "pct": null}, {"id": "q07_4", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Hepatite C no lactente", "tag": "Hepatite C no lactente", "enun": "Lactente de 5 meses, 7 kg, assintomático, filho de mãe com hepatite C crônica. Sorologia anti-HCV reagente. Qual a interpretação e a conduta?", "alts": ["Hepatite C confirmada; encaminhar para tratamento.", "Infecção passada autolimitada; alta.", "O anticorpo pode ser IgG materna; o diagnóstico depende do RNA-VHC por PCR.", "Vacinar contra hepatite C e repetir a sorologia aos 18 meses."], "ok": 2, "coment": "<p><b>C.<\/b> Abaixo de <b>18 meses<\/b>, anti-HCV pode ser IgG da mãe (atravessa a placenta) → <b>PCR<\/b> com 3 meses e repetir 6 a 12 meses após  <i>(Sl. 21–22)<\/i>.<\/p><p><b>A<\/b> e <b>B<\/b>: o anticorpo sozinho não separa infecção de passagem materna — o PCR é que diz “vírus circulante”  <i>(Sl. 21)<\/i>. <b>D<\/b>: <b>não há vacina<\/b> contra hepatite C  <i>(Sl. 22)<\/i>.<\/p>", "blk": ["h_C"], "slides": [], "pct": null}, {"id": "q07_5", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Hepatite A", "tag": "Hepatite A", "enun": "Menino de 4 anos, 16 kg, frequenta creche. Três colegas e a professora de 35 anos tiveram hepatite A no último mês; a professora ficou ictérica, as crianças não. Sobre a hepatite A, é correto:", "alts": ["As crianças que não ficaram ictéricas não foram infectadas.", "Cerca de 70% dos menores de 6 anos são assintomáticos, e a doença não cronifica.", "A transmissão é principalmente sanguínea.", "O anti-HAV IgG positivo confirma infecção aguda."], "ok": 1, "coment": "<p><b>B.<\/b> Assintomática em <b>70%<\/b> dos &lt; 6 anos e em só 30% dos maiores e adultos; <b>não cronifica<\/b>  <i>(Sl. 5, 7)<\/i>.<\/p><p><b>A<\/b>: a criança pequena é justamente o reservatório silencioso. <b>C<\/b>: é <b>fecal-oral<\/b>; sangue só raramente  <i>(Sl. 6)<\/i>. <b>D<\/b>: agudo = <b>IgM<\/b>; IgG positiva por toda a vida = infecção passada ou vacina  <i>(Sl. 8)<\/i>.<\/p>", "blk": ["h_A"], "slides": [], "pct": null}, {"id": "q07_6", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Vacinas", "tag": "Vacinas", "enun": "Sobre as vacinas de hepatite no calendário do SUS, é correto:", "alts": ["Hepatite A: duas doses, aos 12 e aos 18 meses.", "Hepatite B: dose ao nascer e depois aos 2, 4 e 6 meses na forma da pentavalente.", "Hepatite B: não se aplica em prematuros até atingirem 2 kg.", "Hepatite B: criança de 8 anos não vacinada recebe três doses de pentavalente."], "ok": 1, "coment": "<p><b>B.<\/b> Ao nascer, repetir aos 2, 4 e 6 meses (pentavalente)  <i>(Sl. 17)<\/i>.<\/p><p><b>A<\/b>: duas doses em 12–18 m é o calendário <b>SBP/SBIm<\/b>; no SUS, <b>dose única aos 15 meses<\/b>  <i>(Sl. 8)<\/i>. <b>C<\/b>: o peso mínimo de 2 kg é regra da <b>BCG<\/b>; o prematuro &lt; 33 semanas recebe <b>4 doses<\/b> de hepatite B  <i>(S27 P1 09:58–13:24 · 18:05–19:02)<\/i>. <b>D<\/b>: penta só até 7 anos; depois, hepatite B isolada <b>0-1-6<\/b>  <i>(S27 P1 20:00–20:47)<\/i>.<\/p>", "blk": ["h_prevB", "h_A"], "slides": [], "pct": null}, {"id": "q07_7", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 7 · Diagnóstico diferencial", "tag": "Diagnóstico diferencial", "enun": "Lactente de 5 semanas, 4 kg, em aleitamento exclusivo, ictérico desde a 2ª semana, com urina escura e fezes esbranquiçadas. Mãe HBsAg negativa. Qual a prioridade?", "alts": ["Diagnosticar icterícia do leite materno e manter observação.", "Solicitar sorologia para hepatite A.", "Dosar bilirrubina total e frações e investigar atresia de vias biliares com urgência.", "Fototerapia e reavaliação em 48 horas."], "ok": 2, "coment": "<p><b>C.<\/b> Colúria + acolia = bilirrubina direta; BD &gt; 1 = colestase; AVB é urgência — Kasai sem benefício a partir de 8 semanas  <i>(S08 39:19–39:45 · 43:41–43:56)<\/i>.<\/p><p><b>A<\/b>: a icterícia do leite materno aumenta só a <b>indireta<\/b>  <i>(S08 1:02:37–1:03:44)<\/i>. <b>B<\/b>: não é o primeiro suspeito no lactente de 5 semanas. <b>D<\/b>: fototerapia trata bilirrubina indireta, não colestase.<\/p>", "blk": ["h_dif"], "slides": [], "pct": null}, {"id": "q07_8", "cap": 7, "src": "autoral", "orig": "Trilha 1.0 · Questão 8 · Abordagem por idade", "tag": "Abordagem por idade", "enun": "Criança de 3 anos, 14 kg, com HBsAg reagente em exame de rotina, filha de mãe portadora. Assintomática. Qual o próximo passo para confirmar infecção crônica, segundo a aula?", "alts": ["Nenhum: HBsAg positivo aos 3 anos já é crônico.", "Dosar anti-HBs.", "Repetir o HBsAg em 6 meses.", "Vacinar imediatamente e repetir a sorologia."], "ok": 2, "coment": "<p><b>C.<\/b> Acima de 12 meses, dosar HBsAg e <b>repetir em 6 meses<\/b> após o primeiro positivo para confirmar cronicidade  <i>(Sl. 14)<\/i>.<\/p><p><b>A<\/b>: crônica = HBsAg persistente; um exame isolado não prova persistência. <b>B<\/b>: anti-HBs é marcador de imunidade. <b>D<\/b>: vacina previne, não trata quem já tem o antígeno.<\/p>", "blk": ["h_marc_idade"], "slides": [], "pct": null}, {"id": "q08_1", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Conduta inicial", "tag": "Conduta inicial", "enun": "Lactente de 8 meses, 8 kg, vacinação atrasada, com febre há 1 dia, vômitos, irritabilidade e choro ao ser pego no colo. Ao exame: fontanela anterior abaulada, sem petéquias, hemodinamicamente estável, sem sinais focais. Qual a conduta mais adequada?", "alts": ["Tomografia de crânio antes de qualquer outra medida e punção só após o resultado.", "Amoxicilina oral e reavaliação em 48 horas.", "Hemocultura, punção lombar imediata e início de ceftriaxona associada a vancomicina.", "Ampicilina associada a gentamicina após o resultado do líquor."], "ok": 2, "coment": "<p><b>C.<\/b> Lactente &gt; 2 meses com quadro de infecção do SNC (fontanela abaulada, Sl. 17–20), estável e sem sinais focais: não há exceção à punção imediata  <i>(Sl. 22)<\/i>; empírico = C3G + vancomicina  <i>(Sl. 30)<\/i>.<\/p><p><b>A<\/b>: sem sinais focais nem HIC evidente, a imagem só atrasa — e atraso de 3–6 h aumenta mortalidade  <i>(Sl. 23)<\/i>. <b>B<\/b>: via oral e espera são inaceitáveis numa emergência  <i>(Sl. 4)<\/i>. <b>D<\/b>: ampicilina + aminoglicosídeo é a 2ª opção do <b>período neonatal<\/b>, e antibiótico não espera o resultado  <i>(Sl. 22, 30)<\/i>.<\/p>", "blk": ["m_puncao", "m_trat"], "slides": [], "pct": null}, {"id": "q08_2", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Leitura do líquor", "tag": "Leitura do líquor", "enun": "Menino de 5 anos, 18 kg, febre alta, cefaleia, vômitos e rigidez de nuca há 12 horas. Líquor turvo: 2.800 leucócitos/mm³ com 90% de neutrófilos, proteína 180 mg/dL, glicose 20 mg/dL, bacterioscopia com diplococos. A interpretação é:", "alts": ["Meningite viral em fase inicial.", "Meningite bacteriana.", "Meningite tuberculosa.", "Líquor normal para a idade com acidente de punção."], "ok": 1, "coment": "<p><b>B.<\/b> Leucócitos &gt; 1.000, neutrófilos, proteína 100–200 mg/dL, glicose &lt; 30 e bacterioscopia positiva: coluna bacteriana  <i>(Sl. 26)<\/i>.<\/p><p><b>A<\/b>: viral tem &lt; 1.000 células, glicose normal e bacterioscopia negativa — neutrófilos precoces não explicam glicose 20 nem diplococos. <b>C<\/b>: tuberculosa tem aumento leve (20–500) com linfócitos. <b>D<\/b>: acidente de punção dá sangue, não pus com consumo de glicose.<\/p>", "blk": ["m_lcr"], "slides": [], "pct": null}, {"id": "q08_3", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Tuberculosa e BCG", "tag": "Tuberculosa e BCG", "enun": "Criança de 2 anos, 11 kg, não vacinada, com 3 semanas de febre, irritabilidade e sonolência progressiva, avó em tratamento para tuberculose. Líquor: 250 células com predomínio de linfócitos, proteína muito elevada e glicose baixa. Sobre o caso, é correto:", "alts": ["O perfil é típico de meningite viral e dispensa investigação adicional.", "A bacterioscopia pelo Ziehl-Neelsen é positiva na grande maioria dos casos.", "É uma meningite tuberculosa, forma grave que a BCG aplicada ao nascer visa prevenir.", "A BCG não tem relação com meningite, pois só previne a tuberculose pulmonar do adulto."], "ok": 2, "coment": "<p><b>C.<\/b> Aumento leve de células, linfócitos, proteína bastante elevada e glicose diminuída = tuberculosa  <i>(Sl. 26)<\/i>; a BCG protege contra as <b>formas graves — miliar e meníngea<\/b>  <i>(S27 P01 02:22–03:38)<\/i>.<\/p><p><b>A<\/b>: glicose baixa e proteína muito alta afastam a viral. <b>B<\/b>: Ziehl-Neelsen é positivo em só <b>30%<\/b>  <i>(Sl. 26)<\/i>. <b>D<\/b>: é o oposto do que a vacina faz.<\/p>", "blk": ["m_lcr", "m_vac"], "slides": [], "pct": null}, {"id": "q08_4", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Recém-nascido", "tag": "Recém-nascido", "enun": "Recém-nascido de 20 dias, 3,4 kg, com hipotermia, recusa alimentar, gemência e icterícia. Sem rigidez de nuca; fontanela normotensa. Líquor com pleocitose neutrofílica. Qual o esquema empírico indicado pela professora?", "alts": ["Ceftriaxona associada a vancomicina.", "Ampicilina associada a cefotaxima.", "Vancomicina isolada.", "Não tratar: sem febre e sem rigidez de nuca, meningite está afastada."], "ok": 1, "coment": "<p><b>B.<\/b> Até 60 dias: ampicilina (<i>Listeria<\/i>, GBS) + cefotaxima (enterobactérias)  <i>(Sl. 5, 30)<\/i>.<\/p><p><b>A<\/b>: esquema para &gt; 2 meses; ceftriaxona desloca bilirrubina no RN ictérico (conhecimento geral). <b>C<\/b>: vancomicina isolada tem <b>baixa penetração liquórica<\/b>  <i>(Sl. 32)<\/i>. <b>D<\/b>: no RN, febre e rigidez de nuca <b>nem sempre<\/b> aparecem; hipotermia e recusa alimentar são manifestações típicas  <i>(Sl. 17)<\/i>.<\/p>", "blk": ["m_trat", "m_clin"], "slides": [], "pct": null}, {"id": "q08_5", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Profilaxia do meningococo", "tag": "Profilaxia do meningococo", "enun": "Escolar de 7 anos, 20 kg, vacinado com meningo C, dorme no mesmo quarto do irmão internado ontem com doença meningocócica. Qual a conduta para o escolar?", "alts": ["Nenhuma, pois é vacinado contra meningococo C.", "Rifampicina 20 mg/kg (400 mg) uma vez ao dia por 4 dias.", "Rifampicina 10 mg/kg (200 mg) de 12/12 horas por 2 dias.", "Ciprofloxacina 500 mg em dose única."], "ok": 2, "coment": "<p><b>C.<\/b> Contato domiciliar recebe profilaxia <b>independentemente do estado vacinal<\/b>; rifampicina 10 mg/kg (máx. 600 mg) 12/12 h por 2 dias  <i>(Sl. 38)<\/i>.<\/p><p><b>A<\/b>: o slide é explícito sobre o estado vacinal — e a vacina C não cobre o B. <b>B<\/b>: é o esquema do <b>Hib<\/b>  <i>(Sl. 39)<\/i>. <b>D<\/b>: ciprofloxacina é para <b>≥ 18 anos<\/b>  <i>(Sl. 38)<\/i>.<\/p>", "blk": ["m_profil"], "slides": [], "pct": null}, {"id": "q08_6", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Profilaxia do Hib", "tag": "Profilaxia do Hib", "enun": "Menina de 3 anos, 14 kg, com meningite por <i>H. influenzae<\/i> tipo b. Na casa moram os pais, uma irmã de 9 anos e um irmão de 18 meses que recebeu só uma dose de penta. Quem deve receber quimioprofilaxia?", "alts": ["Apenas o irmão de 18 meses.", "Todos os contatos domiciliares, com rifampicina 20 mg/kg (máx. 600 mg) uma vez ao dia por 4 dias.", "Ninguém, pois profilaxia só se aplica ao meningococo.", "Todos, com rifampicina 10 mg/kg de 12/12 horas por 2 dias."], "ok": 1, "coment": "<p><b>B.<\/b> Há um contato &lt; 4 anos <b>parcialmente vacinado<\/b> → profilaxia para <b>todos<\/b> os contatos domiciliares íntimos, de qualquer idade  <i>(Sl. 39)<\/i>.<\/p><p><b>A<\/b>: o critério define a casa, não só a criança pequena. <b>C<\/b>: o slide 39 é inteiro sobre Hib. <b>D<\/b>: é a dose do meningococo  <i>(Sl. 38)<\/i>.<\/p>", "blk": ["m_profil"], "slides": [], "pct": null}, {"id": "q08_7", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 7 · Corticoide", "tag": "Corticoide", "enun": "Sobre a dexametasona na meningite bacteriana da criança, segundo a aula, é correto:", "alts": ["Reverte as lesões do SNC já estabelecidas, por isso pode ser iniciada no 3º dia.", "É indicada em recém-nascidos a partir do 7º dia de vida.", "0,15 mg/kg/dose IV de 6/6 h por 2 dias, acima de 6 semanas de vida, reduz perda auditiva grave e sequelas.", "Está indicada na meningite viral para reduzir edema cerebral."], "ok": 2, "coment": "<p><b>C.<\/b> Texto do slide 35  <i>(Sl. 35)<\/i>.<\/p><p><b>A<\/b>: “previne, mas <b>não reverte<\/b>” — daí o uso junto ao antibiótico. <b>B<\/b>: idade mínima é <b>6 semanas<\/b>. <b>D<\/b>: indicação na <b>meningite bacteriana<\/b> (“MB”).<\/p>", "blk": ["m_dexa"], "slides": [], "pct": null}, {"id": "q08_8", "cap": 8, "src": "autoral", "orig": "Trilha 1.0 · Questão 8 · Quando não puncionar", "tag": "Quando não puncionar", "enun": "Menino de 4 anos, 16 kg, febre há 8 horas, petéquias e púrpuras que não desaparecem à digitopressão, tempo de enchimento capilar prolongado e hipotensão. Qual a conduta?", "alts": ["Punção lombar imediata; o antibiótico só depois do líquor para não negativar a cultura.", "Suporte (acesso, SF 20 mL/kg em 5–10 min, UTI), hemocultura e antibiótico imediato; punção adiada.", "Observação por 6 horas para ver a evolução das lesões.", "Corticoide isolado e punção após estabilização."], "ok": 1, "coment": "<p><b>B.<\/b> Hipotensão é exceção à punção imediata, “mas nunca postergar tratamento”  <i>(Sl. 22)<\/i>; suporte com SF 20 mL/kg  <i>(Sl. 29)<\/i>. Púrpura + choque = doença meningocócica  <i>(Sl. 15)<\/i>.<\/p><p><b>A<\/b>: inverte a prioridade; antígenos e PCR continuam úteis após o antibiótico  <i>(Sl. 27)<\/i>. <b>C<\/b>: atraso de 3–6 h aumenta mortalidade  <i>(Sl. 23)<\/i>. <b>D<\/b>: corticoide não substitui antibiótico.<\/p>", "blk": ["m_puncao"], "slides": [], "pct": null}, {"id": "qn_lcr", "cap": 8, "src": "autoral", "orig": "Tour Provas · questão nova no estilo da professora", "tag": "líquor", "enun": "Lactente de 10 meses, febre há 2 dias e irritabilidade. Líquor: 600 células/mm³ com predomínio de linfócitos, proteína 40 mg/dL, glicose 58 mg/dL (glicemia 90), bacterioscopia negativa. A interpretação mais adequada pelo slide da professora é:", "alts": ["Meningite bacteriana parcialmente tratada", "Meningite viral", "Meningite tuberculosa", "Líquor normal para a idade"], "ok": 1, "coment": "<b>B — Meningite viral.<\/b> &lt; 1.000 células com linfócitos, proteína e glicose normais. <b>C<\/b>: tuberculosa exigiria glicose baixa e proteína muito elevada. <b>A<\/b>: bacteriana teria neutrófilos, glicose &lt; 30 e proteína 100–200. <b>D<\/b>: 600 células nunca é normal.", "blk": ["m_lcr"], "slides": [], "pct": null}, {"id": "q09_1", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Coleta", "tag": "Coleta", "enun": "Lactente de 5 meses, 7 kg, sem controle esfincteriano, com febre de 39 °C há 2 dias, sem outros achados ao exame. A mãe pergunta como será colhida a urina para confirmar infecção urinária. Qual afirmação está correta?", "alts": ["O saco coletor é o método preferencial em menores de 2 anos, porque é o menos invasivo.", "Urocultura por saco coletor com ≥ 100.000 UFC confirma a ITU.", "Urocultura negativa colhida por saco coletor é confiável para afastar a ITU.", "O cateterismo vesical está contraindicado em lactentes por risco de lesão uretral.", "A punção suprapúbica deve ser evitada em diarreia e vulvovaginite."], "ok": 2, "coment": "<p><b>C.<\/b> O saco coletor tem frequentes falsos-positivos, mas é <b>confiável quando negativo<\/b>  <i>(Sl. 14)<\/i> — alto valor preditivo negativo  <i>(S36 38:01–39:33)<\/i>.<\/p><p><b>A<\/b>: foi exatamente a alternativa incorreta de uma questão comentada no MEDCURSO  <i>(S36 50:11–50:35)<\/i>. <b>B<\/b>: positivo por saco é “muito difícil valorizar” — contaminação. <b>D<\/b>: o cateterismo é invasivo e pode lesar a mucosa, mas é método aceito (contraindicado na vulvovaginite/balanopostite). <b>E<\/b>: é o inverso — a punção é <b>indicada<\/b> justamente quando diarreia, vulvovaginite ou balanopostite tornam a coleta natural duvidosa.<\/p>", "blk": ["i_coleta"], "slides": [], "pct": null}, {"id": "q09_2", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Interpretação da urocultura", "tag": "Interpretação da urocultura", "enun": "Menina de 6 anos, 20 kg, com disúria e polaciúria há 2 dias, afebril. Urocultura por jato médio: 40.000 UFC/mL de <i>E. coli<\/i>. Segundo os critérios do slide 17, como interpretar?", "alts": ["ITU confirmada: qualquer crescimento de <i>E. coli<\/i> é significativo.", "Negativo: é flora da uretra anterior.", "Resultado duvidoso: repetir a urocultura.", "Contaminação: indica coleta com duas cepas."], "ok": 2, "coment": "<p><b>C.<\/b> Entre <b>10.000 e 100.000 UFC<\/b> o exame é <b>duvidoso — repetir<\/b>  <i>(Sl. 17)<\/i>.<\/p><p><b>A<\/b>: “qualquer crescimento” vale para a <b>punção suprapúbica<\/b>, não para o jato médio  <i>(S36 40:32–42:06)<\/i>. <b>B<\/b>: negativo é &lt; 10.000. <b>D<\/b>: contaminação é sugerida por <b>duas ou mais cepas<\/b>, e aqui só há uma.<\/p>", "blk": ["i_lab"], "slides": [], "pct": null}, {"id": "q09_3", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Tratamento ambulatorial e dose", "tag": "Tratamento ambulatorial e dose", "enun": "Menino de 3 anos, 14 kg, com febre de 38,8 °C, dor lombar, bom estado geral, hidratado, aceitando dieta. EAS com piúria, esterase e nitrito positivos; urocultura colhida. Pela tabela da professora, qual prescrição oral está correta?", "alts": ["Nitrofurantoína, pois concentra-se bem na urina.", "Cefalexina 50–100 mg/kg/dia divididos em 4 doses, por 10 dias (7 a 14).", "Aguardar o resultado da urocultura antes de iniciar o antibiótico.", "Cefadroxil 50–100 mg/kg/dia em 4 doses.", "Internar para ceftriaxona, pois toda pielonefrite exige tratamento parenteral."], "ok": 1, "coment": "<p><b>B.<\/b> Cefalexina <b>50–100 mg/kg/dia em 4 doses<\/b>, tratamento ambulatorial de <b>10 dias (7 a 14)<\/b>  <i>(Sl. 23)<\/i>.<\/p><p><b>A<\/b>: febre + dor lombar = pielonefrite; a nitrofurantoína não atinge o parênquima  <i>(S36 55:59–57:03)<\/i>. <b>C<\/b>: iniciar <b>logo após a coleta<\/b> — a demora é fator de risco para lesão renal  <i>(Sl. 21)<\/i>. <b>D<\/b>: cefadroxil é <b>30–50 mg/kg/dia em 2 doses<\/b>. <b>E<\/b>: criança sem toxemia, desidratação ou vômitos não tem indicação de internação  <i>(Sl. 22)<\/i>; “toda pielonefrite interna” é mito  <i>(S36 51:16–52:02)<\/i>.<\/p>", "blk": ["i_trat"], "slides": [], "pct": null}, {"id": "q09_4", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Recém-nascido", "tag": "Recém-nascido", "enun": "RN de 18 dias, 3,4 kg, com hipoatividade, recusa alimentar, icterícia e hipotermia. EAS com piúria. Qual a conduta mais adequada?", "alts": ["Tratamento ambulatorial com cefalexina e retorno em 48 horas.", "Sulfametoxazol + trimetoprim VO, por ser o primeiro da tabela oral.", "Internação, coleta de urocultura e ampicilina (ou penicilina) + aminoglicosídeo.", "Aguardar a urocultura, pois o RN com ITU raramente tem bacteremia."], "ok": 2, "coment": "<p><b>C.<\/b> RN é <b>ITU complicada ou potencialmente grave<\/b> → internar  <i>(Sl. 22)<\/i>; esquema: <b>penicilina ou ampicilina + aminoglicosídeo<\/b>  <i>(Sl. 25)<\/i>.<\/p><p><b>A/B<\/b>: RN não é tratado ambulatorialmente; e sulfa não se usa antes dos 2 meses (a própria profilaxia usa cefalexina nessa idade, Sl. 27). <b>D<\/b>: é o contrário — <b>alta probabilidade de bacteremia<\/b> e mortalidade de cerca de 10%  <i>(Sl. 9)<\/i>.<\/p>", "blk": ["i_trat", "i_clin"], "slides": [], "pct": null}, {"id": "q09_5", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Investigação", "tag": "Investigação", "enun": "Menina de 3 anos, 14 kg, com segundo episódio de ITU febril tratado; USG prévia normal. O pediatra quer saber se já existe <b>cicatriz renal<\/b>. Qual exame?", "alts": ["Uretrocistografia miccional durante o tratamento.", "Cintilografia renal estática com DMSA, fora da fase aguda.", "Cintilografia com DTPA.", "Nova ultrassonografia.", "Urografia excretora."], "ok": 1, "coment": "<p><b>B.<\/b> DMSA avalia <b>morfologia<\/b> e função quantitativa do parênquima  <i>(Sl. 30)<\/i> — “M de Morfológica”  <i>(S36 1:07:34–1:08:14)<\/i>; para cicatriz, <b>3 meses após a cura<\/b> (slide 34) ou 4–6 meses (MEDCURSO). Questão modelo no MEDCURSO  <i>(S36 1:17:46–1:18:39)<\/i>.<\/p><p><b>A<\/b>: UCM diagnostica <b>RVU<\/b>, e nunca durante o tratamento  <i>(Sl. 29)<\/i>. <b>C<\/b>: DTPA é dinâmica, avalia <b>obstrução<\/b>. <b>D<\/b>: USG é observador-dependente e pouco sensível para cicatriz e RVU. <b>E<\/b>: urografia é para malformações complexas, com muita radiação  <i>(Sl. 32)<\/i>.<\/p>", "blk": ["i_imagem"], "slides": [], "pct": null}, {"id": "q09_6", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Profilaxia", "tag": "Profilaxia", "enun": "Sobre a profilaxia antibiótica na ITU pediátrica, segundo a aula, assinale a correta.", "alts": ["Está indicada em todo RVU, inclusive graus I e II isolados.", "Em lactentes com menos de 2 meses, o fármaco de escolha é a nitrofurantoína.", "As metanálises mostram que reduz a formação de novas cicatrizes renais.", "Está indicada na anomalia obstrutiva até a correção cirúrgica e no RVU graus III a V.", "Usa doses terapêuticas plenas por 10 dias após cada episódio."], "ok": 3, "coment": "<p><b>D.<\/b> Itens 2 e 3 do slide 26.<\/p><p><b>A<\/b>: RVU I–II só com <b>ITU de repetição ou cintilografia alterada<\/b>. <b>B<\/b>: &lt; 2 meses = <b>cefalexina<\/b>; nitrofurantoína ou SMX-TMP &gt; 2 meses  <i>(Sl. 27)<\/i>. <b>C<\/b>: reduz ITU sintomática, <b>não<\/b> novas cicatrizes  <i>(Sl. 27)<\/i>. <b>E<\/b>: profilaxia é por definição <b>subterapêutica<\/b>  <i>(Sl. 26)<\/i>.<\/p>", "blk": ["i_profil"], "slides": [], "pct": null}, {"id": "q09_7", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 7 · Lesão renal e válvula de uretra posterior", "tag": "Lesão renal e válvula de uretra posterior", "enun": "Menino de 4 meses, 6 kg, com segunda ITU febril. A mãe conta que o jato é fraco, “em gotejamento”; ao exame, bexiga palpável acima da sínfise. O pré-natal mostrou hidronefrose bilateral. Qual a hipótese e o exame que a confirma?", "alts": ["Estenose de junção ureteropélvica bilateral — cintilografia com DTPA.", "RVU primário grau I — ultrassonografia.", "Válvula de uretra posterior — uretrocistografia miccional.", "Bexiga hiperativa — estudo urodinâmico."], "ok": 2, "coment": "<p><b>C.<\/b> Menino + hidronefrose bilateral com distensão vesical + jato fraco/gotejamento + ITU de repetição = <b>VUP<\/b>; confirma com <b>UCM<\/b>  <i>(S36 Outros 16:54–20:17)<\/i>. O slide 12 manda observar o jato e palpar os rins; o slide 35 lista <b>malformação obstrutiva<\/b> e <b>&lt; 1 ano<\/b> como risco de lesão renal.<\/p><p><b>A<\/b>: obstrução “lá em cima” — a bexiga estaria normal. <b>B<\/b>: RVU grau I não explica bexiga distendida nem jato fraco. <b>D<\/b>: bexiga hiperativa não tem hidronefrose  <i>(S36 Outros 21:37–23:00)<\/i>.<\/p>", "blk": ["i_rvu"], "slides": [], "pct": null}, {"id": "q09_8", "cap": 9, "src": "autoral", "orig": "Trilha 1.0 · Questão 8 · Bacteriúria assintomática", "tag": "Bacteriúria assintomática", "enun": "Menina de 8 anos, 26 kg, com mielomeningocele e cateterismo vesical intermitente, sem febre ou queixas. Três uroculturas de rotina, em 10 dias, com 10⁵ UFC de <i>E. coli<\/i>; EAS sem leucocitúria. Conduta?", "alts": ["Tratar por 10 dias com cefalexina.", "Iniciar profilaxia contínua com nitrofurantoína.", "Não tratar: bacteriúria assintomática persistente.", "Internar para ceftriaxona."], "ok": 2, "coment": "<p><b>C.<\/b> Três uroculturas consecutivas em 3 dias a 2 semanas, sem sintomas = bacteriúria assintomática; a persistente é típica de meningomielocele, bexiga neurogênica e cateterismo de repetição; <b>não tratar<\/b>  <i>(Sl. 19)<\/i>. Exceções do MEDCURSO: gestante e manipulação urológica com lesão de mucosa  <i>(S36 21:53–22:52)<\/i>.<\/p><p><b>A/B/D<\/b>: tratar pode selecionar germes de <b>maior virulência<\/b> e levar à ITU sintomática.<\/p>", "blk": ["i_bact"], "slides": [], "pct": null}, {"id": "q10_1", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Choque compensado", "tag": "Choque compensado", "enun": "Lactente de 8 meses, 8 kg, com diarreia e vômitos há 2 dias. Está irritado, FC 180 bpm, extremidades frias, pálido, enchimento capilar de 4 segundos, pulsos periféricos presentes e finos, fralda seca há 8 horas. PA sistólica 84 mmHg. Como classificar?", "alts": ["Sem choque, porque a pressão arterial está normal para a idade.", "Choque hipovolêmico compensado.", "Choque hipovolêmico descompensado.", "Choque cardiogênico, pela taquicardia."], "ok": 1, "coment": "<p><b>B.<\/b> Taquicardia, palidez, extremidades frias e oligúria com pulsos periféricos presentes e PA normal = <b>choque compensado<\/b>  <i>(Sl. 11)<\/i>; aos 8 meses, hipotensão seria PAS &lt; 70  <i>(Sl. 16)<\/i>.<\/p><p><b>A<\/b>: é o erro que a aula quer evitar — PA normal não exclui choque. <b>C<\/b>: descompensado exige hipotensão, ausência de pulsos periféricos ou rebaixamento de consciência  <i>(Sl. 12)<\/i>. <b>D<\/b>: taquicardia é compensação comum a todos os tipos; a história de perdas aponta hipovolemia.<\/p>", "blk": ["s_recon"], "slides": [], "pct": null}, {"id": "q10_2", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Hipotensão por idade", "tag": "Hipotensão por idade", "enun": "Menino de 6 anos, 20 kg, febril, com PA 80 × 40 mmHg. Pela definição da aula, qual o limite de hipotensão sistólica e como está este paciente?", "alts": ["Limite 70 mmHg; não está hipotenso.", "Limite 90 mmHg; está hipotenso.", "Limite 82 mmHg; está hipotenso.", "Limite 76 mmHg; não está hipotenso."], "ok": 2, "coment": "<p><b>C.<\/b> De 1 a 10 anos, hipotensão = PAS &lt; 70 + (idade × 2) = 70 + 12 = <b>82<\/b>; 80 está abaixo  <i>(Sl. 16)<\/i> — a mesma fórmula do MEDCURSO  <i>(S30 P2 48:15–50:03)<\/i>.<\/p><p><b>A<\/b>: 70 é o corte de 1–12 meses. <b>B<\/b>: 90 é o corte acima de 10 anos. <b>D<\/b>: 76 seria a conta com 3 anos, erro de aplicar a idade.<\/p>", "blk": ["s_recon"], "slides": [], "pct": null}, {"id": "q10_3", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Primeira expansão", "tag": "Primeira expansão", "enun": "Menina de 4 anos, 16 kg, com febre, letargia, enchimento capilar de 5 s e pulsos periféricos impalpáveis. Recebe O₂ em máscara com reservatório; duas tentativas de punção venosa falharam. Qual a sequência correta?", "alts": ["Continuar tentando veia periférica e iniciar soro glicosado 5% 320 mL.", "Acesso intraósseo e soro fisiológico 320 mL em 5–20 minutos, reavaliando ao final.", "Acesso intraósseo e soro fisiológico 1600 mL em 3 horas.", "Iniciar noradrenalina por via periférica antes de qualquer volume."], "ok": 1, "coment": "<p><b>B.<\/b> Acesso <b>intraósseo<\/b> se não houver acesso venoso  <i>(Sl. 20)<\/i>; <b>20 mL/kg<\/b> (16 × 20 = 320 mL) de solução isotônica em 5–20 min, repetindo conforme reavaliação  <i>(Sl. 21–22)<\/i>.<\/p><p><b>A<\/b>: insistir na veia atrasa o volume, e <b>soro glicosado não expande<\/b> — na expansão é cristaloide  <i>(S30 P2 18:29–20:04)<\/i>. <b>C<\/b>: 100 mL/kg em 3 h é o formato do Plano C da diarreia  <i>(S30 P2 32:01–33:44)<\/i>, não a ressuscitação do choque do slide. <b>D<\/b>: aminas entram quando o choque persiste após a expansão  <i>(Sl. 23, 37)<\/i>.<\/p>", "blk": ["s_hora1"], "slides": [], "pct": null}, {"id": "q10_4", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Choque cardiogênico", "tag": "Choque cardiogênico", "enun": "Lactente de 10 meses, 9 kg, com miocardite viral. Após um bolus de 20 mL/kg de SF, surgem estertores crepitantes bilaterais, o fígado cresce de 2 para 5 cm do rebordo e a saturação cai. Persistem sinais de choque. Qual a conduta mais adequada?", "alts": ["Novo bolus de 20 mL/kg em 5 minutos.", "Reduzir as alíquotas para 5–10 mL/kg em 10–20 min, se ainda necessárias, e considerar dobutamina.", "Concentrado de hemácias 10 mL/kg.", "Suspender o oxigênio para evitar hiperóxia."], "ok": 1, "coment": "<p><b>B.<\/b> Estertores, hepatomegalia e piora com volume rápido apontam disfunção miocárdica: alíquota de <b>5–10 mL/kg em 10–20 min<\/b>  <i>(Sl. 21)<\/i>; <b>dobutamina<\/b> se sinais de insuficiência cardíaca  <i>(Sl. 25, 38)<\/i>.<\/p><p><b>A<\/b>: mais volume rápido piora a congestão. <b>C<\/b>: hemácias são para choque hemorrágico no trauma  <i>(Sl. 21)<\/i>. <b>D<\/b>: oxigênio em alta concentração é passo básico  <i>(Sl. 20)<\/i>.<\/p>", "blk": ["s_hora1", "s_aminas"], "slides": [], "pct": null}, {"id": "q10_5", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Escolha da amina", "tag": "Escolha da amina", "enun": "Escolar de 7 anos, 22 kg, com sepse de foco abdominal, já recebeu 60 mL/kg de cristaloide. Está com extremidades quentes, pulsos amplos, enchimento capilar rápido e PA 70 × 30 mmHg. Qual amina a aula indica?", "alts": ["Dobutamina 1–20 µg/kg/min.", "Dopamina 2–20 µg/kg/min.", "Noradrenalina 0,05–1,0 µg/kg/min.", "Nenhuma; manter apenas volume."], "ok": 2, "coment": "<p><b>C.<\/b> Choque <b>quente<\/b> (vasodilatado, diastólica baixa) → <b>noradrenalina<\/b>, objetivo PA adequada  <i>(Sl. 25, 38)<\/i>.<\/p><p><b>A<\/b>: dobutamina reduz a RVP e <b>pode diminuir a PA<\/b> — é para insuficiência cardíaca. <b>B<\/b>: dopamina é opção do choque <b>frio<\/b> no slide (e perde espaço nas diretrizes atuais). <b>D<\/b>: após 60 mL/kg com choque persistente, a aula manda iniciar aminas mantendo a expansão  <i>(Sl. 37)<\/i>.<\/p>", "blk": ["s_aminas"], "slides": [], "pct": null}, {"id": "q10_6", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 6 · Choque obstrutivo", "tag": "Choque obstrutivo", "enun": "Adolescente de 13 anos, 45 kg, politraumatizado, intubado, evolui com queda da saturação, hipotensão, murmúrio abolido e timpanismo à direita, sem resposta a 40 mL/kg de cristaloide. Conduta?", "alts": ["Mais 20 mL/kg de SF e noradrenalina.", "Punção de tórax e drenagem.", "Punção pericárdica de alívio.", "Ecocardiograma antes de qualquer intervenção."], "ok": 1, "coment": "<p><b>B.<\/b> Politrauma/ventilação mecânica + ↓ murmúrio + timpanismo + piora respiratória = <b>pneumotórax hipertensivo<\/b> → <b>punção de tórax e drenagem<\/b>  <i>(Sl. 30)<\/i>.<\/p><p><b>A<\/b>: choque obstrutivo não se resolve com volume nem amina. <b>C<\/b>: punção de alívio é do <b>tamponamento<\/b> (bulhas abafadas, QRS achatado). <b>D<\/b>: atrasar a descompressão num paciente instável.<\/p>", "blk": ["s_obst"], "slides": [], "pct": null}, {"id": "q10_7", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 7 · Soro de manutenção", "tag": "Soro de manutenção", "enun": "Pré-escolar de 15 kg, já estabilizado após choque, sem aceitar via oral. Pelo Holliday-Segar da aula, qual o volume de soro glicosado 5% para 24 horas?", "alts": ["1500 mL (100 mL/kg).", "1250 mL.", "1750 mL.", "750 mL."], "ok": 1, "coment": "<p><b>B.<\/b> De 11 a 20 kg: <b>1000 + 50 mL/kg acima de 10 kg<\/b> = 1000 + 50 × 5 = <b>1250 mL<\/b>  <i>(Sl. 27)<\/i>.<\/p><p><b>A<\/b>: 100 mL/kg vale só até 10 kg. <b>C<\/b>: somou 50 mL/kg sobre o peso <b>inteiro<\/b> (1000 + 50 × 15), e não só sobre os quilos acima de 10. <b>D<\/b>: aplicou 50 mL/kg a todo o peso.<\/p>", "blk": ["s_manut"], "slides": [], "pct": null}, {"id": "q10_8", "cap": 10, "src": "autoral", "orig": "Trilha 1.0 · Questão 8 · O caso da aula", "tag": "O caso da aula", "enun": "Criança de 10 anos, 30 kg, febre há 5 dias e exantema, agora afebril e sonolenta. Recebeu 3 bolus de SF 20 mL/kg em 1 hora. Reavaliação: responde mal ao verbal, FC 120, PA 90 × 60, pulsos periféricos impalpáveis, centrais normais, perfusão 4 s, pulmões limpos. Conduta segundo a aula?", "alts": ["Alta do choque, pois a PA normalizou; iniciar Holliday-Segar.", "Suspender volume, pois já atingiu 60 mL/kg.", "Manter expansão, iniciar amina vasoativa e solicitar exames.", "Trocar para soro glicosado 5% 1700 mL/dia."], "ok": 2, "coment": "<p><b>C.<\/b> Exatamente o slide 37: após 1 h (60 mL/kg), ainda com sinais de choque → <b>manter expansão, iniciar aminas e exames<\/b>; Sl. 38: novo SF 20 mL/kg em 20 min + escolha da amina.<\/p><p><b>A<\/b>: perfusão 4 s, pulsos periféricos ausentes e sonolência = choque persistente; manutenção só <b>após<\/b> a melhora  <i>(Sl. 26, 39)<\/i>. <b>B<\/b>: sem sinais de sobrecarga, prosseguir conforme a resposta  <i>(Sl. 23)<\/i>. <b>D<\/b>: é o soro de manutenção do slide 40, para depois da estabilização.<\/p>", "blk": ["s_caso"], "slides": [], "pct": null}], "KS": [{"id": "k_d_atop", "cap": 1, "blk": ["d_atop"], "t": "Escolar que coça nas dobras (prova antiga)", "src": "Prova A1 (3 pts) · Q5 baixa taxonomia — Profa. Patrícia", "enun": "Escolar com lesões recorrentes hiperemiadas, descamativas e muito pruriginosas em <b>regiões de dobras<\/b>.", "p": [{"p": "Qual o diagnóstico mais provável? Justifique pela distribuição.", "m": "<b>Dermatite atópica<\/b>: prurido intenso, recorrência e, no escolar, predomínio <b>flexural<\/b> (antecubital e poplíteo); no lactente seria face e extensoras.", "c": ["dermatite atópica", "prurido", "flexoras", "escolar", "lactente: face e extensoras"]}, {"p": "Quais medicamentos usar nas exacerbações e qual é a base do tratamento?", "m": "Exacerbação: <b>corticoide tópico 1×/dia<\/b> nas lesões ativas (creme nas agudas, pomada nas crônicas; hidrocortisona na face, mometasona no corpo); <b>inibidor de calcineurina<\/b> (&gt; 2 anos) como alternativa; <b>anti-histamínico oral<\/b> para o prurido/rinoconjuntivite; antibiótico se infecção secundária. Base: <b>hidratação e restauração da barreira<\/b> (banho curto e morno, sabonete de pH ácido, hidratante).", "c": ["corticoide tópico", "1 vez ao dia", "calcineurina", "2 anos", "anti-histamínico", "hidratante", "barreira"]}]}, {"id": "k_d_urt", "cap": 1, "blk": ["d_urtic"], "t": "Urticária (gabarito 2025/2)", "src": "Prova 2025/2 · Q4 — gabarito mínimo oficial", "enun": "Pré-escolar com placas eritematoedematosas pruriginosas e migratórias pelo corpo há 4 dias, que somem à digitopressão, sem febre e sem desconforto respiratório.", "p": [{"p": "Qual o diagnóstico e até quando ele é considerado agudo?", "m": "<b>Urticária aguda<\/b>: até <b>6 semanas<\/b>; acima disso, crônica.", "c": ["urticária", "aguda", "6 semanas"]}, {"p": "Cite as etiologias possíveis.", "m": "<b>Drogas, alimentos, inalantes, parasitoses, infecções, doenças sistêmicas, agentes físicos e psicogênicos<\/b>.", "c": ["drogas", "alimentos", "inalantes", "parasitoses", "infecções", "doenças sistêmicas", "agentes físicos", "psicogênicos"]}, {"p": "Tratamento e o que muda se surgir edema de glote?", "m": "<b>Anti-histamínico oral<\/b> e afastar o desencadeante. Com edema de laringe ou broncoespasmo: <b>adrenalina 0,01 mg/kg<\/b> (slide: SC; protocolo atual: IM), suporte de via aérea.", "c": ["anti-histamínico", "afastar desencadeante", "adrenalina", "0,01 mg/kg"]}]}, {"id": "k_e_esc", "cap": 2, "blk": ["e_escarl", "e_mono"], "t": "Amigdalite + amoxicilina + exantema (caiu 2×)", "src": "Prova A1 (3 pts) · Q1 alta taxonomia (1,0 pt) — Profa. Patrícia", "enun": "Paciente de 7 anos, febre alta há 48 h e odinofagia. Diagnosticada amigdalite bacteriana e prescrita amoxicilina. No mesmo dia surge exantema eritematopapular <b>em lixa<\/b>, que começa no tórax e se espalha. Retorna após 24 h de antibiótico, com piora do exantema. Ao exame: linfonodos cervicais anteriores e posteriores, <b>palidez perioral<\/b>, <b>hipertrofia de papilas da língua<\/b> e <b>linhas petequiais em antebraços<\/b>.", "p": [{"p": "Cite dois diagnósticos possíveis. (0,4)", "m": "<b>Escarlatina<\/b> × <b>mononucleose infecciosa<\/b> (o exantema após amoxicilina da mono é o distrator).", "c": ["escarlatina", "mononucleose"]}, {"p": "Qual o diagnóstico mais provável e por quê? (0,2)", "m": "<b>Escarlatina<\/b>: exantema em lixa + <b>Filatov<\/b> (palidez perioral) + língua em <b>framboesa<\/b> + <b>Pastia<\/b> (linhas petequiais nas dobras/antebraços). Na mono esperaria adenomegalia generalizada, esplenomegalia e linfócitos atípicos.", "c": ["escarlatina", "lixa", "Filatov", "Pastia", "framboesa", "sem esplenomegalia"]}, {"p": "Tratamento e prazo de afastamento da escola. (0,4)", "m": "Manter antibiótico: <b>amoxicilina 10 dias<\/b> (ou penicilina V / macrolídeo; azitromicina 5 dias) <b>ou penicilina benzatina IM dose única<\/b> (600.000 UI se &lt; 25 kg; 1.200.000 UI se &gt; 25 kg). Afastar da escola até <b>24–48 h após o início do antibiótico<\/b> (gabarito: 48 h).", "c": ["amoxicilina", "10 dias", "penicilina benzatina", "600.000", "25 kg", "48 h"]}]}, {"id": "k_e_3", "cap": 2, "blk": ["e_escarl", "e_subito", "e_kawa"], "t": "Três exantemas, três condutas", "src": "Prova A1 (7 pts) · Q2 média taxonomia (1,5 pt) — Profa. Patrícia", "enun": "<b>Caso 1:<\/b> 9 anos, amigdalite há 5 dias não tratada; hoje febre, exantema eritematoso difuso, palidez perioral, l
