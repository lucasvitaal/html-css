caroço, palidez, perda de peso, cefaleia matinal com vômito e barriga que cresce.", "div": "cura", "pega": "Cura <b>70–80%<\/b> se precoce (número da professora). A conduta errada é <b>atrasar<\/b> o diagnóstico com antibiótico empírico.", "z": "Febre há duas semanas, palidez e manchas roxas não é virose que passa: é investigar hoje, porque o tempo é o que mais mata nesse câncer, porra.", "ills": ["a_cancer"], "cap": 4, "ord": 9, "slides": [], "hot": [], "g": [], "m": []}, {"id": "a_leuc", "t": "Leucemias e linfomas", "s": "<b>LLA<\/b>: <b>80%<\/b> das leucemias, pico <b>2–4 anos<\/b>; LMA 15–20% (&lt; 1 ano e adolescente). Pode começar com <b>dor óssea<\/b> e hemograma ainda normal. Falência medular: palidez, petéquias, infecções; hepatoesplenomegalia, adenomegalia. Diagnóstico: <b>mielograma<\/b>. <br><b>Hodgkin<\/b>: 15–40 anos, gânglio cervical/supraclavicular indolor &gt; 2 semanas. <br><b>Burkitt<\/b>: &lt; 10 anos, <b>abdome<\/b> ou mandíbula, crescimento rapidíssimo. <b>Linfoblástico<\/b>: &gt; 10 anos, <b>massa mediastinal<\/b> (50–70%), derrame, <b>compressão de via aérea<\/b> → urgência.", "fala": "A leucemia linfoide aguda é oitenta por cento das leucemias da criança, com pico entre dois e quatro anos, e pode abrir o quadro só com dor óssea. A falência da medula aparece como palidez, petéquias e infecções, e quem confirma é o mielograma. Nos linfomas, Hodgkin é do adolescente com gânglio cervical indolor; Burkitt é da criança menor, no abdome ou na mandíbula; e o linfoblástico é o adolescente com massa no mediastino que pode comprimir a via aérea.", "pega": "Adolescente com tosse, dispneia ao deitar e <b>mediastino alargado<\/b> = <b>linfoma linfoblástico<\/b> → risco de <b>compressão de via aérea<\/b> (não sedar/deitar sem avaliação).", "z": "Adolescente que não consegue deitar e tem mediastino gordo no raio-x não é pneumonia: é massa apertando a traqueia. Investigação urgente, caralho.", "ills": ["a_leuc"], "cap": 4, "ord": 10, "slides": [], "hot": ["q04_2", "q04_8"], "g": [], "m": []}, {"id": "a_solidos", "t": "Tumores sólidos: SNC, Wilms, neuroblastoma, osso, olho", "s": "<b>SNC<\/b>: tumor <b>sólido<\/b> maligno mais comum; <b>95%<\/b> das crianças com cefaleia por tumor têm <b>achado neurológico<\/b> (marcha, papiledema, estrabismo, queda escolar). <br><b>Wilms<\/b>: <b>3–4 anos<\/b>, <b>massa abdominal assintomática<\/b> achada pelos pais (<b>60%<\/b>), HAS (25%), hematúria (15%). <b>Neuroblastoma<\/b>: pico <b>2 anos<\/b>, criança <b>doente<\/b> (dor óssea, febre, perda de peso). <br><b>Osteossarcoma<\/b> 10–19 anos (metáfise do joelho); <b>Ewing<\/b> 10–15. <b>Testículo<\/b>: massa indolor, 75% maligna. <br><b>Retinoblastoma<\/b>: <b>leucocoria<\/b> em &gt; <b>50%<\/b>, média 2 anos → reflexo vermelho alterado = <b>oftalmologista imediatamente<\/b>.", "fala": "Entre os tumores sólidos, os do sistema nervoso central são os mais comuns, e noventa e cinco por cento das crianças com cefaleia por tumor já têm algum achado neurológico. No abdome, Wilms é a criança de três a quatro anos em bom estado, com uma massa que a mãe percebeu no banho; o neuroblastoma é a criança de dois anos doente, com dor e febre. E o olho que brilha branco na foto com flash é retinoblastoma até prova em contrário: encaminha ao oftalmologista no mesmo dia.", "pega": "Leucocoria: <b>não repetir o teste<\/b> em um mês — <b>encaminhar imediatamente<\/b>. Massa + bom estado = <b>Wilms<\/b>; massa + criança doente = <b>neuroblastoma<\/b>.", "z": "Olho branco na foto do flash não é defeito do celular: é retinoblastoma até alguém olhar o fundo de olho, hoje, porra.", "m": [["Aula 01 · Triagem 35:33–35:59", "Teste do reflexo vermelho alterado ou leucocoria → não repetir, encaminhar imediatamente."]], "ills": ["a_solidos"], "cap": 4, "ord": 11, "slides": [], "hot": ["q04_5", "q04_6", "q04_7"], "g": []}, {"id": "v_prob", "t": "O tamanho do problema", "s": "Violência acontece sobretudo <b>em casa, na família<\/b>, cercada de um <b>complô de silêncio<\/b>; mais visível nas classes pobres, mais sigilosa nas ricas — ocorre em <b>todas<\/b>. <br><b>10%<\/b> dos traumas na emergência pediátrica são maus-tratos; <b>5%<\/b> dessas crianças morrem sem diagnóstico; quem morre já teve <b>&gt; 5 atendimentos<\/b> prévios. <br>MS 2018: 32.082 notificações de violência sexual; meninas 76,4% (0–9 anos) e 92,2% (10–19); <b>residência<\/b> lidera; agressor pai/padrasto (0–9) e amigo/conhecido (10–19).", "fala": "A violência contra a criança acontece principalmente dentro de casa e é protegida por um complô de silêncio, em todas as classes sociais. Na emergência, um em cada dez traumas pediátricos é maus-tratos, e as crianças que morrem por isso costumam ter passado por mais de cinco atendimentos antes, sem que ninguém desconfiasse. O médico é muitas vezes a única chance de interromper o ciclo.", "pega": "O local mais comum é a <b>residência<\/b>; o agressor mais comum é <b>conhecido<\/b> (pai/padrasto nas menores).", "z": "Cinco atendimentos antes de morrer e ninguém desconfiou. Na sexta vez, quem tem que desconfiar é você, porra.", "ills": ["v_prob"], "cap": 5, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "v_conc", "t": "Conceitos: acidente × violência e as quatro formas", "s": "Injúria <b>acidental<\/b> = acidente; <b>intencional<\/b> = violência. <br><b>Maus-tratos<\/b> (Abrapia, 1997): <b>ação ou omissão<\/b> de adulto ou adolescente mais velho responsável, com intenção consciente ou não, que cause dor física ou emocional. <br>Violência <b>doméstica<\/b>: intencional, intrafamiliar, repetitiva, em todas as classes. Sexual é subestimada; psicológica, imensurável. <br><b>Quatro formas<\/b>: <b>negligência, psicológica, física, sexual<\/b>. ECA: arts. 7–14, 87, 130, <b>245<\/b>.", "fala": "Maus-tratos é toda ação ou omissão de um adulto, ou adolescente mais velho responsável pela criança, que cause dor física ou emocional, com ou sem intenção consciente. A violência doméstica é intencional, dentro da família e repetitiva. São quatro formas para decorar: negligência, violência psicológica, física e sexual, e elas costumam vir juntas.", "pega": "Maus-tratos inclui <b>omissão<\/b> (negligência) e independe de intenção consciente.", "z": "Não precisa ter cinto na mão pra ser maus-tratos: deixar a criança sem comida, sem vacina e sem escola também conta, caralho.", "ills": ["v_conc"], "cap": 5, "ord": 2, "slides": [], "hot": [], "g": [], "m": []}, {"id": "v_neg", "t": "Negligência e violência psicológica", "s": "<b>Negligência<\/b>: omissão <b>crônica<\/b> de cuidados básicos (alimentação, higiene, saúde, vacinação, escola, proteção), intencional ou não; <b>abandono<\/b> = forma extrema. Tipos: física, educacional, emocional. <br><b>Psicológica<\/b>: rejeição, humilhação, aterrorização, cobranças excessivas; está <b>embutida nas demais<\/b>. <br>Sinais: agressividade ou apatia, choro sem causa, tiques, <b>enurese/encoprese secundárias<\/b>, queda escolar, isolamento, recusa alimentar no &lt; 1 ano.", "fala": "Negligência é a omissão crônica de cuidados básicos, como comida, higiene, vacina, escola e proteção, e o abandono é sua forma extrema. A violência psicológica é rejeitar, humilhar, aterrorizar e cobrar demais, e está embutida em todas as outras formas. Os sinais são de comportamento: agressividade ou apatia, choro sem motivo, tiques, queda escolar e a criança que já não fazia xixi na cama e voltou a fazer.", "pega": "<b>Enurese secundária<\/b> (voltou a molhar após anos seca) + mudança de comportamento → <b>investigar violência<\/b>, não tranquilizar.", "z": "Criança que estava seca há quatro anos e voltou a molhar a cama, chorando à toa, não precisa de desmopressina primeiro: precisa que alguém pergunte o que está acontecendo em casa, porra.", "m": [["MEDCURSO · S36 Outros 29:37–31:53", "Enurese só a partir de 5 anos; a secundária exige procurar causa, inclusive violência."]], "ills": ["v_neg"], "cap": 5, "ord": 3, "slides": [], "hot": ["q05_8"], "g": []}, {"id": "v_fis", "t": "Violência física: as pistas na história e no corpo", "s": "Uso intencional de força com lesão, para demonstrar poder; <b>Lei 13.010/2014<\/b> proíbe castigo físico. <br>Pistas: lesão <b>incompatível com idade/desenvolvimento<\/b> · relato que <b>não justifica<\/b> a lesão ou muda · <b>várias partes<\/b> do corpo · <b>estágios diferentes<\/b> de cicatrização · <b>áreas cobertas<\/b> · <b>atraso na procura<\/b>. <br><b>Fratura em quem não anda<\/b>, queimadura de cigarro (circular) ou por imersão (em luva/meia), marcas de objeto (fivela, fio), lesão de fígado/baço.", "fala": "Na violência física a história é tão importante quanto o exame. Desconfie quando a lesão não combina com a idade ou com o desenvolvimento, quando o relato não explica o machucado ou muda a cada pergunta, quando há lesões em várias partes e em fases diferentes de cicatrização, em áreas cobertas, e quando a família demorou a procurar ajuda. Fratura num bebê que ainda não anda é alerta máximo.", "pega": "Lactente de 5 meses com <b>fratura de fêmur<\/b> e “caiu correndo atrás do irmão” = história <b>incompatível com o desenvolvimento<\/b>.", "z": "Bebê de cinco meses não corre atrás de ninguém. Se a história tem criança fazendo o que não sabe fazer, a história é mentira, caralho.", "ills": ["v_fis"], "cap": 5, "ord": 4, "slides": [], "hot": ["q05_2", "q05_7"], "g": [], "m": []}, {"id": "v_sacud", "t": "Síndrome do bebê sacudido (caiu 4×)", "s": "Lactente <b>&lt; 6 meses<\/b> (até 2 anos), geralmente após <b>choro<\/b> que o cuidador “tentou parar”. É a <b>causa mais comum de TCE fechado grave em &lt; 1 ano<\/b>. <br><b>Tríade (slide 36, em vermelho)<\/b>: <b>hematoma subdural + hemorragia retiniana + ausência de trauma craniano<\/b> (sem sinal externo que explique). <br>Também: hemorragia subaracnóidea, edema cerebral, infarto, <b>fratura de arcos costais posteriores<\/b>. Coma inexplicado: 50% óbito, 50% sequela.", "fala": "A síndrome do bebê sacudido é a pergunta que mais se repete nas provas da Patrícia. É o lactente, geralmente abaixo de seis meses, que chega sonolento ou em coma depois de um episódio de choro que alguém tentou parar sacudindo. A tríade do slide em vermelho é hematoma subdural, hemorragia retiniana e ausência de trauma craniano que explique. É a causa mais comum de trauma craniano fechado grave antes de um ano.", "div": "triade", "pega": "Tríade da prova: <b>hematoma subdural + hemorragia retiniana + sem trauma craniano<\/b>. Fratura de <b>arcos costais posteriores<\/b> = mãos apertando o tórax.", "z": "Bebê em coma, sem um galo na cabeça, com sangue embaixo da dura e na retina: ninguém deixou cair, alguém sacudiu. Fundo de olho e Conselho Tutelar, porra.", "ills": ["v_sacud"], "cap": 5, "ord": 5, "slides": [], "hot": ["q05_1"], "g": [], "m": []}, {"id": "v_munch", "t": "Munchausen por procuração e criança espancada", "s": "<b>Síndrome da criança espancada<\/b>: lesões traumáticas de épocas diversas; 2/3 em &lt; 3 anos, 1/3 em &lt; 6 meses. <br><b>Munchausen por procuração<\/b> (transtorno factício imposto a outro): o cuidador <b>mente, simula ou induz<\/b> doença. Pistas: <b>recorrência<\/b>, múltiplas internações e exames, sinais que só ocorrem com a <b>mesma pessoa<\/b>, mãe superenvolvida e “entendida”, insatisfação com a equipe, <b>óbito inexplicado de irmão<\/b>, falta de resposta a terapias. Diagnóstico demora <b>3–6 meses<\/b>.", "fala": "Na síndrome da criança espancada há lesões traumáticas de épocas diferentes, quase sempre em menores de três anos. Já na síndrome de Munchausen por procuração, o cuidador mente, simula ou provoca doença na criança. As pistas são internações e exames repetidos, sintomas que só aparecem quando está com a mesma pessoa, uma mãe muito presente e conhecedora de termos médicos, irmão que morreu sem explicação e nada que funciona. O diagnóstico leva de três a seis meses.", "pega": "Munchausen é <b>excesso de procura<\/b> (não negligência); pedir mais exames invasivos é justamente o <b>dano<\/b> que a síndrome produz.", "z": "Quinta internação, exames todos normais e a febre só aparece quando a mãe está sozinha? Não é doença rara, é Munchausen. Para de pedir biópsia, caralho.", "ills": ["v_munch"], "cap": 5, "ord": 6, "slides": [], "hot": ["q05_4"], "g": [], "m": []}, {"id": "v_sex", "t": "Abuso sexual", "s": "Envolvimento da criança em atividade sexual por alguém em estágio psicossexual mais adiantado, <b>com ou sem contato<\/b> físico. Intrafamiliar × exploração comercial. <br>Em ~<b>80%<\/b> o abusador é <b>um dos pais ou pessoa com laço afetivo<\/b>; vítima geralmente feminina, abusador masculino (atinge 20% das mulheres e 5–10% dos homens na infância). <br><b>Exame físico muitas vezes normal<\/b> — não afasta. DST/IST, gravidez, sangramento genital, comportamento sexualizado, desenhos.", "fala": "Abuso sexual é envolver a criança em atividade sexual por alguém em estágio de desenvolvimento mais adiantado, com ou sem contato físico. Em cerca de oitenta por cento das vezes o abusador é um dos pais ou alguém com laço afetivo com a família, e não um desconhecido. E o exame físico muitas vezes é normal, então um exame normal nunca afasta a suspeita: o que vale é o relato da criança.", "pega": "Abusador = <b>conhecido<\/b> (~80%). <b>Exame normal não afasta<\/b>. Abuso existe <b>sem contato<\/b>.", "z": "O monstro do abuso quase nunca é o estranho da rua: é alguém que senta na mesa do almoço de domingo. Acredita na criança, porra.", "ills": ["v_sex"], "cap": 5, "ord": 7, "slides": [], "hot": ["q05_5", "q05_6"], "g": [], "m": []}, {"id": "v_desconf", "t": "Quando desconfiar e o que não confundir", "s": "<b>Desconfiar<\/b>: discrepância na história · retardo na procura · vários hospitais · atendimento de <b>madrugada<\/b> · pais indiferentes · lesões em várias idades · álcool/drogas na família. <br>Exame: marcas de objeto, queimadura de cigarro/imersão, fratura em quem não anda, lesão de fígado/baço, hemorragia retiniana, DST. <br><b>Não confundir<\/b>: <b>mancha mongólica<\/b> (não muda de cor, desde o nascimento), <b>hemofilia/coagulopatia<\/b>, eritema multiforme, <b>Henoch-Schönlein<\/b>, <b>meningococcemia<\/b>, <b>tinta de roupa<\/b> (sai com álcool).", "fala": "Desconfie de história que não bate, de demora para procurar atendimento, de famílias que passam por vários hospitais ou chegam de madrugada, de pais indiferentes e de lesões em idades diferentes. Mas não confunda: mancha mongólica é azulada, sacral, está lá desde o nascimento e não muda de cor; coagulopatias, Henoch-Schönlein e meningococcemia dão manchas roxas; e tinta de roupa sai com álcool.", "pega": "Mancha <b>azul-acinzentada sacral desde o nascimento<\/b> = mongólica → registrar no prontuário, <b>não notificar<\/b>.", "z": "Antes de chamar o Conselho Tutelar, passa um algodão com álcool: se a mancha roxa sair, era a calça jeans nova, caralho.", "ills": ["v_desconf"], "cap": 5, "ord": 8, "slides": [], "hot": ["q05_3"], "g": [], "m": []}, {"id": "v_conduta", "t": "Conduta: acolher, proteger e notificar", "s": "Os <b>três silêncios<\/b> (criança, família, profissional) → subnotificação. <br><b>ECA art. 245<\/b>: <b>suspeita ou confirmação<\/b> de maus-tratos → comunicação <b>obrigatória ao Conselho Tutelar<\/b>; multa de 3 a 20 salários ao profissional que não comunica. <br>Notificar é <b>dever do médico<\/b> (CEM art. 28, parágrafo único) e <b>supera o sigilo<\/b>; a notificação <b>não é denúncia policial<\/b>. Ficha <b>SINAN<\/b>. <br>No atendimento: ambiente acolhedor, <b>anotar o relato sem induzir<\/b>, tratar as lesões, <b>avaliar o risco real<\/b> de voltar para casa (internar se necessário). <br>Abuso sexual: notificação compulsória + infectologia, ginecologia, psicologia, serviço social e jurídico.", "fala": "Diante da suspeita, não espere certeza: o Estatuto da Criança e do Adolescente, no artigo duzentos e quarenta e cinco, obriga a comunicar a suspeita ou a confirmação ao Conselho Tutelar, com multa para quem se omite. Notificar é dever do médico, está acima do sigilo e não é denúncia policial. Acolha, anote o relato sem induzir, trate as lesões e, se o risco de voltar para casa for real, interne a criança.", "pega": "<b>Suspeita<\/b> já obriga. Destino: <b>Conselho Tutelar<\/b> (boletim de ocorrência <b>não substitui<\/b>). Sigilo <b>cede<\/b> ao risco.", "z": "Ficar em dúvida não te livra: suspeitou, notifica. O Conselho Tutelar investiga; você só não pode ser o terceiro silêncio, porra.", "ills": ["v_conduta"], "cap": 5, "ord": 9, "slides": [], "hot": ["q05_2", "q05_6"], "g": [], "m": []}, {"id": "v_lema", "t": "Consequências e o lema", "s": "Dano <b>imediato<\/b> (lesão, estresse pós-traumático) e <b>progressivo<\/b> (desenvolvimento, atenção, aprendizado, saúde mental, repetição do ciclo). <br>Lema da aula: <b>suspeite, acolha, denuncie<\/b> (notifique).", "fala": "A violência deixa dano imediato, como a lesão e o estresse pós-traumático, e dano progressivo, no desenvolvimento, na atenção, no aprendizado e na saúde mental, muitas vezes repetindo o ciclo na geração seguinte. O lema da aula resume a conduta inteira: suspeite, acolha e notifique.", "pega": "Lema: <b>suspeite · acolha · notifique<\/b>.", "z": "Suspeite, acolha, notifique. Três verbos que valem mais que qualquer tomografia nesse capítulo, caralho.", "ills": ["v_lema"], "cap": 5, "ord": 10, "slides": [], "hot": [], "g": [], "m": []}, {"id": "g_doenca", "t": "O vírus, o mosquito e quem tem mais risco", "s": "<b>Flavivírus<\/b> (RNA), <b>4 sorotipos<\/b>; imunidade permanente só para o mesmo sorotipo. Vetor: <b>Aedes aegypti<\/b> fêmea. <br>Incubação <b>4–7 dias<\/b> (3–14); viremia de 1–2 dias antes até 5–7 dias de sintomas; mosquito transmite após 8–12 dias. <br>Risco de forma grave: <b>infecção secundária heterotípica<\/b>, criança, doença crônica. Sazonal: jan–jun.", "fala": "Dengue é um flavivírus com quatro sorotipos, transmitido pela fêmea do Aedes aegypti. Pegar um sorotipo protege só contra ele, e a segunda infecção por um sorotipo diferente é o principal risco de forma grave. A incubação é de quatro a sete dias, e a criança, assim como quem tem doença crônica, está no grupo de maior risco.", "pega": "Maior risco de grave: <b>segunda infecção por sorotipo diferente<\/b>.", "z": "Teve dengue uma vez e acha que está imune? Só contra aquele sorotipo. O segundo diferente é que vem quebrando tudo, porra.", "ills": ["g_doenca"], "cap": 6, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "g_fases", "t": "As três fases: febril, crítica e recuperação", "s": "<b>Febril<\/b> (2–7 dias): 39–40 °C, cefaleia, <b>dor retro-orbitária<\/b>, mialgia, exantema em ~50%. <br><b>Crítica<\/b>: na <b>defervescência<\/b>, entre o <b>3º e o 7º dia<\/b> — extravasamento plasmático, <b>sinais de alarme<\/b>, choque. <br><b>Recuperação<\/b>: reabsorção do líquido, rash pruriginoso, bradicardia; cuidado com <b>hiper-hidratação<\/b> e infecção bacteriana.", "fala": "A dengue tem três fases. A febril dura de dois a sete dias, com febre alta, dor atrás dos olhos e dor no corpo. A crítica chega justamente quando a febre cai, entre o terceiro e o sétimo dia: é aí que o plasma extravasa, aparecem os sinais de alarme e pode vir o choque. Na recuperação o líquido volta para o vaso, e o risco passa a ser a hiper-hidratação.", "pega": "O perigo é na <b>defervescência<\/b> (3º–7º dia): febre caindo <b>não<\/b> é melhora garantida.", "z": "A febre passou e a mãe acha que acabou? É exatamente aí que a dengue mata. Reavalia essa criança no dia que a febre some, caralho.", "ills": ["g_fases"], "cap": 6, "ord": 2, "slides": [], "hot": [], "g": [], "m": []}, {"id": "g_def", "t": "Caso suspeito, sinais de alarme e de choque", "s": "<b>Suspeito<\/b>: área de transmissão + febre 2–7 dias + ≥ 2 sintomas (náusea, exantema, mialgia, cefaleia, dor retro-orbitária, petéquias/laço+, leucopenia…). <b>Criança: febre de 2–7 dias sem foco<\/b> já basta. Notificar. <br><b>Alarme (1 basta)<\/b>: dor abdominal intensa e contínua · vômitos persistentes · <b>hipotensão postural/lipotimia<\/b> · <b>hepatomegalia dolorosa &gt; 2 cm<\/b> · sangramento de mucosa · <b>letargia/irritabilidade<\/b> · ↓ diurese · hipotermia · <b>↑ Ht<\/b> · ↓ plaquetas · acúmulo de líquidos (ascite, derrames) · desconforto respiratório. <br><b>Choque<\/b>: pulso rápido e fino, <b>PA convergente<\/b> (diferencial ≤ 20 mmHg), <b>TEC &gt; 2 s<\/b>, extremidades frias, hipotensão.", "fala": "Na criança, febre de dois a sete dias sem foco em área de transmissão já é caso suspeito, sem precisar dos dois sintomas do adulto. Um único sinal de alarme muda tudo: dor abdominal intensa, vômitos persistentes, tontura ao levantar, fígado grande e doloroso, sangramento de mucosa, sonolência ou irritabilidade, pouca urina, acúmulo de líquido e hematócrito subindo. Choque é pulso fino, pressão convergente e enchimento capilar acima de dois segundos.", "pega": "Criança: <b>febre sem foco<\/b> em área de transmissão já é suspeita. <b>Um<\/b> sinal de alarme basta para o grupo C.", "z": "Criança com dengue, sonolenta e com fígado doendo não é grupo A com soro caseiro: é sinal de alarme, é veia, é grupo C, porra.", "ills": ["g_def"], "cap": 6, "ord": 3, "slides": [], "hot": ["q06_3", "q06_5"], "g": [], "m": []}, {"id": "g_diag", "t": "Diagnóstico: NS1, IgM, hemograma e prova do laço", "s": "Diagnóstico é <b>clínico<\/b>; o manejo <b>não espera<\/b> laboratório. <br><b>NS1 ou RT-PCR até o 5º dia<\/b>; <b>IgM a partir do 6º dia<\/b>. <br>Hemograma: leucopenia, linfócitos atípicos; gravidade: <b>hemoconcentração<\/b>, plaquetas &lt; 100.000, hipoalbuminemia. <br><b>Prova do laço<\/b>: manguito na PA média; <b>criança 3 min e ≥ 10 petéquias<\/b> (adulto 5 min, ≥ 20) num quadrado de 2,5 × 2,5 cm.", "fala": "O diagnóstico da dengue é clínico e a hidratação nunca espera exame. Para confirmar, até o quinto dia se pede antígeno NS1 ou PCR; a partir do sexto dia, sorologia igê eme. No hemograma, leucopenia é esperada, e hemoconcentração com plaqueta caindo é gravidade. A prova do laço na criança dura três minutos e é positiva com dez ou mais petéquias no quadrado.", "pega": "Laço: <b>criança 3 min / ≥ 10<\/b> · adulto 5 min / ≥ 20. 4º dia → <b>NS1/PCR<\/b>, não IgM.", "z": "Pediu igê eme no terceiro dia? Vai dar negativo e você vai achar que não é dengue. NS1 até o quinto, caralho.", "ills": ["g_diag"], "cap": 6, "ord": 4, "slides": [], "hot": ["q06_7"], "g": [], "m": []}, {"id": "g_grupos", "t": "Classificação em grupos A, B, C e D", "s": "<b>A<\/b>: sem alarme, sem sangramento, sem condição especial → <b>atenção primária<\/b>, casa. <br><b>B<\/b>: <b>sangramento de pele espontâneo ou laço +<\/b>, ou <b>condição especial<\/b> (<b>&lt; 2 anos<\/b>, gestante, &gt; 65, comorbidade, risco social) → <b>observação na unidade<\/b>. <br><b>C<\/b>: <b>sinal de alarme<\/b>, sem choque → <b>internação<\/b>. <br><b>D<\/b>: <b>choque<\/b> ou sangramento grave/disfunção de órgão → <b>UTI<\/b>. <br><b>Hidratar antes do exame<\/b> e <b>reclassificar a cada reavaliação<\/b>.", "fala": "A classificação define onde a criança fica e como se hidrata. Grupo A não tem alarme nem sangramento e vai para casa. Grupo B tem petéquias espontâneas, prova do laço positiva ou condição especial, como ter menos de dois anos, e fica em observação na unidade. Grupo C tem sinal de alarme sem choque e é internado. Grupo D é o choque, na terapia intensiva. E a classificação muda a cada reavaliação.", "pega": "<b>Petéquias espontâneas<\/b> sem alarme = <b>B<\/b> (não A). <b>&lt; 2 anos<\/b> = condição especial → <b>B<\/b>.", "z": "Petéquia na cara não é enfeite: tirou a criança do grupo A e jogou no B. Hemograma e soro na unidade, porra.", "ills": ["g_grupos"], "cap": 6, "ord": 5, "slides": [], "hot": ["q06_1", "q06_3"], "g": [], "m": []}, {"id": "g_ab", "t": "Grupos A e B: hidratação oral e o que observar", "s": "<b>Grupo A<\/b>: hidratação oral em casa — <b>≤ 10 kg: 130 mL/kg/dia<\/b> · <b>10–20 kg: 100<\/b> · <b>&gt; 20 kg: 80<\/b>; <b>1/3 em SRO<\/b> e o resto em líquidos caseiros. Dipirona ou paracetamol, <b>sem AINE<\/b>; antiemético (bromoprida/metoclopramida). Hemograma <b>obrigatório &lt; 5 anos<\/b>. Retorno na defervescência ou no 5º dia; orientar alarmes. <br><b>Grupo B<\/b>: <b>hemograma obrigatório<\/b> (resultado em até 4 h) e <b>hidratação ORAL supervisionada na unidade, antes do resultado<\/b>: <b>≥ 50 mL/kg em 4–6 h<\/b>. Reavaliar clínica, diurese (&lt; 1,5 mL/kg/h preocupa), Ht e plaquetas. <b>Ht &gt; 38%<\/b>, alarme ou recusa da VO → <b>venosa = conduta C<\/b>. Notificar.", "fala": "No grupo A a hidratação é oral em casa: cento e trinta mililitros por quilo por dia até dez quilos, cem entre dez e vinte, e oitenta acima de vinte, com um terço em soro de reidratação oral, febre tratada com dipirona ou paracetamol e nunca anti-inflamatório. No grupo B, hemograma obrigatório e hidratação oral supervisionada na própria unidade, já antes do resultado: pelo menos cinquenta mililitros por quilo em quatro a seis horas. Hematócrito acima de trinta e oito, alarme ou recusa, vira grupo C.", "div": "grupoB_ht", "pega": "Criança de <b>15 kg<\/b> no B: <b>≥ 750 mL VO<\/b> em 4–6 h na unidade. Erro dos compilados: “grupo A” e “50 mL/kg <b>venoso<\/b>”.", "z": "Quinze quilos vezes cinquenta dá setecentos e cinquenta mililitros pela boca, na unidade, com alguém olhando. Não é veia e não é pra casa, porra.", "ills": ["g_ab"], "cap": 6, "ord": 6, "slides": [], "hot": ["q06_1", "q06_2"], "g": [], "m": []}, {"id": "g_cd", "t": "Grupos C e D: expansão, reavaliação e o hematócrito", "s": "<b>Grupo C<\/b>: <b>SF 0,9% ou RL 20 mL/kg/hora<\/b>, até <b>3 vezes<\/b>; reavaliação <b>clínica horária<\/b>; <b>Ht após 2 h<\/b>. Melhorou → <b>manutenção (Holliday-Segar)<\/b> + reposição de perdas. Internação mínima 48 h. <br><b>Grupo D<\/b>: O₂, acesso calibroso, <b>20 mL/kg em até 20 min<\/b>, até <b>3 vezes<\/b>, reavaliação contínua; <b>Ht após 2 h<\/b>; UTI; PA 2/2 h, Ht 4/4 h, plaquetas 12/12 h. <br>Persistindo o choque: <b>Ht subindo<\/b> → <b>albumina<\/b> (coloide) · <b>Ht caindo com choque<\/b> → <b>hemorragia<\/b>: concentrado de hemácias, plasma, vitamina K, crioprecipitado · <b>Ht caindo sem sangramento<\/b> → hiper-hidratação: ↓ soro, diurético, inotrópico. <br><b>Nunca soro glicosado na expansão.<\/b>", "fala": "No grupo C a expansão é soro fisiológico ou Ringer, vinte mililitros por quilo por hora, até três vezes, com reavaliação clínica a cada hora e hematócrito depois de duas horas; melhorou, passa para manutenção. No grupo D, choque, são vinte mililitros por quilo em até vinte minutos, até três vezes, na terapia intensiva. Se o choque persiste, olhe o hematócrito: subindo pede albumina; caindo com choque pede sangue; caindo sem sangramento é excesso de volume.", "div": "grupoC_tempo", "pega": "C = 20 mL/kg <b>em 1 hora<\/b>; D = 20 mL/kg <b>em até 20 min<\/b>. Ht ↓ + choque = <b>sangrando<\/b> → hemácias.", "z": "Choque com hematócrito despencando e melena não é falta de soro, é sangue saindo. Concentrado de hemácias, não a quarta expansão, caralho.", "m": [["MEDCURSO · S30 P2 18:29–20:04", "Expansão sempre com cristaloide isotônico, nunca soro glicosado."]], "ills": ["g_cd"], "cap": 6, "ord": 7, "slides": [], "hot": ["q06_4", "q06_5", "q06_6"], "g": []}, {"id": "g_vac", "t": "Prevenção e vacinas", "s": "Controle do vetor (água parada). <br><b>Dengvaxia<\/b>: <b>9–45 anos<\/b>, 3 doses (0-6-12 meses), <b>só soropositivo<\/b> (infecção prévia comprovada). <br><b>Qdenga<\/b>: atenuada, <b>2 doses com 3 meses<\/b> de intervalo, <b>pode em soronegativo<\/b>; vírus vivo → <b>contraindicada na lactante<\/b> (e gestante, imunodeprimido).", "fala": "A prevenção começa no vetor, sem água parada. Das vacinas, a Dengvaxia é de nove a quarenta e cinco anos, em três doses, e só para quem já teve dengue comprovada. A Qdenga é de vírus atenuado, em duas doses com três meses de intervalo, e pode ser dada em quem nunca teve dengue; por ser viva, é contraindicada na mulher que está amamentando.", "div": "dengvaxia", "pega": "Soronegativo → <b>Qdenga<\/b>, nunca Dengvaxia. Lactante <b>não<\/b> recebe Qdenga (vírus vivo).", "z": "Deu Dengvaxia em quem nunca teve dengue? Parabéns, transformou a primeira infecção dele numa segunda infecção grave. Qdenga, porra.", "m": [["MEDCURSO · S27 Aspectos iniciais 31:26–32:24", "Vacina viva contraindicada na lactante; o corte de 6 meses é da febre amarela, não da dengue."]], "ills": ["g_vac"], "cap": 6, "ord": 8, "slides": [], "hot": ["q06_8"], "g": []}, {"id": "h_A", "t": "Hepatite A: fecal-oral, silenciosa na criança, não cronifica", "s": "Transmissão <b>fecal-oral<\/b> (saneamento, creche). Viremia do início dos sintomas ao fim da icterícia. <br><b>Assintomática em 70% dos &lt; 6 anos<\/b> (só 30% dos maiores/adultos); tríade <b>colúria, hipocolia, icterícia<\/b>. Cura em 30–40 dias; 15% prolongada (&lt; 6 meses). <b>Não cronifica.<\/b> <br>Anti-HAV <b>IgM<\/b> = aguda (a partir de 5–10 dias, por 1–2 meses); <b>IgG<\/b> = infecção passada ou vacina, por toda a vida. <br>Vacina: <b>SUS dose única aos 15 meses<\/b>; SBP/SBIm 2 doses (12 e 18 meses).", "fala": "Hepatite A se pega pela via fecal-oral e circula muito em creche. Na criança pequena ela costuma ser silenciosa: setenta por cento dos menores de seis anos não têm sintoma, e por isso eles são o reservatório que contamina os adultos, que ficam ictéricos. Ela cura em trinta a quarenta dias e não cronifica. Igê eme positivo é infecção aguda; igê gê é infecção passada ou vacina. No SUS, a vacina é dose única aos quinze meses.", "pega": "Hepatite A <b>não cronifica<\/b>. Anti-HAV <b>IgG<\/b> positivo <b>não<\/b> é infecção aguda. SUS: <b>dose única 15 meses<\/b>.", "z": "Na creche as crianças pegam hepatite A sem nem perceber e quem fica amarela é a professora. Lava a mão depois da fralda, porra.", "ills": ["h_A"], "cap": 7, "ord": 1, "slides": [], "hot": ["q07_5", "q07_6"], "g": [], "m": []}, {"id": "h_B", "t": "Hepatite B: transmissão e o risco de cronificar", "s": "~300 milhões de portadores (OMS). Transmissão por <b>sangue, sêmen e saliva<\/b> (slide); na criança: <b>perinatal (vertical)<\/b> e intrafamiliar (14–60%). <b>HBeAg<\/b> = replicação, mais infectante. <br><b>Quanto mais cedo a infecção, maior a cronificação<\/b>: filho de mãe <b>HBsAg+/HBeAg+ → 70–90%<\/b>; HBsAg+/HBeAg− → 10–40%. As crônicas vêm da infância → <b>cirrose e hepatocarcinoma<\/b>.", "fala": "A hepatite B passa por sangue, sêmen e saliva, e na criança a via principal é a vertical, na hora do parto, além da transmissão dentro de casa. A regra de ouro é que quanto mais cedo a infecção, maior a chance de cronificar: filho de mãe com antígeno de superfície e antígeno e positivos cronifica em setenta a noventa por cento. E são essas crônicas da infância que viram cirrose e câncer de fígado no adulto.", "div": "hb_tv", "pega": "Mesmo mãe <b>HBeAg negativa<\/b> tem risco (10–40%): a profilaxia do RN <b>independe<\/b> do HBeAg.", "z": "Hepatite B pega cedo é hepatite B pra vida toda: setenta a noventa por cento de cronificação no filho de mãe com HBeAg positivo. Protege esse bebê na sala de parto, caralho.", "ills": ["h_B"], "cap": 7, "ord": 2, "slides": [], "hot": [], "g": [], "m": []}, {"id": "h_marc", "t": "Marcadores da hepatite B (o slide inteiro em negrito)", "s": "<b>HBsAg<\/b> = presença do vírus (infecção). <b>Anti-HBc IgM<\/b> = infecção <b>aguda<\/b>. <b>Anti-HBc IgG/total<\/b> = contato com o vírus (passado ou crônico). <b>Anti-HBs<\/b> = imunidade. <b>HBeAg<\/b> = replicação / anti-HBe = soroconversão. <br><b>Aguda<\/b> = <b>HBsAg + anti-HBc IgM<\/b>. <b>Crônica<\/b> = <b>HBsAg + anti-HBc IgG/total<\/b> (HBsAg &gt; 6 meses). <br><b>Curada<\/b> = anti-HBc total + anti-HBs, HBsAg negativo. <b>Vacinado<\/b> = <b>só anti-HBs<\/b> (a vacina só tem HBsAg). PCR (DNA) só para quem vai tratar.", "fala": "O slide que a professora pôs inteiro em negrito é o dos marcadores. Hepatite B aguda é antígeno de superfície positivo com anti core igê eme. Crônica é antígeno de superfície positivo com anti core igê gê, ou total, persistindo além de seis meses. Quem se curou tem anti core e anti superfície, sem o antígeno. E o vacinado tem só o anti superfície, porque a vacina contém apenas o antígeno de superfície e nunca mostra o core ao sistema imune.", "pega": "Vacinado = <b>só anti-HBs<\/b>. Anti-HBc positivo = <b>viu o vírus<\/b> (nunca é só vacina).", "z": "Anti core positivo é carimbo de quem encontrou o vírus de verdade; vacina não deixa esse carimbo. Leu errado, tratou o vacinado como curado, porra.", "m": [["MEDCURSO · S27 P1 16:45–17:39", "A vacina contém só o HBsAg, então gera apenas anti-HBs."]], "ills": ["h_marc"], "cap": 7, "ord": 3, "slides": [], "hot": ["q07_1", "q07_2"], "g": []}, {"id": "h_marc_idade", "t": "Filho de mãe HBsAg+: o que dosar em cada idade", "s": "<b>&lt; 6 meses<\/b>: <b>não dosar<\/b> (resultado transitório/materno). <br><b>6–12 meses<\/b> (exposto): HBsAg + VHB-DNA. <br><b>&gt; 12 meses<\/b>: <b>HBsAg e repetir em 6 meses<\/b> se positivo → confirma <b>crônica<\/b> (persistência).", "fala": "Na criança exposta, a idade define o exame. Antes dos seis meses não se dosa, porque o resultado pode ser transitório. Entre seis e doze meses, pede antígeno de superfície e DNA viral. Acima de doze meses, pede o antígeno de superfície e, se vier positivo, repete em seis meses: só a persistência confirma hepatite B crônica.", "pega": "Um HBsAg positivo isolado <b>não<\/b> prova cronicidade: <b>repetir em 6 meses<\/b>.", "z": "Um exame positivo é foto; crônica é filme de seis meses. Repete o antígeno antes de carimbar a criança, caralho.", "ills": ["h_marc_idade"], "cap": 7, "ord": 4, "slides": [], "hot": ["q07_8"], "g": [], "m": []}, {"id": "h_prevB", "t": "Prevenção da B: calendário e RN exposto", "s": "Vacina <b>ao nascer<\/b> (primeiras 12–24 h) + <b>pentavalente aos 2, 4 e 6 meses<\/b>. Prematuro <b>&lt; 33 sem<\/b> (ou &lt; 2 kg): <b>4 doses<\/b>. Não vacinado <b>≥ 7 anos<\/b>: hepatite B isolada <b>0-1-6<\/b> (penta só até 7 anos). Slide: adolescentes até 19 anos e grupos de risco; hoje: toda a população. <br><b>RN de mãe HBsAg+<\/b>: <b>vacina + imunoglobulina (IGHAHB)<\/b>, <b>preferencialmente nas primeiras 24 h<\/b> (slide) — MEDCURSO 12 h —, em <b>grupamentos musculares diferentes<\/b>, independentemente do HBeAg. <b>Amamentação liberada.<\/b>", "fala": "A vacina da hepatite B é dada ao nascer e depois aos dois, quatro e seis meses, na pentavalente; o prematuro abaixo de trinta e três semanas recebe quatro doses. O recém-nascido de mãe com antígeno de superfície positivo recebe vacina mais imunoglobulina específica, de preferência nas primeiras vinte e quatro horas, em músculos diferentes, e pode mamar normalmente. Não se dosa o antígeno do bebê antes de decidir.", "div": "ighahb", "pega": "RN exposto: <b>vacina + IGHAHB juntas<\/b>, músculos diferentes, <b>≤ 24 h<\/b>; HBeAg negativo da mãe <b>não dispensa<\/b>; aleitamento <b>permitido<\/b>.", "z": "Mãe com antígeno de superfície positivo: vacina numa coxa, imunoglobulina na outra, antes de vinte e quatro horas, e deixa o bebê mamar. Simples assim, porra.", "m": [["MEDCURSO · S27 P1 21:17–22:44", "Vacina + IGHAHB, de preferência em 12 h, juntas (vacina não viva não sofre interferência)."], ["MEDCURSO · S27 P1 20:00–20:47", "Pentavalente só até 7 anos; depois, hepatite B isolada 0-1-6."]], "ills": ["h_prevB"], "cap": 7, "ord": 5, "slides": [], "hot": ["q07_3", "q07_6"], "g": []}, {"id": "h_C", "t": "Hepatite C na criança", "s": "Antiga “não A, não B”; <b>mutações → sem imunidade protetora, sem vacina<\/b>; <b>&gt; 80% cronifica<\/b>, raramente sintomática na fase aguda. <br>Via da criança: <b>vertical<\/b> (~5%; 10% com coinfecção HIV; slide: cesárea, sangue materno, alta viremia). <br><b>Anti-HCV<\/b> (20–150 dias) = <b>contato<\/b>; <b>RNA-VHC (PCR)<\/b> (7–21 dias) = <b>vírus circulante<\/b>. <br><b>&lt; 18 meses<\/b>: anti-HCV pode ser <b>IgG materna<\/b> → <b>PCR com 3 meses<\/b> e repetir 6–12 meses após. Viremia pode clarear até 3–4 anos.", "fala": "A hepatite C cronifica em mais de oitenta por cento, quase sempre sem sintomas, e não tem vacina. Na criança, a via é a vertical. A armadilha de prova é o lactente filho de mãe com hepatite C que tem anticorpo positivo: antes dos dezoito meses esse anticorpo pode ser da mãe, que atravessou a placenta. Quem decide é o PCR do RNA viral, feito a partir dos três meses e repetido depois.", "div": "hcv_cesar", "pega": "Anti-HCV + em &lt; <b>18 meses<\/b> = pode ser <b>materno<\/b> → <b>PCR<\/b>. Não existe vacina contra hepatite C.", "z": "Anticorpo de hepatite C positivo num bebê de cinco meses é presente da mãe, não diagnóstico. PCR decide, porra.", "ills": ["h_C"], "cap": 7, "ord": 6, "slides": [], "hot": ["q07_4"], "g": [], "m": []}, {"id": "h_dif", "t": "Icterícia no lactente: colestase e atresia de vias biliares", "s": "<b>Colúria + hipocolia/acolia<\/b> = bilirrubina <b>direta<\/b>. <b>BD &gt; 1 mg/dL<\/b> = colestase → investigar com urgência. <br><b>Atresia de vias biliares<\/b>: icterícia que persiste após 2 semanas, fezes claras → <b>cirurgia de Kasai antes de 8 semanas<\/b> (depois disso, benefício cai muito). <br>Icterícia do leite materno: só <b>indireta<\/b>, fezes normais.", "fala": "Icterícia no lactente de semanas com urina escura e fezes claras não é icterícia do leite materno: é bilirrubina direta, e direta acima de um é colestase. A grande urgência é a atresia de vias biliares, porque a cirurgia de Kasai precisa ser feita antes de oito semanas de vida. A icterícia do leite materno eleva só a indireta e as fezes continuam amarelas.", "pega": "Fezes claras + urina escura = <b>BD<\/b> → <b>atresia<\/b> até prova em contrário; <b>Kasai &lt; 8 semanas<\/b>. Fototerapia não trata colestase.", "z": "Cocô branco e xixi cor de Coca-Cola num bebê de cinco semanas: fração da bilirrubina hoje, porque o relógio do Kasai está correndo, caralho.", "m": [["MEDCURSO · S08 39:19–43:56", "Bilirrubina direta &gt; 1 = colestase; Kasai sem benefício a partir de 8 semanas."]], "ills": ["h_dif"], "cap": 7, "ord": 7, "slides": [], "hot": ["q07_7"], "g": []}, {"id": "m_epi", "t": "Epidemiologia: quem, quando, quanto mata", "s": "Inflamação das <b>leptomeninges<\/b>; mais em <b>&lt; 5 anos<\/b>, sobretudo <b>3–12 meses<\/b>. A maioria é <b>viral<\/b>; bacteriana não tratada ≈ <b>100% de mortalidade<\/b>. <br>Brasil 2007–2020: 265.644 casos (121.955 virais, 87.993 bacterianas). <b>Meningococo<\/b> lidera as bacterianas; sorogrupo <b>C<\/b> predomina, mas o <b>B cresce<\/b> e já domina em 0–4 anos. <br><b>Hib caiu 95%<\/b> após a vacina (1999); pneumococo caiu em &lt; 2 anos com a VPC10 (2010), mas tem a maior letalidade (26,9–31,1%).", "fala": "Meningite é a inflamação das leptomeninges, e a faixa de maior risco é abaixo de cinco anos, principalmente entre três e doze meses. A maioria é viral, mas a bacteriana sem tratamento mata quase sempre. No Brasil o meningococo é o agente bacteriano mais comum, com o sorogrupo B crescendo nas crianças pequenas; o hemófilo praticamente sumiu com a vacina, e o pneumococo é o que mais mata.", "div": "letal", "pega": "Mais comum: <b>meningococo<\/b>; maior letalidade: <b>pneumococo<\/b>; Hib ↓ <b>95%<\/b> com a vacina.", "z": "O hemófilo virou peça de museu graças à vacina; o pneumococo continua matando um em cada três. Vacina em dia, caralho.", "ills": ["m_epi"], "cap": 8, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "m_etio", "t": "Agente por faixa etária e por condição", "s": "<b>Até 2 meses<\/b>: <b>enterobactérias<\/b> (<i>E. coli<\/i>), <b>estreptococo do grupo B<\/b>, <b><i>Listeria<\/i><\/b>. <br><b>&gt; 2 meses<\/b>: <b>meningococo, pneumococo<\/b>, <i>H. influenzae<\/i> b. <b>6–21 anos<\/b>: meningococo e pneumococo. <br><b>Asplenia / falciforme / deficiência de complemento<\/b> → encapsulados. <b>DVP / neurocirurgia<\/b> → estafilococos, <i>Pseudomonas<\/i>. <br>Via principal: <b>hematogênica<\/b> a partir da colonização da nasofaringe.", "fala": "O agente depende da idade. Até dois meses, pense nos germes do canal de parto e do berçário: enterobactérias como a Escherichia coli, estreptococo do grupo B e Listeria. Depois de dois meses entram meningococo, pneumococo e hemófilo. Criança sem baço, falciforme ou com deficiência de complemento sofre com encapsulados, e quem tem derivação ventricular sofre com estafilococo e pseudomonas.", "pega": "<i>Listeria<\/i> no &lt; 2 meses é o motivo da <b>ampicilina<\/b> (cefalosporina não cobre Listeria).", "z": "Listeria não liga pra cefalosporina nenhuma. Recém-nascido sem ampicilina no esquema é recém-nascido descoberto, porra.", "ills": ["m_etio"], "cap": 8, "ord": 2, "slides": [], "hot": [], "g": [], "m": []}, {"id": "m_clin", "t": "Quadro clínico: do escolar ao recém-nascido", "s": "<b>Tríade<\/b>: <b>febre, cefaleia, vômitos<\/b> + sinais meníngeos (<b>rigidez de nuca, Kernig, Brudzinski<\/b>). Hib insidioso; pneumo e meningo abruptos. <b>Convulsão precoce<\/b> em 20–30% (sem pior prognóstico). <br><b>Meningococo<\/b>: petéquias/púrpura em ~60%. <br><b>Lactente/RN<\/b>: inespecífico — irritabilidade, choro ao ser pego, recusa alimentar, <b>hipotermia<\/b>, gemência, icterícia; febre e rigidez <b>nem sempre<\/b>; <b>fontanela abaulada<\/b> em 1/3; convulsões em 40%.", "fala": "Na criança maior a meningite se apresenta com febre, cefaleia e vômitos, mais rigidez de nuca e os sinais de Kernig e Brudzinski, e uma convulsão no início não piora o prognóstico. No meningococo, petéquias e púrpura aparecem em mais da metade. O problema é o lactente e o recém-nascido: o quadro é inespecífico, com irritabilidade, recusa alimentar, hipotermia e gemência, e febre e rigidez de nuca podem faltar. Fontanela abaulada aparece em um terço.", "pega": "RN com <b>hipotermia, recusa alimentar e gemência<\/b> sem rigidez de nuca <b>pode<\/b> ter meningite — punção.", "z": "Recém-nascido não lê livro: ele não tem rigidez de nuca, ele fica frio e para de mamar. Punciona, caralho.", "ills": ["m_clin"], "cap": 8, "ord": 3, "slides": [], "hot": ["q08_4"], "g": [], "m": []}, {"id": "m_puncao", "t": "Punção lombar imediata — mas nunca postergar o antibiótico", "s": "<b>Líquor imediatamente<\/b>, <b>exceto<\/b>: <b>instabilidade hemodinâmica<\/b>/respiratória · <b>sinais focais ou de HIC<\/b> · <b>coagulopatia<\/b>/plaquetopenia grave · infecção no local. <br>Em vermelho e sublinhado (slide 22): <b>MAS NUNCA POSTERGAR TRATAMENTO<\/b> — atraso de 3–6 h aumenta a mortalidade. <br>Com exceção: <b>hemocultura + antibiótico já<\/b>, punção depois; antígenos e PCR continuam úteis após o antibiótico.", "fala": "A regra da aula tem duas metades. A primeira: o líquor deve ser colhido imediatamente, a não ser que a criança esteja instável, tenha sinais focais ou de hipertensão intracraniana, ou coagulopatia. A segunda, que a professora escreveu em vermelho e sublinhou: nunca postergar o tratamento. Se não dá para puncionar agora, colhe hemocultura e começa o antibiótico, porque cada hora de atraso aumenta a mortalidade.", "pega": "Criança em <b>choque com púrpura<\/b>: <b>suporte + hemocultura + antibiótico imediato<\/b>; punção adiada. Tomografia de rotina antes da punção <b>só atrasa<\/b>.", "z": "Esperar tomografia pra dar ceftriaxona numa criança com púrpura e hipotensa é deixar o meningococo ganhar a corrida. Antibiótico primeiro, punção depois, porra.", "ills": ["m_puncao"], "cap": 8, "ord": 4, "slides": [], "hot": ["q08_1", "q08_8"], "g": [], "m": []}, {"id": "m_lcr", "t": "O líquor: viral × bacteriana × tuberculosa (slide 26)", "s": "<table class=t><tr><th><\/th><th>Bacteriana<\/th><th>Viral<\/th><th>Tuberculosa<\/th><\/tr><tr><td>Células<\/td><td><b>&gt; 1.000<\/b><\/td><td>&lt; 1.000<\/td><td>20–500<\/td><\/tr><tr><td>Predomínio<\/td><td><b>neutrófilos<\/b><\/td><td>linfócitos<\/td><td>linfócitos<\/td><\/tr><tr><td>Proteína<\/td><td>100–200<\/td><td>normal/↑ leve<\/td><td><b>&gt; 100 (muito alta)<\/b><\/td><\/tr><tr><td>Glicose<\/td><td><b>&lt; 30<\/b><\/td><td>normal<\/td><td>baixa<\/td><\/tr><tr><td>Microbiologia<\/td><td>Gram + em ~85%<\/td><td>—<\/td><td>Ziehl-Neelsen + em 30%<\/td><\/tr><\/table><br>Aspecto turvo na bacteriana. Antígenos 70–90%; hemocultura positiva em até 90%. Viral nas primeiras 48 h pode ter neutrófilos.", "fala": "A tabela do líquor é questão certa. Bacteriana: mais de mil células, com neutrófilos, proteína entre cem e duzentos e glicose abaixo de trinta, com Gram positivo em oitenta e cinco por cento. Viral: menos de mil células, linfócitos, proteína e glicose normais. Tuberculosa: poucas células, de vinte a quinhentas, linfócitos, mas proteína muito alta e glicose baixa, com Ziehl-Neelsen positivo em só trinta por cento.", "div": "lcr_viral", "pega": "Tuberculosa: <b>poucas células<\/b> mas a <b>maior proteína<\/b> + glicose baixa. Diplococo <b>Gram-negativo<\/b> = meningococo.", "z": "Líquor turvo, glicose vinte e mil células de neutrófilo: isso é pus, não é virose. Ceftriaxona, porra.", "ills": ["m_lcr"], "cap": 8, "ord": 5, "slides": [], "hot": ["q08_2", "q08_3", "qn_lcr"], "g": [], "m": []}, {"id": "m_trat", "t": "Tratamento empírico por idade, doses e duração", "s": "Suporte: <b>SF 20 mL/kg em 5–10 min<\/b> se choque, UTI conforme gravidade, controle de convulsão e HIC. <br><b>Até 2 meses (60 dias)<\/b>: <b>ampicilina + cefotaxima<\/b> (2ª opção: ampicilina + aminoglicosídeo/gentamicina). <br><b>&gt; 2 meses<\/b>: <b>ceftriaxona (ou cefotaxima) + vancomicina<\/b> — nunca vancomicina isolada (penetração ruim). <br>Doses (slide 33): <b>ceftriaxona 100 mg/kg/dia 12/12 h<\/b> · cefotaxima 200 mg/kg/dia 6/6 h · <b>ampicilina 200–300 mg/kg/dia 6/6 h<\/b> · <b>vancomicina 60 mg/kg/dia 6/6 h<\/b>. <br>Duração: meningococo <b>5–7 d<\/b> · Hib 7–10 · pneumococo <b>10–14<\/b> · Gram-negativo 21 dias.", "fala": "O esquema empírico depende da idade. Até dois meses, ampicilina para cobrir Listeria e enterococo, mais cefotaxima para enterobactérias; a segunda opção é ampicilina com gentamicina. Acima de dois meses, ceftriaxona ou cefotaxima mais vancomicina, para pneumococo resistente, e nunca vancomicina sozinha. A ceftriaxona é cem miligramas por quilo por dia de doze em doze horas. Meningococo trata de cinco a sete dias e pneumococo de dez a catorze.", "pega": "No RN a cefalosporina é <b>cefotaxima<\/b> (ceftriaxona desloca bilirrubina). &gt; 2 meses: <b>C3G + vancomicina<\/b>.", "z": "Menor de dois meses: ampicilina mais cefotaxima. Maior: ceftriaxona mais vanco. Trocou os dois, deixou a Listeria ou o pneumococo resistente de presente, caralho.", "ills": ["m_trat"], "cap": 8, "ord": 6, "slides": [], "hot": ["q08_1", "q08_4"], "g": [], "m": []}, {"id": "m_dexa", "t": "Dexametasona: dose, idade e momento", "s": "<b>Dexametasona 0,15 mg/kg/dose IV 6/6 h por 2 dias<\/b>, em crianças <b>&gt; 6 semanas<\/b>, na meningite <b>bacteriana<\/b>. <br>Reduz <b>perda auditiva grave<\/b> e sequelas neurológicas (sobretudo Hib). <b>Previne, mas não reverte<\/b> → dar <b>antes ou junto da 1ª dose<\/b> do antibiótico.", "fala": "A dexametasona na meningite bacteriana é zero vírgula quinze miligrama por quilo por dose, de seis em seis horas, por dois dias, acima de seis semanas de vida. Ela reduz a surdez grave e outras sequelas, mas só previne, não reverte a lesão já instalada, por isso entra antes ou junto da primeira dose do antibiótico, nunca no terceiro dia.", "div": "dexa", "pega": "Dexa: <b>&gt; 6 semanas<\/b>, <b>0,15 mg/kg 6/6 h × 2 dias<\/b>, <b>antes/junto<\/b> do antibiótico. Não é para meningite viral.", "z": "Dexametasona no terceiro dia é colocar cinto de segurança depois da batida. Antes ou junto da primeira dose, porra.", "ills": ["m_dexa"], "cap": 8, "ord": 7, "slides": [], "hot": ["q08_7"], "g": [], "m": []}, {"id": "m_profil", "t": "Quimioprofilaxia: meningococo × Hib", "s": "<b>Meningococo<\/b>: <b>todo contato íntimo<\/b> (domicílio, creche, quem dormiu junto) dos 7 dias prévios, <b>vacinado ou não<\/b>: <br>• <b>rifampicina 10 mg/kg (máx 600 mg) 12/12 h por 2 dias<\/b> (RN 5 mg/kg 12/12 h) · ceftriaxona IM dose única 125 mg (&lt; 15 a) / 250 mg (≥ 15 a) · ciprofloxacina 500 mg (≥ 18 a) · azitromicina 10 mg/kg. <br><b>Hib<\/b>: se na casa há <b>criança &lt; 4 anos não vacinada ou parcialmente vacinada<\/b> → <b>todos os contatos domiciliares<\/b>: <b>rifampicina 20 mg/kg (máx 600) 1×/dia por 4 dias<\/b>. <br>Paciente: precaução respiratória nas primeiras <b>24–48 h<\/b> de antibiótico. Notificar.", "fala": "Na doença meningocócica, todo contato íntimo dos últimos sete dias recebe quimioprofilaxia, tendo vacina ou não: rifampicina, dez miligramas por quilo, máximo seiscentos, de doze em doze horas, por dois dias; alternativas são ceftriaxona intramuscular em dose única ou ciprofloxacina no adulto. No hemófilo, se houver na casa uma criança abaixo de quatro anos com vacina incompleta, todos os contatos da casa recebem rifampicina, vinte miligramas por quilo, uma vez ao dia, por quatro dias.", "pega": "Meningo: <b>10 mg/kg 12/12 h × 2 d<\/b>, <b>independe da vacina<\/b>. Hib: <b>20 mg/kg 1×/dia × 4 d<\/b>, para <b>todos<\/b> da casa se há &lt; 4 anos mal vacinado.", "z": "Irmão vacinado com meningo C dormindo no mesmo quarto? Rifampicina igual: a vacina C não cobre o B, porra.", "ills": ["m_profil"], "cap": 8, "ord": 8, "slides": [], "hot": ["q08_5", "q08_6"], "g": [], "m": []}, {"id": "m_vac", "t": "Vacinas que previnem meningite", "s": "<b>Meningocócica C<\/b>: 3, 5 e 12 meses (ACWY no adolescente). <b>Pentavalente<\/b> (inclui Hib): 2, 4 e 6 meses. <b>Pneumocócica 10<\/b>: 2, 4 e reforço aos 12 meses. <br><b>BCG<\/b>: protege contra as formas graves da tuberculose — <b>miliar e meníngea<\/b>.", "fala": "As vacinas do calendário que previnem meningite são a meningocócica C aos três, cinco e doze meses, com a ACWY no adolescente; a pentavalente, que inclui o hemófilo, aos dois, quatro e seis meses; e a pneumocócica dez aos dois, quatro e doze meses. E a BCG, aplicada ao nascer, existe justamente para prevenir as formas graves da tuberculose: a miliar e a meníngea.", "div": "acwy", "pega": "BCG previne <b>meningite tuberculosa<\/b> e miliar (não a TB pulmonar do adulto).", "z": "BCG não é vacina de tuberculose de pulmão de adulto; é vacina pra criança não ter meningite tuberculosa. Erra isso e leva bronca da Patrícia, caralho.", "m": [["MEDCURSO · S27 P01 02:22–03:38", "A BCG protege contra as formas graves: miliar e meníngea."]], "ills": ["m_vac"], "cap": 8, "ord": 9, "slides": [], "hot": ["q08_3"], "g": []}, {"id": "i_conc", "t": "Conceito, epidemiologia e agentes", "s": "ITU = <b>germe único<\/b> + inflamação <b>sintomática<\/b> do trato urinário. Até 7 anos: <b>8% das meninas<\/b>, &lt; 2% dos meninos. Recorrência <b>30% em 1 ano<\/b>, 50% em 5 anos. <br>Via <b>ascendente<\/b> (hematogênica no RN e na sepse). <br><b><i>E. coli<\/i>: 80–90% do 1º episódio<\/b>. <i>Proteus<\/i>: 30% das cistites em meninos (prepúcio). <i>S. saprophyticus<\/i>: 30% nas adolescentes.", "fala": "Infecção urinária é a inflamação sintomática do trato urinário por um único germe. Até os sete anos, ela atinge cerca de oito por cento das meninas e menos de dois por cento dos meninos, e volta em trinta por cento no primeiro ano. A via é ascendente, exceto no recém-nascido, em que é hematogênica. A Escherichia coli responde por oitenta a noventa por cento do primeiro episódio.", "pega": "<b>E. coli 80–90%<\/b>. No <b>RN<\/b> a via é <b>hematogênica<\/b> (por isso bacteremia).", "z": "Oitenta a noventa por cento é Escherichia coli. Se a questão perguntar o germe e você não marcar isso, merece pegar uma cistite, caralho.", "ills": ["i_conc"], "cap": 9, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "i_clin", "t": "Clínica por idade: o RN é sempre grave", "s": "<b>RN<\/b>: quadro de <b>sepse<\/b> ou arrastado (baixo ganho, icterícia, hipotermia, recusa alimentar); <b>alta probabilidade de bacteremia<\/b>, <b>mortalidade ~10%<\/b> → <b>ITU complicada, internar<\/b>. <br><b>Lactente<\/b>: <b>febre pode ser o único sinal<\/b> (febre sem sinais localizatórios); irritabilidade, vômitos. <br><b>Maiores<\/b>: <b>cistite<\/b> (disúria, polaciúria, urgência, sem febre) × <b>pielonefrite<\/b> (febre, calafrio, dor lombar/flanco, Giordano +). <br>Exame: PA, palpar rins e bexiga, fecaloma, genitália (fimose, sinéquia), <b>jato urinário<\/b>, região sacral.", "fala": "A apresentação da infecção urinária muda com a idade. No recém-nascido parece sepse, com hipotermia, icterícia e recusa alimentar, há bacteremia com frequência e a mortalidade chega a dez por cento, por isso todo recém-nascido é infecção complicada e interna. No lactente, a febre pode ser o único sinal. Na criança maior, separe cistite, sem febre e com disúria, de pielonefrite, com febre e dor lombar. E sempre olhe o jato e palpe a bexiga.", "pega": "Lactente com <b>febre sem foco<\/b> → pedir <b>urina<\/b>. RN com ITU = <b>internar sempre<\/b>.", "z": "Lactente febril sem foco e ninguém pediu urina? Então ninguém investigou a febre. Urina tipo um e cultura, porra.", "ills": ["i_clin"], "cap": 9, "ord": 2, "slides": [], "hot": ["q09_4"], "g": [], "m": []}, {"id": "i_coleta", "t": "Como colher a urina", "s": "<b>Com controle esfincteriano<\/b>: <b>jato médio<\/b> após higiene, idealmente 2 h sem urinar. <br><b>Sem controle<\/b>: estímulo suprapúbico (sucesso ~60%), <b>saco coletor<\/b> (troca a cada 30 min; <b>só vale o resultado negativo<\/b>), <b>cateterismo vesical<\/b> (contraindicado em vulvovaginite/balanopostite), <b>punção suprapúbica<\/b> (padrão-ouro; indicada quando diarreia, vulvovaginite ou balanopostite tornam a coleta duvidosa).", "fala": "Na criança com controle esfincteriano, colhe jato médio depois da higiene. No lactente, o saco coletor é o mais fácil, mas contamina muito: urocultura positiva por saco é muito difícil de valorizar, e só o resultado negativo é confiável para afastar infecção. Para confirmar, use cateterismo vesical ou punção suprapúbica, que é o padrão-ouro e a escolha quando há diarreia ou vulvovaginite.", "pega": "Saco coletor: <b>negativo afasta<\/b>, <b>positivo não confirma<\/b>. Saco <b>não<\/b> é o método preferencial.", "z": "Saco coletor positivo é cultura de períneo, não de bexiga. Negativo afasta; positivo, cateteriza e colhe direito, caralho.", "m": [["MEDCURSO · S36 38:01–39:33", "Saco coletor tem alto valor preditivo negativo."], ["MEDCURSO · S36 50:11–50:35", "“Saco coletor é o preferencial em &lt; 2 anos” foi a alternativa incorreta de uma questão comentada."]], "ills": ["i_coleta"], "cap": 9, "ord": 3, "slides": [], "hot": ["q09_1"], "g": []}, {"id": "i_lab", "t": "Urina e urocultura: os cortes", "s": "<b>Piúria<\/b>: <b>≥ 5 leucócitos/campo<\/b> ou <b>&gt; 10.000/mL<\/b> (VPP 40–80%). <b>Esterase leucocitária + nitrito<\/b> positivos = fortemente sugestivo (nitrito exige tempo na bexiga). <br><b>Urocultura<\/b> (slide 17): <b>≥ 100.000 UFC/mL de uma bactéria<\/b> = positiva · <b>&lt; 10.000<\/b> = negativa · <b>10.000–100.000<\/b> = <b>duvidosa → repetir<\/b> · <b>2 ou mais cepas<\/b> = contaminação. <br>Punção suprapúbica: <b>qualquer crescimento<\/b> é significativo.", "fala": "Piúria é cinco ou mais leucócitos por campo, ou mais de dez mil por mililitro. Esterase e nitrito positivos juntos sugerem muito a infecção. Na urocultura, cem mil unidades formadoras de colônia de uma única bactéria confirmam; menos de dez mil é negativo; entre dez mil e cem mil é duvidoso e se repete; e duas ou mais bactérias indicam contaminação. Na punção suprapúbica, qualquer crescimento vale.", "div": "urocult", "pega": "Jato médio com <b>40.000 UFC<\/b> = <b>duvidoso → repetir<\/b>. “Qualquer crescimento” vale só para <b>punção suprapúbica<\/b>.", "z": "Quarenta mil colônias no jato médio não é infecção nem é nada: repete a cultura antes de sair dando antibiótico, porra.", "m": [["MEDCURSO · S36 40:32–42:06", "Punção suprapúbica: qualquer crescimento; cateterismo ≥ 50 mil sem consenso; AAP ≥ 50 mil."]], "ills": ["i_lab"], "cap": 9, "ord": 4, "slides": [], "hot": ["q09_2"], "g": []}, {"id": "i_bact", "t": "Bacteriúria assintomática: não tratar", "s": "<b>3 uroculturas consecutivas positivas<\/b> (mesmo germe) em <b>3 dias a 2 semanas<\/b>, <b>sem sintomas<\/b> e sem piúria importante. Persistente em <b>mielomeningocele, bexiga neurogênica, cateterismo intermitente<\/b>. <br><b>Não tratar<\/b>: o tratamento seleciona germes mais virulentos e pode levar a ITU sintomática. (Exceções do MEDCURSO: gestante, manipulação urológica.)", "fala": "Bacteriúria assintomática é ter três uroculturas positivas seguidas, num intervalo de três dias a duas semanas, sem nenhum sintoma. É comum e persistente em quem tem mielomeningocele, bexiga neurogênica ou faz cateterismo de alívio. A conduta é não tratar, porque o antibiótico seleciona germes mais agressivos e acaba provocando a infecção sintomática que se queria evitar.", "pega": "Bacteriúria assintomática na bexiga neurogênica: <b>não tratar<\/b> (nem profilaxia).", "z": "Criança que cateteriza a bexiga sempre vai ter bactéria na urina. Tratar cultura em vez de tratar paciente é fábrica de superbactéria, caralho.", "m": [["MEDCURSO · S36 21:53–22:52", "Tratar só gestante e antes de manipulação urológica com lesão de mucosa."]], "ills": ["i_bact"], "cap": 9, "ord": 5, "slides": [], "hot": ["q09_8"], "g": []}, {"id": "i_trat", "t": "Tratamento: quando internar e as doses", "s": "<b>Iniciar o antibiótico logo após colher a urina<\/b> — a demora (&gt; 72 h) é fator de risco para <b>lesão renal<\/b>. <br><b>Internar<\/b>: toxemia, desidratação, <b>vômitos<\/b>/intolerância oral, choque, e <b>todo RN<\/b> (ITU complicada). <br><b>VO, 10 dias (7–14)<\/b>: SMX-TMP 40 + 8 mg/kg/dia 2× · cefadroxil 30–50 2× · <b>cefalexina 50–100 mg/kg/dia 4×<\/b> · ácido nalidíxico 60 4× · amoxicilina-clavulanato 40 2×. <br><b>EV/IM<\/b>: ceftriaxona 50–100 mg/kg/dia (1–2×) · gentamicina 7,5 (3×) · amicacina 15 (1–2×). <b>RN<\/b>: <b>ampicilina (ou penicilina) + aminoglicosídeo<\/b>. <br>Nitrofurantoína <b>não<\/b> trata pielonefrite (não atinge o parênquima).", "fala": "O antibiótico começa logo depois de colher a urina, porque a demora é fator de risco para cicatriz renal. Interna quem está toxemiado, desidratado, vomitando, em choque, e todo recém-nascido, que recebe ampicilina mais aminoglicosídeo. O resto trata por via oral por dez dias; a cefalexina é cinquenta a cem miligramas por quilo por dia em quatro doses. Pielonefrite sem gravidade também pode ser oral, mas nunca com nitrofurantoína.", "div": "duracao", "pega": "“Toda pielonefrite interna” é <b>mito<\/b>. <b>Não esperar<\/b> a urocultura para começar. Nitrofurantoína <b>não<\/b> para pielonefrite.", "z": "Esperar a urocultura pra começar antibiótico numa pielonefrite é dar setenta e duas horas de vantagem pra cicatriz renal. Colheu, começou, porra.", "m": [["MEDCURSO · S36 51:16–52:02", "Pielonefrite sem toxemia pode ser tratada ambulatorialmente."], ["MEDCURSO · S36 55:59–57:03", "Nitrofurantoína não atinge o parênquima renal."]], "ills": ["i_trat"], "cap": 9, "ord": 6, "slides": [], "hot": ["q09_3", "q09_4"], "g": []}, {"id": "i_profil", "t": "Profilaxia antibiótica: quando e com o quê", "s": "Dose <b>subterapêutica<\/b> (≈ 1/3 da dose, à noite). Indicações (slide 26): <b>durante a investigação<\/b> · <b>anomalia obstrutiva até a cirurgia<\/b> · <b>RVU graus III a V<\/b> · RVU I–II com ITU de repetição ou DMSA alterada · <b>recidivas frequentes<\/b> (6–12 meses). <br>Drogas: <b>nitrofurantoína ou SMX-TMP<\/b> (&gt; 2 meses); <b>cefalexina<\/b> (&lt; 2 meses). <br>Metanálises: <b>reduz ITU sintomática<\/b>, mas <b>não reduz novas cicatrizes<\/b>.", "fala": "A profilaxia usa dose baixa, cerca de um terço da dose, à noite. Ela está indicada durante a investigação, nas uropatias obstrutivas até a cirurgia, no refluxo de graus três a cinco, no refluxo leve com infecções de repetição ou cintilografia alterada, e nas recidivas frequentes. Acima de dois meses usa nitrofurantoína ou sulfametoxazol com trimetoprim; abaixo, cefalexina. E lembre: ela reduz infecção, mas não reduz cicatriz.", "pega": "&lt; 2 meses → <b>cefalexina<\/b>. RVU <b>I–II isolado<\/b> não tem indicação. Profilaxia <b>não<\/b> previne cicatriz.", "z": "Sulfa em bebê de um mês é pedir kernicterus. Abaixo de dois meses a profilaxia é cefalexina, porra.", "ills": ["i_profil"], "cap": 9, "ord": 7, "slides": [], "hot": ["q09_6"], "g": [], "m": []}, {"id": "i_imagem", "t": "Investigação por imagem após ITU febril (caiu 2×)", "s": "Investigar após o <b>1º episódio bem documentado<\/b> de ITU febril (slide 28). <br>• <b>USG de rins e vias urinárias<\/b>: primeiro; não vê RVU. <br>• <b>Uretrocistografia miccional (UCM)<\/b>: <b>principal exame para RVU<\/b> (e VUP); <b>só após o término do tratamento<\/b>, em profilaxia. <br>• <b>Cintilografia DMSA<\/b> (estática): <b>morfologia, cicatriz renal<\/b>, função de cada rim — <b>3 meses após a cura<\/b>. <br>• <b>DTPA<\/b> (dinâmica): <b>obstrução<\/b>; não serve para RVU. Cistografia isotópica: RVU sem iodo. <br>Algoritmo: <b>&lt; 2 anos → profilaxia até o USG<\/b>.", "fala": "Essa é a pergunta que mais caiu do capítulo. Depois de uma infecção urinária febril bem documentada, a investigação começa pelo ultrassom de rins e vias urinárias, que não enxerga refluxo. O refluxo é visto pela uretrocistografia miccional, o principal exame, feita só depois de terminar o tratamento. A cintilografia com DMSA mostra cicatriz renal, três meses após a cura. E o DTPA é para obstrução. Abaixo de dois anos, a criança fica em profilaxia até o ultrassom.", "div": "dmsa", "pega": "Os compilados <b>esqueceram a UCM<\/b>: é o exame do <b>refluxo<\/b>, cobrado junto com o <b>DMSA<\/b>. DMSA = “M de morfológica” (cicatriz).", "z": "Ultrassom, uretrocistografia e DMSA: três exames, três perguntas — anatomia, refluxo e cicatriz. Esqueceu a uretrocistografia, perdeu metade da questão, caralho.", "m": [["MEDCURSO · S36 1:07:34–1:08:14", "DMSA = M de Morfológica; para cicatriz, 4–6 meses após (slide: 3 meses)."]], "ills": ["i_imagem"], "cap": 9, "ord": 8, "slides": [], "hot": ["q09_5"], "g": []}, {"id": "i_rvu", "t": "Refluxo vesicoureteral, lesão renal e válvula de uretra posterior", "s": "<b>RVU<\/b>: ~1% das crianças, <b>30–40% das com ITU<\/b>; graus I–V; involução espontânea frequente, cirurgia rara; seguir até a idade adulta. <br><b>Risco de lesão renal<\/b>: <b>&lt; 1 ano<\/b>, <b>atraso no tratamento &gt; 72 h<\/b>, refluxo de alto grau, <b>obstrução<\/b>, recorrência. <br><b>Válvula de uretra posterior<\/b>: <b>menino<\/b>, hidronefrose bilateral pré-natal, <b>bexiga palpável<\/b>, <b>jato fraco/gotejamento<\/b>, ITU de repetição → confirma com <b>UCM<\/b>.", "fala": "O refluxo vesicoureteral está presente em trinta a quarenta por cento das crianças com infecção urinária, e costuma regredir sozinho. O risco de cicatriz renal é maior abaixo de um ano, quando o tratamento atrasa mais de setenta e duas horas, no refluxo de alto grau, na obstrução e nas recorrências. E o menino com hidronefrose bilateral no pré-natal, bexiga palpável e jato fraco tem válvula de uretra posterior até prova em contrário, confirmada pela uretrocistografia.", "pega": "Menino + bexiga distendida + jato em <b>gotejamento<\/b> = <b>VUP<\/b> → <b>UCM<\/b> (não DTPA).", "z": "Menino que faz xixi pingando e tem bexiga do tamanho de uma laranja não tem preguiça de urinar: tem válvula de uretra posterior. Uretrocistografia, porra.", "m": [["MEDCURSO · S36 Outros 16:54–20:17", "VUP: menino, hidronefrose bilateral, distensão vesical, jato fraco; confirma com UCM."]], "ills": ["i_rvu"], "cap": 9, "ord": 9, "slides": [], "hot": ["q09_7"], "g": []}, {"id": "s_conc", "t": "Choque: oferta × necessidade de oxigênio", "s": "Choque = <b>desequilíbrio entre oferta e necessidade de O₂<\/b> dos tecidos. Tripé: <b>volume – bomba – tônus<\/b>. <br>Oferta = conteúdo arterial de O₂ (Hb, SatO₂, pO₂) × <b>débito cardíaco<\/b> (FC × volume sistólico). PA = débito × resistência vascular. <br>A extração tecidual compensa até não conseguir → metabolismo anaeróbio → <b>lactato<\/b>.", "fala": "Choque é quando a oferta de oxigênio aos tecidos não dá conta da necessidade. A oferta depende do conteúdo de oxigênio no sangue, ou seja, hemoglobina e saturação, multiplicado pelo débito cardíaco. Por isso todo choque é falha de um dos três pés: volume, bomba ou tônus vascular. Enquanto os tecidos conseguem extrair mais oxigênio, a criança compensa; quando não conseguem, aparece o lactato.", "pega": "Choque é <b>perfusão<\/b>, não pressão: pode haver choque com <b>PA normal<\/b>.", "z": "Pressão normal não é salvo-conduto: o tecido pode estar se afogando em lactato com a pressão bonitinha no monitor, porra.", "ills": ["s_conc"], "cap": 10, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "s_tipos", "t": "Os quatro tipos de choque", "s": "<b>Hipovolêmico<\/b>: desidratação (diarreia, vômitos), hemorragia, queimadura — <b>o mais comum<\/b>. <br><b>Distributivo<\/b>: <b>séptico<\/b>, anafilático, neurogênico (vasodilatação). <br><b>Cardiogênico<\/b>: cardiopatia, miocardite, arritmia, acidose. <br><b>Obstrutivo<\/b>: <b>pneumotórax hipertensivo<\/b>, <b>tamponamento<\/b>, TEP. <br>Mais comuns na criança: <b>hipovolemia e sepse<\/b>.", "fala": "São quatro tipos. O hipovolêmico, por diarreia, vômitos, sangramento ou queimadura, é o mais comum na criança. O distributivo é o choque da vasodilatação, como na sepse e na anafilaxia. O cardiogênico é a bomba que falha, como na miocardite. E o obstrutivo é o coração impedido de encher ou ejetar, no pneumotórax hipertensivo e no tamponamento. Na prática pediátrica, hipovolemia e sepse dominam.", "pega": "Mais comuns na criança: <b>hipovolêmico<\/b> e <b>séptico<\/b>.", "z": "Na pediatria o choque é quase sempre a diarreia que ninguém hidratou ou a sepse que ninguém viu. O resto é exceção, caralho.", "ills": ["s_tipos"], "cap": 10, "ord": 2, "slides": [], "hot": [], "g": [], "m": []}, {"id": "s_recon", "t": "Compensado × descompensado e a hipotensão por idade", "s": "<b>Compensado<\/b>: <b>taquicardia<\/b> (1º sinal), palidez, <b>extremidades frias<\/b>, <b>TEC &gt; 2 s<\/b>, <b>oligúria<\/b>, pulsos periféricos presentes (finos), <b>PA normal<\/b>. <br><b>Descompensado<\/b>: <b>hipotensão<\/b>, pulsos periféricos <b>ausentes<\/b>, <b>rebaixamento de consciência<\/b>. <br>TEC normal ≤ 2 s; diurese normal 1–2 mL/kg/h. <br><b>Hipotensão (PAS)<\/b> — único slide em quadro verde: <b>RN &lt; 60<\/b> · <b>1–12 meses &lt; 70<\/b> · <b>1–10 anos &lt; 70 + (2 × idade)<\/b> · <b>&gt; 10 anos &lt; 90<\/b> mmHg.", "fala": "Reconhecer o choque cedo é o objetivo da aula. No choque compensado a pressão ainda é normal, mas a criança tem taquicardia, palidez, extremidades frias, enchimento capilar lento e pouca urina. Descompensado é quando surge hipotensão, somem os pulsos periféricos ou a consciência cai. A hipotensão sistólica é abaixo de sessenta no recém-nascido, abaixo de setenta até um ano, setenta mais duas vezes a idade de um a dez anos, e abaixo de noventa acima de dez anos.", "div": "diurese", "pega": "Menino de <b>6 anos<\/b>: limite = 70 + 12 = <b>82<\/b>; PAS 80 = <b>hipotenso<\/b>. Hipotensão é sinal <b>tardio<\/b>.", "z": "Setenta mais duas vezes a idade. Seis anos, oitenta e dois. Abaixo disso a criança já gastou toda a compensação e está caindo do penhasco, porra.", "m": [["MEDCURSO · S30 P2 48:15–50:03", "Mesma fórmula da hipotensão: 70 + 2 × idade (1–10 anos)."]], "ills": ["s_recon"], "cap": 10, "ord": 3, "slides": [], "hot": ["q10_1", "q10_2"], "g": []}, {"id": "s_hora1", "t": "A primeira hora: oxigênio, acesso e volume", "s": "Posição supina se hipotensa; <b>O₂ em alta concentração<\/b> (máscara não reinalante com reservatório; avaliar via aérea/VM). <br><b>Acesso venoso ou intraósseo<\/b> (se não conseguir veia rapidamente). <br><b>SF 0,9% ou RL 20 mL/kg em 5–20 min<\/b> (graves: até 10 min), <b>repetir<\/b> reavaliando; <b>hemorragia<\/b> (trauma): concentrado de hemácias 10 mL/kg; <b>cardiogênico<\/b>: <b>5–10 mL/kg em 10–20 min<\/b>. <br><b>Reavaliar após 40–60 mL/kg<\/b> (sinais de sobrecarga: estertores, hepatomegalia). Exames: hemograma, <b>glicemia<\/b>, gasometria, Ca, K, <b>lactato<\/b>. Antibiótico precoce na sepse (protocolo). <b>Nunca soro glicosado na expansão.<\/b>", "fala": "Na primeira hora: oxigênio em alta concentração com máscara e reservatório, acesso venoso e, se a veia não sai, intraósseo sem demora. A expansão é soro fisiológico ou Ringer, vinte mililitros por quilo em cinco a vinte minutos, repetida a cada reavaliação. No choque cardiogênico as alíquotas caem para cinco a dez mililitros por quilo. Depois de quarenta a sessenta mililitros por quilo, reavalie e pense em amina. Glicemia sempre, e nunca soro glicosado para expandir.", "div": "bolus", "pega": "16 kg → <b>320 mL<\/b> em 5–20 min. Duas veias falharam → <b>intraóssea<\/b>. Estertores + fígado crescendo após bolus = <b>cardiogênico<\/b>: 5–10 mL/kg + dobutamina.", "z": "Duas tentativas de veia e nada? Intraóssea, agora. Enquanto você caça veia, a criança perde a primeira hora, caralho.", "m": [["MEDCURSO · S30 P2 18:29–20:04", "Expansão é com cristaloide isotônico, nunca glicosado."]], "ills": ["s_hora1"], "cap": 10, "ord": 4, "slides": [], "hot": ["q10_3", "q10_4"], "g": []}, {"id": "s_aminas", "t": "Aminas: frio, quente ou coração fraco", "s": "Choque que persiste após <b>40–60 mL/kg<\/b> → manter volume + <b>amina<\/b> (µg/kg/min): <br>• <b>Choque frio<\/b> (vasoconstrito, extremidades frias, pulsos finos): <b>adrenalina 0,05–1,5<\/b> (ou dopamina 2–20). <br>• <b>Choque quente<\/b> (vasodilatado, extremidades quentes, pulsos amplos, diastólica baixa): <b>noradrenalina 0,05–1,0<\/b>. <br>• <b>Insuficiência cardíaca<\/b>: <b>dobutamina 1–20<\/b> (inotrópico; pode baixar a PA). <br>Quente = queda da resistência vascular pelos mediadores da sepse, débito mantido ou alto.", "fala": "Se o choque persiste depois de quarenta a sessenta mililitros por quilo, mantém volume e começa amina, escolhida pelo tipo. Choque frio, com extremidades frias e pulsos finos, pede adrenalina. Choque quente, com extremidades quentes, pulsos amplos e diastólica baixa, é vasodilatação pelos mediadores da sepse e pede noradrenalina. E o coração que falha, na insuficiência cardíaca, pede dobutamina, que é inotrópico e pode baixar a pressão.", "div": "dopa", "pega": "Quente = <b>noradrenalina<\/b>; frio = <b>adrenalina<\/b>; IC = <b>dobutamina<\/b> (não usar dobutamina no quente hipotenso).", "z": "Extremidade quente e pressão no chão é vaso aberto demais: noradrenalina fecha a torneira. Dobutamina aí só abre mais, porra.", "ills": ["s_aminas"], "cap": 10, "ord": 5, "slides": [], "hot": ["q10_4", "q10_5"], "g": [], "m": []}, {"id": "s_obst", "t": "Choque obstrutivo e medidas finais", "s": "<b>Pneumotórax hipertensivo<\/b> (trauma, ventilação mecânica): ↓ murmúrio, <b>timpanismo<\/b>, desvio de traqueia, piora respiratória → <b>punção de tórax e drenagem<\/b>. <br><b>Tamponamento<\/b>: bulhas abafadas, turgência jugular, QRS de baixa voltagem → <b>punção pericárdica de alívio<\/b>. <br>Também: corrigir distúrbios metabólicos (glicose, cálcio, potássio, acidose), <b>UTI<\/b>; transporte só após estabilizar.", "fala": "Choque obstrutivo não melhora com volume nem com amina: precisa tirar a obstrução. No pneumotórax hipertensivo, típico do politrauma ou da ventilação mecânica, há murmúrio abolido e timpanismo de um lado, e a conduta é punção de tórax seguida de drenagem. No tamponamento, bulhas abafadas e jugulares túrgidas, a conduta é punção pericárdica de alívio. E sempre corrija glicose, cálcio e potássio, e leve para a terapia intensiva só depois de estabilizar.", "pega": "Intubado + timpanismo + murmúrio abolido + hipotensão = <b>punção de tórax<\/b> (não ecocardiograma, não mais volume).", "z": "Pneumotórax hipertensivo não se trata com o quarto bolus nem com noradrenalina: agulha no tórax, porra.", "ills": ["s_obst"], "cap": 10, "ord": 6, "slides": [], "hot": ["q10_6"], "g": [], "m": []}, {"id": "s_manut", "t": "Soro de manutenção: Holliday-Segar", "s": "<b>Volume/24 h<\/b>: <b>até 10 kg: 100 mL/kg<\/b> · <b>10–20 kg: 1000 + 50 mL/kg acima de 10<\/b> · <b>&gt; 20 kg: 1500 + 20 mL/kg acima de 20<\/b>. <br>Eletrólitos: <b>Na 3 mEq/kg/dia<\/b>, <b>K 2 mEq/kg/dia<\/b> (ou por 100 mL: Na 2–3, K 1–2). Ampolas: <b>NaCl 20% = 3,4 mEq/mL<\/b> · KCl 10% = 1,3 · <b>KCl 19,1% = 2,5 mEq/mL<\/b>. <br>Exemplo da aula: <b>30 kg<\/b> → 1500 + 200 = <b>1700 mL/dia<\/b> em 4 etapas de 425 mL (SG 5%) + eletrólitos → ~<b>72 mL/h<\/b>.", "fala": "Depois de estabilizar vem o soro de manutenção pela regra de Holliday-Segar. Até dez quilos, cem mililitros por quilo por dia. De dez a vinte quilos, mil mais cinquenta por cada quilo acima de dez. Acima de vinte, mil e quinhentos mais vinte por quilo acima de vinte. Some sódio três e potássio dois miliequivalentes por quilo por dia. O exemplo da aula é a criança de trinta quilos: mil e setecentos mililitros por dia, cerca de setenta e dois mililitros por hora.", "div": "eletro", "pega": "15 kg = 1000 + 50 × <b>5<\/b> = <b>1250 mL<\/b> (os 50 são só sobre os quilos <b>acima de 10<\/b>).", "z": "Quinze quilos não é mil setecentos e cinquenta: o cinquenta é só nos quilos acima de dez. Mil duzentos e cinquenta, caralho.", "ills": ["s_manut"], "cap": 10, "ord": 7, "slides": [], "hot": ["q10_7"], "g": [], "m": []}, {"id": "s_caso", "t": "O caso da aula: 10 anos, 30 kg", "s": "10 anos, 30 kg, febre há 5 dias e exantema, agora afebril e sonolenta: PA 80 (&lt; 90) = <b>choque descompensado<\/b> → <b>3 × 20 mL/kg<\/b> (600 mL cada) em 1 h. <br>Reavaliação: PA 90 × 60, mas <b>perfusão 4 s<\/b>, pulsos periféricos impalpáveis, sonolência = <b>ainda em choque<\/b>. <br>Após 60 mL/kg sem sobrecarga: <b>manter expansão + iniciar amina + exames<\/b> (slide 37–38: novo SF 20 mL/kg em 20 min). Só depois de estabilizar: <b>Holliday-Segar 1700 mL/dia<\/b>. <br>Confere com o grupo D da dengue (Cap. 6).", "fala": "O caso da aula junta tudo: uma criança de dez anos e trinta quilos, com febre de cinco dias e exantema, agora sem febre e sonolenta, com pressão de oitenta, abaixo de noventa, ou seja, choque descompensado. Recebe três bolus de vinte mililitros por quilo em uma hora. A pressão sobe para noventa, mas a perfusão segue em quatro segundos e os pulsos periféricos não voltam: ainda é choque. Então mantém volume, começa amina e pede exames; manutenção só depois.", "pega": "PA normalizou mas <b>TEC 4 s<\/b> e pulsos ausentes = <b>choque persistente<\/b> → amina; não é alta do choque.", "z": "Pressão de noventa com perfusão de quatro segundos é choque de maquiagem. Amina e reavaliação, porra.", "ills": ["s_caso"], "cap": 10, "ord": 8, "slides": [], "hot": ["q10_8"], "g": [], "m": []}], "Q": [{"id": "q01_1", "cap": 1, "src": "autoral", "orig": "Trilha 1.0 · Questão 1 · Dermatite atópica", "tag": "Dermatite atópica", "enun": "Menina de 7 anos, 22 kg, com prurido intenso há meses, piora noturna. Ao exame: placas eritematosas, espessadas e com sulcos acentuados nas fossas antecubitais e poplíteas; pele seca difusa. Mãe refere “alergia de pele” desde bebê, quando as lesões eram no rosto. Qual é a conduta de base mais adequada, segundo a aula?", "alts": ["Anti-histamínico oral contínuo como pilar do controle do prurido.", "Restaurar a barreira cutânea (banho curto e morno, sabonete de pH ácido, hidratante), associando corticoide tópico nas lesões em atividade.", "Tacrolimus tópico como primeira linha, já que a criança tem mais de 2 anos.", "Dieta de exclusão de trigo, leite, ovo e soja para todas as crianças com o diagnóstico."], "ok": 1, "coment": "<p><b>B.<\/b> A restauração da barreira é o “ponto-chave para controle da doença” e o <b>controle principal do prurido<\/b>  <i>(Sl. 24, 26)<\/i>; o corticoide tópico entra 1× ao dia nas lesões em atividade  <i>(Sl. 25)<\/i>.<\/p>\n<p><b>A<\/b> errada: anti-histamínico é reservado a doença concomitante (rinoconjuntivite)  <i>(Sl. 26)<\/i>. <b>C<\/b> errada: o inibidor de calcineurina é alternativa, não primeira linha, e o tacrolimus é para doença moderada/grave. <b>D<\/b> errada: o slide manda <i>evitar exposição<\/i> a alimentos desencadeantes identificados, não excluir às cegas.<\/p>", "blk": ["d_atop"], "slides": [], "pct": null}, {"id": "q01_2", "cap": 1, "src": "autoral", "orig": "Trilha 1.0 · Questão 2 · Impetigo", "tag": "Impetigo", "enun": "Pré-escolar de 4 anos, 16 kg, com lesões crostosas amarelo-mel em torno das narinas e do lábio superior há 3 dias. Está afebril, sem outras lesões e sem dor de garganta. Qual é o tratamento indicado pela aula?", "alts": ["Apenas higiene com água e sabão; antibiótico nunca é necessário.", "Antibiótico tópico isolado, pois a lesão é pouco extensa e a criança está afebril.", "Antibiótico oral (ex.: cefalexina) por 7 a 10 dias, pela proximidade com a cavidade oral, além da higiene.", "Aciclovir oral, pois lesões periorais em criança são herpes simples."], "ok": 2, "coment": "<p><b>C.<\/b> O slide 34 lista a <b>proximidade com a cavidade oral<\/b> entre as indicações de antibiótico oral, junto com casos extensos, febre e associação com faringite.<\/p>\n<p><b>A<\/b> errada: higiene é adjuvante; o slide indica antibiótico. <b>B<\/b> seria correta se a lesão não estivesse perioral. <b>D<\/b> errada: herpes se apresenta como vesículas agrupadas e, na primoinfecção, gengivoestomatite  <i>(Sl. 54)<\/i>; crosta melicérica é impetigo.<\/p>", "blk": ["d_pio"], "slides": [], "pct": null}, {"id": "q01_3", "cap": 1, "src": "autoral", "orig": "Trilha 1.0 · Questão 3 · Escabiose no lactente", "tag": "Escabiose no lactente", "enun": "Lactente de 6 semanas, 4,8 kg, com pápulas eritematosas pruriginosas em tronco, axilas e região periumbilical há 2 semanas. A mãe e o irmão de 6 anos têm prurido noturno. Qual é o tratamento tópico adequado para o lactente, segundo a aula?", "alts": ["Permetrina 5% em todo o corpo, incluindo face, por 8 a 14 horas.", "Ivermectina oral, repetindo em 1 semana.", "Pasta d’água com enxofre 5 a 10% por 3 noites consecutivas, repetindo após 7 dias, e tratar os contatos.", "Permetrina xampu 1%, aplicação única de 10 minutos."], "ok": 2, "coment": "<p><b>C.<\/b> Abaixo de <b>2 meses<\/b> (e em gestantes) o slide indica a <b>pasta d’água com enxofre<\/b>  <i>(Sl. 38)<\/i>; contatos sempre tratados.<\/p>\n<p><b>A<\/b> errada: a permetrina 5% é contraindicada em &lt; 2 meses (a inclusão da face seria certa para lactente mais velho). <b>B<\/b> errada: ivermectina só &gt; 15 kg. <b>D<\/b> errada: permetrina 1% xampu é o esquema da <b>pediculose<\/b>.<\/p>", "blk": ["d_zoo"], "slides": [], "pct": null}, {"id": "q01_4", "cap": 1, "src": "autoral", "orig": "Trilha 1.0 · Questão 4 · Tinea capitis", "tag": "Tinea capitis", "enun": "Escolar de 8 anos, 26 kg, com placa arredondada de alopecia no couro cabeludo, com descamação e cabelos quebrados rente à pele, há 1 mês. Qual conduta está de acordo com a aula?", "alts": ["Cetoconazol creme 2% por 4 semanas, isolado.", "Fluconazol 6 mg/kg/dia por 20 dias, que é a opção preferencial nessa idade.", "Griseofulvina 10 a 20 mg/kg/dia por 6 a 8 semanas, associada a xampu de sulfeto de selênio 2,5% duas vezes por semana.", "Observação: a tinea capitis é autolimitada."], "ok": 2, "coment": "<p><b>C.<\/b> Griseofulvina, permitida acima de 2 anos, por 6–8 semanas, com xampu adjuvante  <i>(Sl. 44)<\/i>.<\/p>\n<p><b>A<\/b> errada: imidazólico tópico isolado é o esquema da <b>tinea corporis<\/b>. <b>B<\/b> errada: no slide, o fluconazol está restrito a <b>&gt; 12 anos<\/b>. <b>D<\/b> errada: não há opção de observar na tinea capitis — quem é autolimitado é o molusco.<\/p>", "blk": ["d_mic"], "slides": [], "pct": null}, {"id": "q01_5", "cap": 1, "src": "autoral", "orig": "Trilha 1.0 · Questão 5 · Molusco contagioso", "tag": "Molusco contagioso", "enun": "Pré-escolar de 5 anos, 19 kg, com dermatite atópica, frequenta nataçã
