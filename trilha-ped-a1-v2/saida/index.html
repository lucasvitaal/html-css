<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha Ped A1 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F1EC;--card:#fff;--ink:#231C1E;--ink2:#5C5153;--ink3:#8E8284;--line:#E6D9D2;
--wine:#7A2E4A;--wine2:#9A4466;--cream:#FBF3E9;--grey:#F0EEEC;--amber:#B07D3A;--amberbg:#FBF0DD;--brick:#A8432A;--brickbg:#FBECE6;
--teal:#1E5E6E;--tealbg:#E4EFF2;--green:#2E6B4F;--greenbg:#E6F1EA;--purple:#5B3F8C;--purplebg:#EEE8F7;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1517;--card:#251E21;--ink:#F1E9EA;--ink2:#C9BCBE;--ink3:#97898C;--line:#3A3033;--wine:#E08AAA;--wine2:#F0A8C2;--cream:#2E2427;--grey:#2A2426;--amber:#E2B36C;--amberbg:#3A2E1C;--brick:#F08E74;--brickbg:#3A2420;--teal:#7CC3D3;--tealbg:#1C2E33;--green:#86CDA8;--greenbg:#1C2E25;--purple:#C2A8F0;--purplebg:#2B2338}}
:root[data-theme="dark"]{--bg:#1A1517;--card:#251E21;--ink:#F1E9EA;--ink2:#C9BCBE;--ink3:#97898C;--line:#3A3033;--wine:#E08AAA;--wine2:#F0A8C2;--cream:#2E2427;--grey:#2A2426;--amber:#E2B36C;--amberbg:#3A2E1C;--brick:#F08E74;--brickbg:#3A2420;--teal:#7CC3D3;--tealbg:#1C2E33;--green:#86CDA8;--greenbg:#1C2E25;--purple:#C2A8F0;--purplebg:#2B2338}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--wine)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{max-width:760px;margin:0 auto;padding:10px 14px 6px;display:flex;align-items:center;gap:10px}
.brand{font:800 19px/1.1 var(--serif);color:var(--wine);flex:1;letter-spacing:-.01em}
.brand small{display:block;font:400 12px var(--sans);color:var(--ink3);letter-spacing:0}
.clock{font:700 13px var(--sans);color:var(--teal);background:var(--tealbg);padding:4px 9px;border-radius:999px;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:17px}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink2)}
.tab.on{background:var(--wine);border-color:var(--wine);color:#fff}
.filters{max-width:760px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--ink2)}
.chip.on{border-color:var(--wine);color:var(--wine);background:var(--cream);font-weight:700}
.view{display:none;padding-top:14px}.view.on{display:block}
h2.vt{font:800 24px/1.15 var(--serif);color:var(--wine);margin:6px 0 4px}
p.lead{color:var(--ink2);margin:0 0 14px}
/* mapa */
.capcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.caphead{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.caphead h3{font:800 18px/1.2 var(--serif);margin:0;color:var(--ink)}
.caphead .aula{font-size:12px;color:var(--ink3)}
.bar{height:8px;border-radius:6px;background:var(--grey);margin:8px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple)}
.inc{width:100%;border-collapse:collapse;font-size:14px}
.inc td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.inc td:first-child{font-weight:700}
.inc .n0{color:var(--ink3);font-style:italic}
.caiu{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;color:#fff;background:var(--purple)}
.caiu.l1{background:#A08BC6}.caiu.l2{background:#7B62AA}
.never{display:inline-block;border-radius:6px;padding:0 6px;font-size:12px;color:var(--ink3);border:1px dashed var(--ink3)}
.go{text-align:left;border:0;background:none;color:var(--wine);font-weight:700;padding:0;text-decoration:underline}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin:10px 0 18px}
.legend span{display:flex;gap:6px;align-items:center}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* blocos */
.capbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}
.capsec{margin:0 0 22px}
.capsec>h3{font:800 21px/1.2 var(--serif);color:var(--wine);margin:18px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk{background:var(--card);border:1.5px solid var(--wine);border-radius:14px;margin:0 0 14px;overflow:hidden}
.blk>header{padding:12px 14px 8px;display:flex;gap:8px;align-items:flex-start}
.blk>header h4{font:700 17px/1.3 var(--serif);margin:0;flex:1}
.blk .bdg{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 8px}
.sb{display:inline-block;font:700 11px var(--sans);color:#fff;background:var(--wine);border-radius:5px;padding:1px 6px;border:0}
.sb.ghost{background:transparent;color:var(--wine);border:1px solid var(--wine)}
.enfb{display:inline-block;font:700 11px var(--sans);color:#fff;background:var(--amber);border-radius:5px;padding:1px 6px}
.slides{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scroll-snap-type:x mandatory}
.slides figure{margin:0;flex:0 0 88%;scroll-snap-align:start;position:relative}
.slides figure:only-child{flex-basis:100%}
.slides img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.slides figcaption{position:absolute;top:6px;left:6px}
.l1{padding:2px 14px 12px}
.l1 b{color:var(--wine)}
b.n,.n{background:var(--tealbg);color:var(--teal)!important;border-radius:4px;padding:0 3px;font-weight:700}
.l2{margin:0 14px 12px;background:var(--cream);border-left:4px solid var(--wine2);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
.l2 .lab,.l3 summary,.enf .lab,.pega .lab,.dv .lab{font:700 12px var(--sans);letter-spacing:.02em;display:block;margin-bottom:2px}
.l2 .lab{color:var(--wine2)}
.enf{margin:0 14px 12px;background:var(--amberbg);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
.enf .lab{color:var(--amber)}
.l3{margin:0 14px 12px;background:var(--grey);border-radius:10px;font-size:14px;color:var(--ink2)}
.l3 summary{padding:8px 12px;color:var(--teal);list-style:none;cursor:pointer}
.l3 summary::-webkit-details-marker{display:none}
.l3 summary:before{content:"▸ ";}.l3[open] summary:before{content:"▾ "}
.l3 .it{padding:0 12px 9px}
.cite{font:700 11px ui-monospace,Menlo,Consolas,monospace;color:var(--teal);background:var(--tealbg);border-radius:4px;padding:1px 5px;white-space:nowrap}
.pega{margin:0 14px 12px;background:var(--brickbg);border-left:4px solid var(--brick);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
.pega .lab{color:var(--brick)}
.dv{margin:0 14px 12px;background:var(--greenbg);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:9px 12px;font-size:14px}
.dv .lab{color:var(--green)}
.ill{margin:0 14px 12px;cursor:zoom-in}.ill svg{display:block;width:100%;height:auto;border-radius:12px}
.qlinks{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px}
.ql{border:1px solid var(--purple);color:var(--purple);background:var(--purplebg);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700}
.acts{display:flex;gap:6px;padding:8px 14px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--ink2)}
.act.on{border-color:var(--amber);color:var(--amber);font-weight:700}
.act.rev.on{border-color:var(--brick);color:var(--brick)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.t th{background:var(--wine);color:#fff;text-align:left;padding:6px 8px;font-size:13px}
table.t td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.tw{overflow-x:auto}
body.soslide .l2,body.soslide .l3,body.soslide .ill,body.soslide .dv{display:none}
.hide{display:none!important}
/* questões */
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 14px;overflow:hidden}
.q .qh{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;background:var(--purplebg);color:var(--purple);font-size:13px;font-weight:700}
.q .qh.aut{background:var(--grey);color:var(--ink3)}
.q .en{padding:12px 14px 6px}
.q .al{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px}
.q .al button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:15px}
.q .al button.ok{border-color:var(--green);background:var(--greenbg);font-weight:700}
.q .al button.bad{border-color:var(--brick);background:var(--brickbg);text-decoration:line-through}
.q .why{display:none;padding:10px 14px 12px;border-top:1px solid var(--line);font-size:15px}
.q.done .why{display:block}
.q .why .mini{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.q .why .mini img{height:80px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
/* slides */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{position:relative;border:0;padding:0;background:none;text-align:left}
.st img{width:100%;aspect-ratio:1456/840;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
.st span{position:absolute;top:5px;left:5px}
.st .used{position:absolute;top:5px;right:5px;background:var(--green);color:#fff;font-size:10px;border-radius:4px;padding:0 4px}
input.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;margin:0 0 10px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,10,14,.82);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 20px)}
.modal.on{display:block}
.modal .box{max-width:900px;margin:0 auto;background:var(--card);border-radius:14px;overflow:hidden}
.modal .box img{width:100%;display:block;background:#fff}
.modal .box .mb{padding:12px 14px}
.modal .x{position:sticky;top:0;float:right;margin:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:18px}
/* aula guiada */
.stage{background:var(--card);border:1.5px solid var(--wine);border-radius:16px;overflow:clip}
.stage .where{font-size:13px;color:var(--ink3);padding:10px 14px 0}
.stage h3{font:800 20px/1.25 var(--serif);color:var(--wine);margin:4px 14px 8px}
.ctrl{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.big{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
.big.play{background:var(--teal);color:#fff}.big.next{background:var(--wine);color:#fff;flex:1}.big.prev{background:var(--grey)}
.speaking{outline:3px solid var(--teal);outline-offset:-3px}
/* véspera, cola */
.flash{display:grid;gap:8px}
.fc{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left}
.fc .a{display:none;color:var(--green);font-weight:700;margin-top:6px}.fc.open .a{display:block}
.fc .c{font-size:11px;color:var(--ink3)}
.pg{background:var(--brickbg);border-left:4px solid var(--brick);border-radius:0 10px 10px 0;padding:8px 12px;margin:0 0 8px;font-size:15px}
.pg small{display:block;color:var(--ink3)}
.cola h3{font:800 18px var(--serif);color:var(--wine);margin:16px 0 6px}
.cola table{width:100%;border-collapse:collapse;font-size:14px}
.cola td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.cola td:first-child{color:var(--ink2);width:42%}
.cola td:last-child{font-weight:700;color:var(--teal)}
.dvt td{font-size:14px}
.dvt td:last-child{background:var(--greenbg);font-weight:700}
/* caderno */
.cadi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.cadi .meta{font-size:12px;color:var(--ink3)}
.cadi .del{float:right;border:0;background:none;color:var(--ink3)}
.syncst{font-size:12px;color:var(--ink3);margin:0 0 10px}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:var(--bg);color:var(--ink)}
#hlb{position:fixed;z-index:50;display:none;border:0;background:var(--amber);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;font-size:14px;z-index:70;display:none}
mark.hl{background:#FCE5A8;color:inherit;border-radius:3px}

/* ===== redesenho iPhone: barra inferior, slides protagonistas ===== */
html{-webkit-text-size-adjust:100%}
body{font-size:calc(16px * var(--fs,1));-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);min-height:54px}
.bnav button i{font-style:normal;font-size:21px;line-height:1}
.bnav button.on{color:var(--wine);font-weight:700}
.sheet{position:fixed;inset:0;z-index:55;display:none;background:rgba(20,10,14,.45)}
.sheet.on{display:block}
.sheet .pan{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 16px);max-width:760px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet .opt{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:13px 6px;border-bottom:1px solid var(--line);font-size:17px}
.sheet .opt i{font-style:normal;font-size:22px;width:30px;text-align:center}
.sheet .opt small{display:block;font-size:13px;color:var(--ink3)}
.sheet .tools{display:flex;gap:8px;padding-top:12px;flex-wrap:wrap}
.top .row{padding-bottom:8px}
.top .tabs{display:none}
/* slide como protagonista */
.shero{position:relative;background:#fff;border-bottom:1px solid var(--line)}
.shero .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.shero .track::-webkit-scrollbar{display:none}
.shero figure{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative}
.shero img{width:100%;display:block;aspect-ratio:1456/840;object-fit:contain;background:#fff}
.shero .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px;pointer-events:none}
.shero .who{position:absolute;left:8px;top:8px;display:flex;gap:4px;align-items:center}
.fac{font:700 10px var(--sans);letter-spacing:.04em;background:#fff;color:var(--wine);border:1px solid var(--wine);border-radius:5px;padding:1px 5px}
.blk>header{padding-top:12px}
.blk .bdg{padding-top:2px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none}
.thumbs button{flex:0 0 auto;border:2px solid transparent;border-radius:7px;padding:0;background:none}
.thumbs button.on{border-color:var(--wine)}
.thumbs img{height:46px;border-radius:5px;display:block}
.toleitor{border:0;background:none;color:var(--wine);font-weight:700;font-size:14px;padding:6px 14px 0}
/* leitor de slides */
.reader{background:var(--card);border:1.5px solid var(--wine);border-radius:16px;overflow:hidden}
.reader .rtop{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:14px}
.reader .rtop b{color:var(--wine)}
.reader .pos{margin-left:auto;color:var(--ink3);font-size:13px}
.reader .stagei{position:relative;background:#fff;touch-action:pan-y}
.reader .stagei img{width:100%;display:block;aspect-ratio:1456/840;object-fit:contain}
.reader .nav2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px}
.reader .nav2 button{border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px;background:var(--grey)}
.reader .nav2 button.nx{background:var(--wine);color:#fff}
.prog{height:4px;background:var(--grey)}.prog i{display:block;height:100%;background:var(--wine)}
.rsec{padding:4px 14px 12px}
.rsec h5{font:700 13px var(--sans);color:var(--ink3);margin:12px 0 6px;letter-spacing:.02em}
.rblk{border:1px solid var(--line);border-left:4px solid var(--wine);border-radius:0 10px 10px 0;padding:9px 12px;margin:0 0 8px;background:var(--bg)}
.rblk h6{font:700 15px/1.3 var(--serif);margin:0 0 4px;color:var(--wine)}
.rblk .l1{padding:0;font-size:15px}
.rtxt{font-size:14px;color:var(--ink2);background:var(--grey);border-radius:10px;padding:8px 12px}
.rtxt summary{color:var(--teal);font-weight:700;cursor:pointer}
.modebar{display:flex;gap:6px;margin:0 0 10px}
.cont{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--wine);border-radius:14px;padding:10px;margin:0 0 14px;width:100%;text-align:left}
.cont img{width:116px;border-radius:8px;border:1px solid var(--line)}
.cont b{color:var(--wine)}
.capthumbs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 4px;scrollbar-width:none}
.capthumbs img{height:62px;border-radius:6px;border:1px solid var(--line);background:#fff}
.zoomwrap{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}
.zoomwrap img{width:100%;transition:width .2s}
.zoomwrap.z2 img{width:220%;max-width:none}
.zbar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.act,.chip,.ql{min-height:34px}

.gv{margin:6px 0 0;font-size:15px}
.gcite{color:var(--wine2);background:var(--cream);border:1px solid var(--line)}
.agprog{height:5px;background:var(--grey)}.agprog i{display:block;height:100%;background:var(--wine)}
.agcap{margin:10px 14px 4px;background:var(--tealbg);border-radius:12px;padding:10px 12px;font-size:17px;line-height:1.45;min-height:64px}
.caplab{display:inline-block;font:700 11px var(--sans);letter-spacing:.03em;color:var(--teal);margin-bottom:3px}
.caplab.k-grav{color:var(--wine2)}.caplab.k-pega{color:var(--brick)}.caplab.k-caiu{color:var(--purple)}
.agsegs{display:flex;gap:3px;padding:0 14px 8px}.agsegs i{flex:1;height:4px;border-radius:2px;background:var(--grey)}.agsegs i.done{background:var(--teal)}.agsegs i.cur{background:var(--wine)}
.agsum{margin:0 14px 10px;background:var(--grey);border-radius:10px;font-size:15px}

a Meus erros", "escorregou na casca de banana — revisa", "vai pro Meus erros e volta forte", "quase — lê o comentário e refaz"]}, "gorila": {"falas": []}, "gami": {"niveis": [[0, "Recém-nascido de termo"], [120, "Lactente sorridente"], [300, "Pré-escolar curioso"], [550, "Escolar no P50"], [800, "R1 de Pediatria"], [1050, "Lenda da Puericultura"]], "medalhas": {"first": ["🍼", "Primeira mamada"], "c3": ["💉", "Calendário em dia"], "c5": ["📈", "Curva no P50"], "c10": ["🏅", "Carteirinha completa"]}}};
const D={"caps": [{"n": 1, "t": "Dermatoses na infância", "short": "Dermatoses", "aula": "Aula 1 · slides da Patrícia", "icon": "🧴", "col": "#B07D3A", "bul": ["Reconhecer pela descrição: crosta melicérica, túnel, umbilicação, liquenificação", "Dermatite atópica: face/extensoras no lactente → flexoras no escolar", "Limites: permetrina &lt; 2 m, ivermectina &lt; 15 kg, calcineurina &lt; 2 anos", "Urticária aguda até 6 semanas (caiu em 2025/2)"], "medalha": ["🧴", "Pele de pêssego"], "grav": ""}, {"n": 2, "t": "Doenças exantemáticas", "short": "Exantemáticas", "aula": "Aula 2 · slides da Patrícia", "icon": "🦠", "col": "#7A2E4A", "bul": ["Escarlatina × mono: caiu 2× (Filatov, Pastia, framboesa × linfócitos atípicos)", "Sarampo: 3 C + Koplik + retroauricular → craniocaudal", "Profilaxia: bloqueio sarampo 72 h · Ig 6 dias · VZIG 96 h", "Kawasaki: febre ≥ 5 d + 4/5 · IGIV 2 g/kg + AAS até o 10º dia"], "medalha": ["🦠", "Caçador de Koplik"], "grav": ""}, {"n": 3, "t": "Dores recorrentes na infância", "short": "Dores recorrentes", "aula": "Aula 3 · slides da Patrícia", "icon": "🤕", "col": "#5B3F8C", "bul": ["Recorrente = ≥ 3 episódios em ≥ 3 meses, interferindo nas atividades", "Abdominal: 90–95% funcional; alarme: desperta, periférica, irradia", "Dor de crescimento: bilateral, noturna, exame normal, melhora com massagem", "Cefaleia: caiu 2× (2,4 pts) — sinais de alarme, PA e exame neurológico"], "medalha": ["🤕", "Diário da dor"], "grav": ""}, {"n": 4, "t": "Adenomegalias e câncer infantil", "short": "Adenomegalias", "aula": "Aula 4 · slides da Patrícia", "icon": "🔎", "col": "#22666A", "bul": ["Adenite submandibular + supraclavicular: caiu 3× (até 2,6 pts)", "Suspeição (slide 12): ~4 sem · supraclavicular · &gt; 2–3 cm · duro, fixo, progressivo", "Supraclavicular D → tórax · E → abdome", "Câncer: LLA 80% · SNC 95% com achado neurológico · Wilms massa assintomática"], "medalha": ["🔎", "Palpador de gânglio"], "grav": ""}, {"n": 5, "t": "Violência na infância", "short": "Violência", "aula": "Aula 5 · slides da Patrícia", "icon": "🛡️", "col": "#A8432A", "bul": ["Bebê sacudido: caiu nas 3 provas + 2025/2 — HSD + hemorragia retiniana + sem trauma", "Suspeita já obriga: Conselho Tutelar (ECA 245), dever acima do sigilo", "Abuso sexual: 80% pais ou laço afetivo; exame físico muitas vezes normal", "Não confundir: mancha mongólica, coagulopatia, púrpuras, tinta de roupa"], "medalha": ["🛡️", "Conselheiro tutelar"], "grav": ""}, {"n": 6, "t": "Dengue na criança", "short": "Dengue", "aula": "Aula 6 · slides da Patrícia", "icon": "🦟", "col": "#2E6B4F", "bul": ["Grupo B com 15 kg: caiu nas 3 provas — VO supervisionada ≥ 50 mL/kg em 4–6 h", "Alarme (1 basta) → C: SF 20 mL/kg/h até 3×, Ht após 2 h", "Choque → D: 20 mL/kg em até 20 min até 3×, UTI", "NS1/PCR até o 5º dia · IgM a partir do 6º · laço criança 3 min ≥ 10"], "medalha": ["🦟", "Mata-mosquito"], "grav": ""}, {"n": 7, "t": "Hepatites virais", "short": "Hepatites", "aula": "Aula 7 · slides da Patrícia", "icon": "🟡", "col": "#B07D3A", "bul": ["Nunca caiu nas provas antigas — revisar rápido, sem descuidar", "B aguda = HBsAg + anti-HBc IgM · crônica = HBsAg + anti-HBc IgG/total", "RN de mãe HBsAg+: vacina + IGHAHB nas primeiras 24 h (slide), músculos diferentes", "HCV &lt; 18 meses: anti-HCV pode ser materno → PCR decide"], "medalha": ["🟡", "Leitor de sorologia"], "grav": ""}, {"n": 8, "t": "Meningites bacterianas", "short": "Meningites", "aula": "Aula 8 · slides da Patrícia", "icon": "🧠", "col": "#5B3F8C", "bul": ["&lt; 2 meses: ampicilina + cefotaxima (caiu 2×)", "&gt; 2 meses: ceftriaxona/cefotaxima + vancomicina", "Líquor: bacteriana &gt; 1.000, neutrófilos, glicose &lt; 30 · TB: proteína muito alta", "Profilaxia: meningo rifampicina 10 mg/kg 12/12 h × 2 d · Hib 20 mg/kg/dia × 4 d"], "medalha": ["🧠", "Punção de mão firme"], "grav": ""}, {"n": 9, "t": "Infecção do trato urinário", "short": "ITU", "aula": "Aula 9 · slides da Patrícia", "icon": "🚽", "col": "#1E5E6E", "bul": ["Investigação após ITU febril: caiu 2× — USG, UCM (RVU) e DMSA (cicatriz)", "E. coli 80–90% · RN = ITU complicada → internar", "Piúria ≥ 5/campo · urocultura ≥ 100.000 · 10–100 mil repetir", "Antibiótico logo após colher · profilaxia não evita cicatriz"], "medalha": ["🚽", "Jato médio perfeito"], "grav": ""}, {"n": 10, "t": "Choque na criança", "short": "Choque", "aula": "Aula 10 · slides da Patrícia", "icon": "🫀", "col": "#A8432A", "bul": ["PA normal não exclui choque: hipotensão é sinal tardio", "Hipotensão: RN &lt; 60 · 1–12 m &lt; 70 · 1–10 a &lt; 70 + 2 × idade · &gt; 10 a &lt; 90", "SF 20 mL/kg em 5–20 min, repetir; reavaliar após 40–60 mL/kg → amina", "Frio: adrenalina · quente: noradrenalina · IC: dobutamina · Holliday-Segar"], "medalha": ["🫀", "Primeira hora de ouro"], "grav": ""}], "blocks": [{"id": "d_semio", "t": "Semiologia da pele: descrever, apertar, acompanhar", "s": "Examinar com <b>luz natural<\/b> e descrever: <b>morfologia<\/b> (mácula, pápula, vesícula, pústula, crosta, placa), <b>distribuição<\/b> e <b>evolução<\/b>. <br><b>Digitopressão<\/b>: eritema <b>some<\/b> (vasodilatação) × púrpura <b>não some<\/b> (sangue fora do vaso → pensar em plaqueta, vasculite, meningococcemia). <br>Lesão vesicular evolui: <b>mácula → pápula → vesícula → pústula → crosta<\/b>.", "fala": "Na pele da criança o exame começa com luz natural e com palavras certas: morfologia, distribuição e evolução. O gesto que separa o banal do grave é a digitopressão. Eritema some quando você aperta, porque é vaso dilatado; púrpura não some, porque o sangue já saiu do vaso. Púrpura em criança febril é meningococo até prova em contrário.", "pega": "Mancha que <b>não some à digitopressão<\/b> = púrpura, não eritema. Em criança febril, a hipótese que mata é <b>meningococcemia<\/b>.", "z": "Apertou e não sumiu? Para de descrever bonitinho e corre: púrpura com febre é meningococo até alguém provar o contrário, porra.", "ills": ["d_semio"], "cap": 1, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "d_discrom", "t": "Discromias: vitiligo, pitiríase alba, mancha mongólica e nevo congênito", "s": "<b>Vitiligo<\/b>: mancha <b>acrômica<\/b> (branco-leite), bem delimitada, <b>simétrica<\/b>. <br><b>Pitiríase alba<\/b>: <b>hipocrômica<\/b>, descamação fina, face/braços, ligada à <b>atopia<\/b> → hidratar. <br><b>Mancha mongólica<\/b>: azul-acinzentada, <b>sacral/glútea<\/b>, desde o nascimento, <b>involui<\/b> em anos — não confundir com equimose (Cap. 5). <br><b>Nevo melanocítico congênito grande<\/b>: risco de melanoma de até <span class=n>12%<\/span> → acompanhar.", "fala": "As discromias se separam pela cor. Vitiligo é acrômico, branco-leite, simétrico. Pitiríase alba é só hipocrômica, com descamação fina, e anda junto com a atopia, por isso se trata hidratando. Mancha mongólica é azul-acinzentada, sacral, presente desde o nascimento e some com os anos. E o nevo congênito grande merece seguimento, porque o risco de melanoma chega a doze por cento.", "pega": "Mancha mongólica <b>não muda de cor<\/b> como equimose e está lá <b>desde o nascimento<\/b> — documente no prontuário para não virar suspeita de maus-tratos.", "z": "Mancha azul na bunda do bebê desde que nasceu não é surra, é mongólica. Anota no prontuário antes que a creche chame o Conselho Tutelar, caralho.", "ills": ["d_discrom"], "cap": 1, "ord": 2, "slides": [], "hot": [], "g": [], "m": []}, {"id": "d_urtic", "t": "Urticária e eritema tóxico neonatal", "s": "<b>Urticária<\/b>: placas eritematoedematosas, pruriginosas, fugazes, <b>somem à digitopressão<\/b>. <b>Aguda até <span class=n>6 semanas<\/span><\/b>; crônica &gt; 6 semanas. <br>Etiologias (gabarito 2025/2): <b>drogas, alimentos, inalantes, parasitoses, infecções, doenças sistêmicas, agentes físicos e psicogênicos<\/b>. <br>Tratamento: <b>anti-histamínico VO<\/b>; se edema de laringe/broncoespasmo → <b>adrenalina 0,01 mg/kg<\/b> (slide: subcutânea). <br><b>Eritema tóxico neonatal<\/b>: pápulas/pústulas no RN, benigno, <b>não se trata<\/b>.", "fala": "Urticária é a placa vermelha, inchada e que coça, que muda de lugar e some quando você aperta. Aguda vai até seis semanas; depois disso é crônica. As causas caíram em prova: remédios, alimentos, inalantes, parasitas, infecções, doenças sistêmicas, agentes físicos e causas psicogênicas. Trata com anti-histamínico pela boca e, se pegar laringe ou brônquio, adrenalina na dose de um centésimo de miligrama por quilo.", "div": "adren", "pega": "Urticária <b>aguda = até 6 semanas<\/b>. Eritema tóxico neonatal é benigno: <b>não trata<\/b>.", "z": "Criança empolada e chiando não é caso pra antialérgico e oração: é adrenalina, zero vírgula zero um miligrama por quilo, agora, porra.", "ills": ["d_urtic"], "cap": 1, "ord": 3, "slides": [], "hot": [], "g": [], "m": []}, {"id": "d_escam", "t": "Eritematoescamosas: psoríase × dermatite seborreica", "s": "<b>Psoríase<\/b>: placas eritematosas com <b>escama prateada<\/b>, em <b>superfícies extensoras<\/b> (cotovelos, joelhos), couro cabeludo. <br><b>Dermatite seborreica do lactente<\/b>: <b>escama amarelada e gordurosa<\/b> (crosta láctea), <b>sem prurido<\/b>, em couro cabeludo, face, axilas e região das fraldas.", "fala": "Nas eritematoescamosas, olhe a escama. Psoríase tem escama prateada e prefere as superfícies extensoras, como cotovelo e joelho. A seborreica do lactente tem escama amarelada e gordurosa, a famosa crosta láctea, quase não coça e aparece no couro cabeludo, na face, nas axilas e na fralda. Sem prurido no lactente pequeno, pense em seborreica antes de atópica.", "pega": "Seborreica do lactente <b>não coça<\/b>; atópica <b>coça muito<\/b>. Escama <b>gordurosa<\/b> = seborreica; <b>prateada<\/b> em extensoras = psoríase.", "z": "Crosta láctea é gordura, não sujeira: não precisa a avó esfregar o couro cabeludo do bebê com bucha, pelo amor de Deus.", "ills": ["d_escam"], "cap": 1, "ord": 4, "slides": [], "hot": [], "g": [], "m": []}, {"id": "d_atop", "t": "Dermatite atópica: distribuição por idade e conduta", "s": "Eczema mais comum (~<span class=n>20%<\/span> das crianças): <b>prurido<\/b>, pele seca, <b>liquenificação<\/b>. <br>Distribuição: <b>lactente → face e extensoras<\/b>; <b>criança maior → dobras flexoras<\/b> (antecubital, poplítea). <br>Base do tratamento: <b>restaurar a barreira<\/b> — banho curto e morno, sabonete de pH ácido, <b>hidratante<\/b> (é o controle principal do prurido) <i>(Sl. 24, 26)<\/i>. <br>Exacerbação: <b>corticoide tópico 1×/dia<\/b> nas lesões ativas (hidrocortisona na face; mometasona no corpo) <i>(Sl. 25)<\/i>; <b>inibidor de calcineurina<\/b> como alternativa, <b>&gt; 2 anos<\/b>; anti-histamínico só se doença concomitante (rinoconjuntivite) ou prurido; antibiótico se infecção secundária. <br>Alimentos: evitar só o desencadeante <b>identificado<\/b>, nunca dieta às cegas.", "fala": "Dermatite atópica é a criança que coça. No lactente pega face e superfícies extensoras; no escolar migra para as dobras, atrás do joelho e na frente do cotovelo. O pilar é a barreira: banho curto e morno, sabonete ácido e muito hidratante, que é o que mais controla o prurido. Na crise entra o corticoide tópico uma vez ao dia nas lesões ativas, e o inibidor de calcineurina só depois dos dois anos.", "div": "desonida", "pega": "O <b>pilar<\/b> é a <b>barreira cutânea<\/b> (hidratante), não o anti-histamínico. Calcineurina tópica só <b>&gt; 2 anos<\/b> e como alternativa.", "z": "Pele de atópico é muro sem reboco: sem hidratante não adianta jogar corticoide em cima. Hidrata essa porra todo dia.", "ills": ["d_atop"], "cap": 1, "ord": 5, "slides": [], "hot": ["q01_1"], "g": [], "m": []}, {"id": "d_frald", "t": "Dermatite das fraldas × candidíase", "s": "<b>Dermatite de contato irritativa<\/b> (fralda): eritema nas <b>superfícies convexas<\/b>, <b>poupa as dobras<\/b> → trocas frequentes, <b>creme de barreira<\/b> (óxido de zinco); hiperemia intensa: corticoide de <b>baixa potência por 2–3 dias<\/b>. <br><b>Candidíase<\/b>: eritema vivo que <b>invade as dobras<\/b>, com <b>lesões satélites<\/b> → <b>nistatina ou miconazol 1% por 14 dias<\/b> <i>(Sl. 29)<\/i>; slide 49: nistatina creme 6/6 h por 7–14 dias.", "fala": "Na área da fralda, a pergunta é se a dobra está poupada. A dermatite irritativa pega as superfícies convexas, onde a fralda encosta, e poupa as dobras: resolve com trocas frequentes e creme de barreira. Se o vermelho invade as dobras e aparecem lesões satélites nas bordas, é cândida, e aí entra antifúngico tópico, nistatina ou miconazol, por catorze dias.", "pega": "<b>Poupa dobra<\/b> = irritativa; <b>invade dobra + satélites<\/b> = <i>Candida<\/i>. Corticoide só de <b>baixa<\/b> potência e por <b>2–3 dias<\/b>.", "z": "Lesão satélite é a cândida mandando cartão-postal da dobra. Óxido de zinco não mata fungo, porra: nistatina por catorze dias.", "ills": ["d_frald"], "cap": 1, "ord": 6, "slides": [], "hot": ["q01_6"], "g": [], "m": []}, {"id": "d_pio", "t": "Piodermites: impetigo, erisipela e celulite", "s": "<b>Impetigo<\/b>: <b>crosta melicérica<\/b> (amarelo-mel), perioral/perinasal; <i>S. aureus<\/i> e estreptococo. <br>Antibiótico <b>oral<\/b> (ex.: cefalexina 7–10 dias) se: <b>extenso<\/b>, <b>febre<\/b>, <b>faringite<\/b> associada ou <b>proximidade da cavidade oral<\/b> <i>(Sl. 34)<\/i>; senão, tópico + higiene. <br><b>Erisipela<\/b>: borda <b>nítida<\/b>, elevada (derme superficial) × <b>celulite<\/b>: borda <b>mal definida<\/b> (derme profunda/subcutâneo).", "fala": "Impetigo é a crosta cor de mel em volta do nariz e da boca, causada por estafilococo ou estreptococo. Lesão pequena trata com higiene e antibiótico tópico, mas a aula manda antibiótico oral quando é extenso, quando tem febre, quando vem com faringite ou quando está perto da boca. E para separar erisipela de celulite, olhe a borda: na erisipela ela é nítida; na celulite, borrada.", "pega": "Impetigo <b>perioral<\/b> já indica antibiótico <b>oral<\/b>, mesmo pequeno e afebril. Impetigo é porta de entrada para <b>GNPE<\/b> e adenite.", "z": "Crosta cor de mel do lado da boca não é herpes nem mel de abelha: é impetigo, e perto da boca a Patrícia quer antibiótico oral, caralho.", "ills": ["d_pio"], "cap": 1, "ord": 7, "slides": [], "hot": ["q01_2"], "g": [], "m": []}, {"id": "d_zoo", "t": "Escabiose e pediculose: quem pode o quê", "s": "<b>Escabiose<\/b>: <b>prurido noturno<\/b> + <b>contatos com prurido<\/b> + <b>túnel<\/b>; no lactente pega palmas, plantas, axilas, face. <br>• <b>Permetrina 5%<\/b> no corpo todo (no lactente <b>inclusive face e couro cabeludo<\/b>), 8–14 h, repetir em 7 dias — <b>contraindicada &lt; 2 meses<\/b>. <br>• <b>&lt; 2 meses e gestante<\/b>: <b>pasta d’água com enxofre 5–10%<\/b>, 3 noites, repetir após 7 dias <i>(Sl. 38)<\/i>. <br>• <b>Ivermectina<\/b> oral só <b>&gt; 15 kg<\/b>; repetir em 1 semana. <br>• <b>Tratar todos os contatos<\/b>, lavar roupas. <br><b>Pediculose<\/b>: <b>permetrina 1% xampu<\/b>, 10 min, repetir em 7–10 dias; pente fino.", "fala": "Escabiose é prurido que piora à noite, com gente da casa coçando também. A permetrina a cinco por cento vai no corpo inteiro, e no lactente inclui face e couro cabeludo, mas é proibida abaixo de dois meses: aí, e na gestante, se usa pasta d’água com enxofre. Ivermectina oral só acima de quinze quilos. E sempre trata todos os contatos ao mesmo tempo, senão a família fica passando o ácaro de um pro outro.", "div": "iverm", "pega": "&lt; 2 meses → <b>enxofre<\/b>; ivermectina só <b>&gt; 15 kg<\/b>; <b>permetrina 1% xampu<\/b> é da <b>pediculose<\/b>, não da escabiose.", "z": "Tratou só o bebê e esqueceu a família? Parabéns, criou um condomínio de Sarcoptes. Trata todo mundo da casa, porra.", "ills": ["d_zoo"], "cap": 1, "ord": 8, "slides": [], "hot": ["q01_3"], "g": [], "m": []}, {"id": "d_mic", "t": "Micoses: tinea capitis, corporis, versicolor e sapinho", "s": "<b>Tinea capitis<\/b>: placa de alopecia com descamação e cabelos quebrados → <b>antifúngico sistêmico obrigatório<\/b>: <b>griseofulvina 10–20 mg/kg/dia por 6–8 semanas<\/b> (&gt; 2 anos) + xampu de <b>sulfeto de selênio 2,5%<\/b> 2×/semana; fluconazol só <b>&gt; 12 anos<\/b> no slide <i>(Sl. 44)<\/i>. <br><b>Tinea corporis<\/b>: placa anular de borda ativa → <b>imidazólico tópico 4 semanas<\/b>. <br><b>Pitiríase versicolor<\/b>: tópico por <b>30 dias<\/b>. <br><b>Candidíase oral (sapinho)<\/b>: <b>nistatina 6/6 h<\/b> até <b>2 dias após<\/b> sumirem as placas.", "fala": "Nas micoses, a regra de ouro é o couro cabeludo: tinea capitis não responde a creme, exige antifúngico pela boca. A droga da aula é a griseofulvina, dez a vinte miligramas por quilo por dia, por seis a oito semanas, acima de dois anos, junto com xampu de sulfeto de selênio. Tinea do corpo é tópica por quatro semanas, a versicolor tópica por trinta dias, e o sapinho leva nistatina até dois dias depois de sumir.", "pega": "Tinea <b>capitis<\/b> = <b>sistêmico<\/b> (griseofulvina 6–8 sem). Creme isolado é esquema da tinea <b>corporis<\/b>.", "z": "Passar creme em tinea capitis é tentar apagar incêndio de prédio com borrifador. Griseofulvina, seis a oito semanas, caralho.", "ills": ["d_mic"], "cap": 1, "ord": 9, "slides": [], "hot": ["q01_4"], "g": [], "m": []}, {"id": "d_vir", "t": "Viroses de pele: molusco, verruga, herpes e zóster", "s": "<b>Molusco contagioso<\/b> (poxvírus): pápula perolada com <b>umbilicação central<\/b>; mais em atópicos e piscina; <b>autolimitado<\/b> (6 meses–2 anos) → tratar é opcional (expressão com iodo, químicos, crio/laser) <i>(Sl. 50–51)<\/i>. <br><b>Verruga<\/b> (HPV): superfície áspera com <b>pontos negros<\/b>; ácido salicílico. <br><b>HSV-1<\/b>: primoinfecção = <b>gengivoestomatite<\/b>; vesículas agrupadas. <b>HSV-2 genital na criança → pensar em abuso<\/b>. <br><b>Zóster<\/b>: raro, <b>unilateral, segue dermátomo<\/b>.", "fala": "Nas viroses de pele, molusco é a pápula perolada com um umbigo no meio, causada por um poxvírus, comum em atópico e em quem frequenta piscina. Ele some sozinho entre seis meses e dois anos, então tratar é opcional. Verruga é do papilomavírus e tem pontinhos pretos. A primeira infecção pelo herpes tipo um é a gengivoestomatite. E herpes genital tipo dois numa criança obriga a pensar em abuso sexual.", "pega": "Molusco = <b>poxvírus<\/b>, autolimitado; verruga = <b>HPV<\/b>. Zóster respeita <b>dermátomo e linha média<\/b>; disseminado lembra varicela.", "z": "Molusco é o vírus mais preguiçoso da pele: vai embora sozinho em até dois anos. Agora, herpes genital em criança não é preguiça, é notificação.", "ills": ["d_vir"], "cap": 1, "ord": 10, "slides": [], "hot": ["q01_5"], "g": [], "m": []}, {"id": "e_conc", "t": "Exantema: o que é e como classificar", "s": "Exantema = erupção cutânea de doença sistêmica (geralmente infecciosa). Tipos: <b>maculopapular<\/b> (morbiliforme, rubeoliforme, escarlatiniforme), <b>vesicular<\/b> (varicela, mão-pé-boca), <b>petequial/purpúrico<\/b> (meningococcemia — emergência). <br>Digitopressão separa eritema de púrpura. Transmissão por <b>aerossol<\/b>: só <b>sarampo e varicela<\/b> (isolamento respiratório para aerossóis).", "fala": "Exantema é a pele contando que existe uma doença sistêmica por trás. Classifique primeiro: maculopapular, como sarampo, rubéola e escarlatina; vesicular, como varicela e mão-pé-boca; e petequial ou purpúrico, que em criança febril é meningococcemia até prova em contrário. Guarde também que só sarampo e varicela se transmitem por aerossol.", "pega": "Aerossol = <b>sarampo e varicela<\/b> (máscara N95, quarto privativo). Exantema <b>petequial<\/b> + febre = <b>meningococcemia<\/b>.", "z": "Exantema que não some no aperto em criança com febre não é virose de creche, é meningococo querendo matar alguém. Antibiótico já, porra.", "ills": ["e_conc"], "cap": 2, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "e_saramp", "t": "Sarampo: pródromo, Koplik e exantema craniocaudal", "s": "Paramixovírus. <b>Pródromo catarral<\/b> (os <b>3 C<\/b>: tosse, coriza, conjuntivite) com <b>febre que sobe<\/b>; <b>manchas de Koplik<\/b> (patognomônicas, mucosa jugal). <br>Exantema <b>morbiliforme<\/b> que começa <b>retroauricular / linha do cabelo<\/b> e desce (craniocaudal), no <b>auge<\/b> dos sintomas. <br>Complicações: <b>otite média<\/b> = bacteriana mais comum; <b>pneumonia<\/b> = principal causa de morte; encefalite, PEES (tardia). <br>Conduta: <b>vitamina A<\/b>, isolamento de aerossóis, <b>notificação compulsória<\/b>.", "fala": "Sarampo começa com tosse, coriza e conjuntivite e uma febre que vai subindo. Aí aparecem as manchas de Koplik na bochecha por dentro, que são patognomônicas, e o exantema nasce atrás da orelha, na linha do cabelo, e desce pelo corpo, justamente no pior momento da doença. A otite é a complicação bacteriana mais comum, a pneumonia é o que mais mata, e todo caso leva vitamina A e notificação.", "div": "saramp_iso", "pega": "No sarampo o exantema aparece no <b>auge<\/b> (febre alta), não quando melhora — quem aparece quando a febre <b>cai<\/b> é o exantema súbito.", "z": "Três C e uma mancha branca na bochecha: é sarampo, e não é frescura de antivacina, é pneumonia matando criança. Vitamina A e notificação, caralho.", "m": [["MEDCURSO · S41 B01 17:53", "Notificação compulsória e imediata (o próprio cursinho se contradiz mais adiante; a apostila diz só “compulsória”)."]], "ills": ["e_saramp"], "cap": 2, "ord": 2, "slides": [], "hot": ["qa_saramp"], "g": []}, {"id": "e_sarprof", "t": "Sarampo: profilaxia pós-exposição", "s": "<b>Vacina de bloqueio<\/b>: a partir de <b>6 meses<\/b>, até <b>72 h<\/b> do contato. Entre 6 e 11 meses é <b>dose zero<\/b> (não vale para a rotina). <br><b>Imunoglobulina<\/b>: até <b>6 dias<\/b> do contato — slide 28: <b>&lt; 1 ano<\/b>; MEDCURSO: <b>&lt; 6 meses<\/b>; também gestante suscetível e imunodeprimido.", "fala": "Depois do contato com sarampo há duas armas e dois relógios. A vacina de bloqueio pode ser dada a partir dos seis meses de idade, até setenta e duas horas do contato; entre seis e onze meses ela é uma dose extra, que não conta para o calendário. A imunoglobulina vai até seis dias do contato, para quem não pode receber a vacina: gestante, imunodeprimido e o lactente pequeno.", "div": "saramp_ig", "pega": "Prazos: <b>vacina 72 h<\/b> · <b>imunoglobulina 6 dias<\/b>. Dose entre 6–11 meses <b>não vale<\/b> para a rotina.", "z": "Setenta e duas horas pra vacina, seis dias pra imunoglobulina. Errou o relógio, a creche inteira vira surto, porra.", "m": [["MEDCURSO · S41 B01 28:58–32:16", "Bloqueio a partir de 6 meses até 72 h; imunoglobulina para &lt; 6 meses até 6 dias."], ["MEDCURSO · S41 B01 33:35–34:53", "Dose entre 6 e 11 meses não é válida para a rotina."]], "ills": ["e_sarprof"], "cap": 2, "ord": 3, "slides": [], "hot": ["q02_2"], "g": []}, {"id": "e_rub", "t": "Rubéola: o sarampinho com gânglio atrás da orelha", "s": "Exantema róseo, craniocaudal, mais leve que o do sarampo; <b>adenomegalia retroauricular, occipital<\/b> e cervical posterior; artralgia no adolescente. Benigna na criança. <br><b>Rubéola congênita<\/b>: <b>catarata, surdez e cardiopatia (PCA)<\/b>. <br>Vacina (vírus vivo) <b>contraindicada na gestação<\/b>; evitar engravidar por <b>30 dias<\/b> após.", "fala": "Rubéola é um sarampo mais brando, com exantema róseo que também desce da cabeça para o corpo, mas com uma pista própria: gânglios atrás da orelha e na nuca. Na criança é benigna; o drama é a rubéola congênita, com a tríade catarata, surdez e cardiopatia, sobretudo persistência do canal arterial. Por isso a vacina, que é de vírus vivo, não se dá na gestante, e a mulher espera trinta dias para engravidar.", "pega": "Rubéola = adenomegalia <b>retroauricular e occipital<\/b>. Congênita: <b>catarata + surdez + PCA<\/b>.", "z": "Gânglio atrás da orelha e na nuca com exantema leve: rubéola. Benigna pra criança, desgraça pro feto. Gestante longe, caralho.", "m": [["MEDCURSO · S41 B01", "Acrescenta a adenomegalia <b>occipital<\/b> (definição do Ministério da Saúde); o slide 32 cita só a retroauricular."]], "ills": ["e_rub"], "cap": 2, "ord": 4, "slides": [], "hot": [], "g": []}, {"id": "e_escarl", "t": "Escarlatina: lixa, Filatov, Pastia e framboesa", "s": "<b>Estreptococo beta-hemolítico do grupo A<\/b> (toxina eritrogênica), 5–12 anos. Febre + <b>faringoamigdalite<\/b> + exantema <b>micropapular áspero (em lixa)<\/b> que começa no tronco. <br>Sinais: <b>Filatov<\/b> (palidez perioral), <b>Pastia<\/b> (linhas petequiais nas dobras/antebraços), <b>língua em framboesa<\/b>; descamação lamelar de mãos e pés depois. <br>Tratamento: <b>penicilina benzatina IM dose única<\/b> — <b>600.000 UI se &lt; 25 kg<\/b> · <b>1.200.000 UI se &gt; 25 kg<\/b> — ou <b>amoxicilina VO 10 dias<\/b> (penicilina V, macrolídeo; azitromicina 5 dias). <br>Afastar da escola até <b>24–48 h<\/b> de antibiótico eficaz. Complicações: supurativas (abscesso periamigdaliano, otite) e não supurativas (<b>febre reumática, GNPE<\/b>).", "fala": "Escarlatina é a faringite do estreptococo do grupo A com um exantema áspero, que parece lixa ao passar a mão, começando no tronco. Os sinais de prova são três: palidez em volta da boca, que é o sinal de Filatov; linhas petequiais nas dobras, que é o sinal de Pastia; e a língua em framboesa. Trata com penicilina benzatina em dose única, seiscentas mil unidades abaixo de vinte e cinco quilos e um milhão e duzentas acima, ou amoxicilina por dez dias.", "div": "escarl_gab", "pega": "Corte de peso da benzatina: <b>25 kg<\/b>. Exantema após amoxicilina com Filatov/Pastia/framboesa continua sendo <b>escarlatina<\/b>, não alergia nem mono.", "z": "Pele de lixa, boca pálida e língua de framboesa: é o estreptococo fazendo cosplay de sobremesa. Benzatina, e vinte e cinco quilos é o corte, porra.", "ills": ["e_escarl"], "cap": 2, "ord": 5, "slides": [], "hot": ["q02_4"], "g": [], "m": []}, {"id": "e_var", "t": "Varicela: polimorfismo e o que não dar", "s": "Vírus varicela-zóster. Vesículas <b>pruriginosas<\/b>, de distribuição <b>centrípeta<\/b>, com <b>polimorfismo regional<\/b> (mácula, pápula, vesícula e crosta ao mesmo tempo), couro cabeludo e mucosas. <br>Contágio de 1–2 dias antes até <b>todas as lesões em crosta<\/b>. <br><b>Sem salicilato<\/b> (síndrome de Reye). Complicação mais comum: infecção bacteriana da pele.", "fala": "Varicela é vesícula que coça, concentrada no tronco, e com lesões em todas as fases ao mesmo tempo: mácula, pápula, vesícula e crosta lado a lado. Esse polimorfismo é a assinatura dela. A criança transmite de um a dois dias antes até todas as lesões virarem crosta, e é proibido dar ácido acetilsalicílico, pelo risco de síndrome de Reye. A complicação mais comum é a infecção bacteriana das lesões.", "pega": "Fim do contágio = <b>todas as lesões em crosta<\/b>. Antitérmico: <b>nunca AAS<\/b> (Reye).", "z": "Na varicela a pele vira um álbum de fases: mácula, pápula, vesícula e crosta juntas. E se alguém der aspirina, ganha um Reye de brinde, caralho.", "ills": ["e_var"], "cap": 2, "ord": 6, "slides": [], "hot": [], "g": [], "m": []}, {"id": "e_varprof", "t": "Varicela: bloqueio vacinal e quem recebe VZIG", "s": "<b>Vacina de bloqueio<\/b>: a partir de <b>9 meses<\/b>, até <b>72–96 h<\/b> do contato (slide 66; MEDCURSO: até 5 dias). <br><b>VZIG até 96 h<\/b> para: <b>gestante<\/b> suscetível · <b>imunodeprimido<\/b> · <b>RN de mãe com varicela de 5 dias antes a 2 dias depois do parto<\/b> · <b>prematuro ≥ 28 sem<\/b> se a mãe <b>não<\/b> teve varicela · <b>prematuro &lt; 28 sem ou &lt; 1.000 g<\/b>, sempre.", "fala": "Na exposição à varicela, quem tem nove meses ou mais pode receber vacina de bloqueio, em até setenta e duas a noventa e seis horas. A imunoglobulina vai até noventa e seis horas para gestante suscetível, imunodeprimido, recém-nascido de mãe que teve varicela entre cinco dias antes e dois dias depois do parto, e prematuros: os muito pequenos sempre, e os de vinte e oito semanas ou mais só se a mãe nunca teve varicela.", "div": "var_bloq", "pega": "Prematuro <b>≥ 28 sem<\/b> com mãe que <b>já teve<\/b> varicela recebeu anticorpo pela placenta → <b>observar<\/b>. &lt; 28 sem ou &lt; 1.000 g → VZIG <b>sempre<\/b>.", "z": "Mãe pegou varicela dois dias antes do parto? Esse bebê nasceu sem anticorpo e com vírus: imunoglobulina, sem discussão, porra.", "m": [["MEDCURSO · S41 B03 29:59–31:19", "Prematuro ≥ 28 semanas de mãe imune recebeu anticorpos transplacentários — por isso só recebe VZIG se a mãe não tem história."]], "ills": ["e_varprof"], "cap": 2, "ord": 7, "slides": [], "hot": ["q02_3"], "g": []}, {"id": "e_b19", "t": "Eritema infeccioso (parvovírus B19)", "s": "<b>Face esbofeteada<\/b> → depois exantema <b>rendilhado<\/b> em membros, que vai e volta (calor, sol). <br>Quando o exantema aparece, a criança <b>já não transmite<\/b>. <br>B19 infecta o precursor eritroide: em <b>hemoglobinopatas (falciforme)<\/b> → <b>crise aplásica transitória<\/b> com <b>reticulocitopenia<\/b> (nessa fase é contagioso → isolar de outras falcêmicas; transfundir se grave). Gestante: hidropsia fetal.", "fala": "O eritema infeccioso é o do parvovírus B dezenove: bochechas vermelhas, como se a criança tivesse levado um tapa, e depois um exantema rendilhado nos membros que some e volta com calor. Quando a pele mostra o exantema, a criança já não transmite mais. O perigo está na anemia falciforme: o vírus para a medula vermelha e causa crise aplásica, com hemoglobina despencando e reticulócitos quase zerados.", "pega": "Crise aplásica = anemia com <b>reticulocitopenia<\/b> (sequestro e hemólise têm reticulocitose). Com exantema, <b>não<\/b> é mais contagioso.", "z": "Bochecha de quem levou um tapa e rendado nos braços: parvovírus. Na falcêmica ele desliga a fábrica de hemácia, e aí é transfusão, caralho.", "m": [["MEDCURSO · S41 B02 21:44–24:46", "B19 interrompe a eritropoiese: anemia com reticulocitopenia; na crise aplásica a criança é contagiosa."]], "div": "b19_inc", "ills": ["e_b19"], "cap": 2, "ord": 8, "slides": [], "hot": ["q02_5"], "g": []}, {"id": "e_subito", "t": "Exantema súbito (roséola, HHV-6)", "s": "Lactente de <b>6 meses a 2 anos<\/b>: <b>febre alta por 3–4 dias<\/b> com bom estado geral → a febre <b>cai em crise<\/b> e surge exantema róseo maculopapular no <b>tronco<\/b>, que vai ao pescoço e some em 1–2 dias. <br>Complicação: <b>convulsão febril<\/b>. Tratamento sintomático. Se houver antibiótico mal indicado, <b>suspender<\/b> (não é alergia).", "fala": "Exantema súbito é o lactente com febre alta por três ou quatro dias, mas brincando entre os picos. Quando a febre desaparece de repente, nasce um exantema róseo no tronco que sobe para o pescoço e some em um ou dois dias. É o herpes vírus seis. Se alguém começou amoxicilina no meio do caminho, a coincidência engana: não é alergia, suspende o antibiótico e observa.", "div": "subito_rot", "pega": "Exantema que surge <b>quando a febre some<\/b> = exantema súbito. No sarampo, surge no <b>pico<\/b> da febre.", "z": "Três dias de febre, aí a febre vai embora e a mancha chega: roséola. Não é alergia à amoxicilina, é o antibiótico que não precisava, porra.", "m": [["MEDCURSO · S41 B02 25:59–28:39", "Se a indicação do antibiótico estava errada, suspende-se — a coincidência temporal é da doença."]], "ills": ["e_subito"], "cap": 2, "ord": 9, "slides": [], "hot": ["q02_1"], "g": []}, {"id": "e_mono", "t": "Mononucleose infecciosa (EBV)", "s": "Adolescente: <b>tríade febre + faringite + linfadenopatia<\/b> (generalizada, cervical posterior), <b>esplenomegalia<\/b>, hepatomegalia, <b>edema palpebral<\/b> (Hoagland), fadiga arrastada. <br>Hemograma: <b>linfocitose com linfócitos atípicos<\/b>. Exantema típico <b>após amoxicilina/ampicilina<\/b>. <br>Conduta: sintomáticos; <b>evitar esporte de contato<\/b> (ruptura esplênica).", "fala": "Mononucleose é o adolescente com febre, dor de garganta e gânglios em vários lugares, muitas vezes com baço grande e pálpebras inchadas. O hemograma mostra linfocitose com linfócitos atípicos. A pegadinha clássica é o exantema que aparece depois de tomar amoxicilina por conta própria. O tratamento é de suporte, e ele fica longe de esporte de contato, para não romper o baço.", "div": "mono_inc", "pega": "Mono: adenomegalia <b>generalizada<\/b> + esplenomegalia + linfócitos <b>atípicos<\/b>; não tem Filatov, Pastia nem framboesa.", "z": "Adolescente tomou amoxicilina por conta e ficou todo vermelho? Não é alergia, é o Epstein-Barr rindo da automedicação. E nada de futebol com baço gigante, caralho.", "m": [["MEDCURSO · S41 B04", "Incubação de 30 a 50 dias; exantema em ~10%, a maioria após amoxicilina."]], "ills": ["e_mono"], "cap": 2, "ord": 10, "slides": [], "hot": ["qa_mono"], "g": []}, {"id": "e_mpb", "t": "Doença mão-pé-boca (Coxsackie A16)", "s": "Coxsackie <b>A16<\/b> (enterovírus): febre baixa, <b>úlceras dolorosas em toda a boca<\/b>, <b>vesículas em mãos, pés<\/b> (e glúteos). Benigna, autolimitada; cuidado com a recusa alimentar e a hidratação.", "fala": "Mão-pé-boca é o enterovírus Coxsackie A dezesseis. A criança tem febre baixa, aftas dolorosas espalhadas pela boca e vesículas nas palmas, nas plantas e às vezes nos glúteos. É benigna e passa sozinha; o cuidado é com a dor ao engolir, que leva a recusa alimentar e desidratação.", "pega": "Úlceras <b>em toda a boca<\/b> + vesículas em <b>palmas e plantas<\/b> = mão-pé-boca (herpangina fica no palato posterior).", "z": "Bolha na mão, no pé e afta na boca toda: Coxsackie. O risco não é a bolha, é a criança parar de beber água de tanta dor, porra.", "ills": ["e_mpb"], "cap": 2, "ord": 11, "slides": [], "hot": [], "g": [], "m": []}, {"id": "e_kawa", "t": "Doença de Kawasaki: critérios e tratamento até o 10º dia", "s": "Vasculite de médios vasos, <b>&lt; 5 anos<\/b>. <b>Febre ≥ 5 dias<\/b> + <b>4 de 5<\/b>: <b>conjuntivite<\/b> bilateral não exsudativa · <b>lábios/boca<\/b> (eritema, fissuras, framboesa) · <b>extremidades<\/b> (edema, eritema, depois descamação) · <b>exantema polimorfo<\/b> · <b>adenomegalia cervical<\/b> &gt; 1,5 cm. <br>Tratamento: <b>imunoglobulina EV 2 g/kg em 10 h<\/b>, idealmente <b>até o 10º dia<\/b> + <b>AAS 80–100 mg/kg/dia<\/b> até afebril → <b>3–5 mg/kg/dia por 6–8 semanas<\/b>. <br>Aneurisma coronariano: sem tratamento <b>20–30%<\/b>; tratado <b>4–5%<\/b>.", "fala": "Kawasaki é uma vasculite da criança pequena: febre por cinco dias ou mais, com quatro de cinco critérios, que são conjuntivite sem secreção, lábios e boca vermelhos e fissurados, mãos e pés inchados que depois descamam, exantema polimorfo e um gânglio cervical grande. O tratamento é imunoglobulina venosa, dois gramas por quilo, de preferência até o décimo dia, junto com ácido acetilsalicílico, e é isso que derruba o risco de aneurisma coronariano.", "div": "kawa_aneu", "pega": "Kawasaki <b>não tem exsudato<\/b> amigdaliano e exige <b>febre ≥ 5 dias<\/b>. Prognóstico: <b>bom se tratado<\/b> até o 10º dia — não escreva “ruim”.", "z": "Cinco dias de febre, olho vermelho sem remela, boca de morango e mão inchada: é Kawasaki, e o coração da criança depende da sua imunoglobulina até o décimo dia, porra.", "m": [["MEDCURSO · S41 B04 24:38–25:51", "Kawasaki × escarlatina: Kawasaki exige febre ≥ 5 dias e conjuntivite, sem exsudato; adenomegalia &gt; 1,5 cm."]], "ills": ["e_kawa"], "cap": 2, "ord": 12, "slides": [], "hot": ["q02_4"], "g": []}, {"id": "c_geral", "t": "Dor recorrente: definição e abordagem", "s": "<b>Dor recorrente<\/b> = <b>≥ 3 episódios<\/b> em <b>≥ 3 meses<\/b>, com intensidade que <b>interfere nas atividades<\/b> habituais. <br>Prevalências: <b>cefaleia 20,6%<\/b> · membros 15,5% · abdominal 14,4%. Orgânicas: <b>10–15%<\/b>. <br>Abordagem: anamnese detalhada, <b>entrevistar criança e pais separadamente<\/b>, estressores (escola, família), diário da dor, exame físico completo com curva de crescimento. <br>Os dois erros (slide 10): atitude simplista (“<b>não é nada<\/b>”) × <b>investigação extensa<\/b> desnecessária.", "fala": "Dor recorrente tem definição de prova: pelo menos três episódios num período de pelo menos três meses, com intensidade que atrapalha a vida da criança. A cefaleia é a mais frequente, depois membros e abdome, e só dez a quinze por cento têm causa orgânica. A abordagem é escutar a criança e os pais separadamente, procurar estressores e examinar com a curva de crescimento na mão, sem dizer que não é nada e sem pedir exame de tudo.", "div": "organ", "pega": "Critério: <b>3 episódios / 3 meses / interfere nas atividades<\/b>. Os dois erros: “não é nada” e investigação extensa.", "z": "Dizer “não é nada” pra mãe é o jeito mais rápido de ela trocar de pediatra; pedir tomografia de tudo é o jeito mais rápido de irradiar uma criança à toa. O meio-termo é anamnese, porra.", "ills": ["c_geral"], "cap": 3, "ord": 1, "slides": [], "hot": ["q03_1"], "g": [], "m": []}, {"id": "c_abd", "t": "Dor abdominal recorrente: a maioria é funcional", "s": "Picos: <b>4–6<\/b> e <b>7–12 anos<\/b>. <b>90–95% funcional<\/b>: dispepsia funcional, síndrome do intestino irritável, enxaqueca abdominal, dor abdominal funcional não especificada. <br>Dor periumbilical, sem relação clara com alimentação, criança bem entre as crises, crescimento no canal. <br>Conduta sem alarme: <b>abordagem ambulatorial<\/b>, explicar o mecanismo, orientar os pais sobre <b>sinais de alerta<\/b> e acompanhar; antiparasitário “(?)” no slide. Remissão em ~30% em 6 meses.", "fala": "Na dor abdominal recorrente, noventa a noventa e cinco por cento é funcional: dispepsia funcional, intestino irritável, enxaqueca abdominal ou a dor funcional não especificada. É a dor em volta do umbigo, numa criança que cresce bem e fica ótima entre as crises. Sem sinal de alarme, a conduta é ambulatorial: explicar que a dor é real, orientar os pais sobre os sinais de alerta e acompanhar.", "pega": "Sem sinal de alarme → <b>abordagem ambulatorial<\/b> e orientação; seis parasitológicos negativos não pedem o sétimo.", "z": "Seis parasitológicos negativos e a mãe querendo o sétimo? O verme não está no cocô, está na ansiedade da casa. Conversa, orienta e acompanha, caralho.", "ills": ["c_abd"], "cap": 3, "ord": 2, "slides": [], "hot": ["q03_1"], "g": [], "m": []}, {"id": "c_abdal", "t": "Dor abdominal: sinais de alerta e exames de nível 1", "s": "<b>Sinais de alerta<\/b> (gabarito 2025/2 em negrito): <b>dor que desperta a criança<\/b> · <b>localização periférica<\/b> (longe do umbigo) · <b>irradiação<\/b> (costas, escápula, membros) · <b>perda de peso / desaceleração do crescimento<\/b> · febre recorrente · <b>vômitos biliosos<\/b> · disfagia, diarreia noturna · <b>sangramento<\/b> GI · visceromegalia/massa · <b>história familiar<\/b> (DII, celíaca, úlcera péptica) · laboratório alterado. <br>Exames de <b>nível 1<\/b>: hemograma, VHS/PCR, urina e urocultura, parasitológico.", "fala": "O que transforma dor funcional em suspeita orgânica são os sinais de alerta. Os três do gabarito oficial são dor que acorda a criança, dor longe do umbigo e dor que irradia para costas, escápula ou pernas. Some a isso perda de peso ou desaceleração do crescimento, vômito bilioso, sangramento, febre, massa e história familiar de doença inflamatória, celíaca ou úlcera. Com alerta, começa pelos exames de nível um: hemograma, provas inflamatórias, urina e parasitológico.", "pega": "Peso é o parâmetro <b>mais sensível<\/b>: <b>queda na curva<\/b> é alerta. História familiar que pesa é de doença <b>orgânica GI<\/b>, não de cefaleia tensional da mãe.", "z": "Dor que acorda a criança, longe do umbigo e que corre pras costas: aí sim tem coisa. O resto é barriga de prova de matemática, porra.", "m": [["MEDCURSO · S26 Aval. 10:52–11:10", "O peso é o parâmetro mais sensível a doença: desacelerar na curva é sinal precoce."]], "ills": ["c_abdal"], "cap": 3, "ord": 3, "slides": [], "hot": ["q03_2"], "g": []}, {"id": "c_cresc", "t": "Dor em membros e a dor de crescimento", "s": "Dor recorrente em membros: <b>4–10 anos<\/b>; orgânica em só <b>3–4%<\/b>. <br><b>Dor de crescimento<\/b> (<b>6–13 anos<\/b>): dor <b>bilateral<\/b> em MMII (coxa anterior, poplítea, panturrilha), difusa, crises de 10–15 min no <b>fim da tarde/noite<\/b> (pode acordar), criança ativa de dia, <b>exame físico normal<\/b>, melhora com <b>calor, massagem, analgésico<\/b>. Prognóstico benigno. <br>Diferenciais: hipermobilidade articular, fibromialgia (adolescente, tender points, sono/humor).", "fala": "Dor de crescimento é diagnóstico clínico de uma criança entre seis e treze anos com dor nas duas pernas, na coxa, atrás do joelho e na panturrilha, no fim da tarde ou à noite, que passa em poucos minutos com massagem ou calor. De dia ela brinca normalmente e o exame físico é normal. Os três pilares de prova são bilateral, noturna e exame normal; aí é explicar que é benigno e orientar os sinais de alerta.", "div": "desperta", "pega": "Dor de crescimento é <b>bilateral<\/b> e com <b>exame normal<\/b>; unilateral, em ponto fixo ou com limitação = <b>investigar<\/b>.", "z": "Dor nas duas pernas à noite, passa com massagem e a criança joga bola de dia: é dor de crescimento. Não precisa cintilografia, precisa de uma mãe com mão boa, caralho.", "ills": ["c_cresc"], "cap": 3, "ord": 4, "slides": [], "hot": ["q03_3"], "g": [], "m": []}, {"id": "c_membal", "t": "Membros: sinais de alerta, tumor ósseo × leucemia", "s": "Alertas: dor em <b>ponto fixo<\/b>, <b>unilateral<\/b>, alteração de <b>força ou marcha<\/b>, edema/calor articular, <b>sintomas sistêmicos<\/b> (febre, perda de peso, palidez), <b>sem resposta a analgésico<\/b>, dor progressiva. <br>Exames iniciais: hemograma, VHS/PCR, RX. <br><b>Tumor ósseo<\/b> (osteossarcoma, Ewing): dor <b>localizada<\/b>, sem sinais sistêmicos → RX e <b>biópsia<\/b>. <br><b>Leucemia<\/b>: dor <b>não localizada<\/b> + sistêmicos (prostração, palidez, perda de peso, hepatoesplenomegalia, adenomegalia) → hemograma (blastos/citopenias) → mielograma (gabarito 2025/2).", "fala": "A dor de membros vira alerta quando é num ponto fixo, de um lado só, quando mexe com força ou marcha, quando vem com febre, emagrecimento ou palidez, ou quando não melhora com analgésico. E caiu a diferença entre os dois cânceres: o tumor ósseo dá dor localizada, sem sintomas gerais; a leucemia dá dor difusa, mal localizada, com a criança prostrada, pálida e perdendo peso.", "pega": "Gabarito 2025/2: tumor ósseo = dor <b>localizada<\/b> sem sistêmicos; leucemia = dor <b>não localizada<\/b> + sistêmicos.", "z": "Dor num ponto só, que não passa com dipirona: radiografia nesse osso, agora. Dor difusa com criança pálida e magra: hemograma, porque pode ser leucemia, porra.", "ills": ["c_membal"], "cap": 3, "ord": 5, "slides": [], "hot": [], "g": [], "m": []}, {"id": "c_cefal", "t": "Cefaleia: primária (migrânea × tensional)", "s": "Cefaleia recorrente: ~<b>20%<\/b>, mais em meninas. <b>Primárias<\/b>: <br>• <b>Migrânea<\/b>: 1–72 h, pulsátil, pode ser unilateral ou bilateral na criança, <b>náusea/vômito, foto e fonofobia<\/b>, piora com atividade, história familiar. <br>• <b>Tensional<\/b>: <b>em aperto, bilateral<\/b>, 30 min–7 dias, sem náusea importante, <b>melhora com o sono<\/b>. <br>Secundárias ~<b>5%<\/b> (HAS, sinusite, HIC). <b>Sempre<\/b>: medir <b>PA<\/b> e <b>exame neurológico completo<\/b> com fundo de olho (slide 42).", "fala": "Cefaleia recorrente atinge cerca de uma em cada cinco crianças. Entre as primárias, a migrânea dura de uma a setenta e duas horas, é pulsátil, vem com náusea, vômito e aversão a luz e som; a tensional é em aperto, dos dois lados, e melhora com o sono. Só cerca de cinco por cento são secundárias, mas o slide manda sempre duas coisas em toda criança com cefaleia: medir a pressão e fazer exame neurológico completo, com fundo de olho.", "pega": "Exame indispensável (caiu): <b>pressão arterial + exame neurológico com fundo de olho<\/b>. Seio frontal não existe em &lt; 5 anos (não é sinusite frontal).", "z": "Criança com cefaleia e ninguém mediu a pressão? Então ninguém examinou a criança. Manguito e oftalmoscópio, caralho.", "m": [["MEDCURSO · S33 02:42–03:05", "Em menor de 5 anos o seio frontal ainda não existe."]], "ills": ["c_cefal"], "cap": 3, "ord": 6, "slides": [], "hot": ["q03_4"], "g": []}, {"id": "c_cefal_al", "t": "Cefaleia: sinais de alarme (caiu 2×, 2,4 pts)", "s": "Sinais de alarme (slide 43): <b>alterações neurológicas<\/b> ou crises epilépticas · <b>alterações oculares<\/b> (edema de papila, anisocoria, nistagmo, estrabismo recente, diplopia, queda da acuidade) · <b>vômitos<\/b> persistentes/crescentes ou recentes · dor precipitada por <b>esforço, Valsalva ou mudança de postura<\/b> · <b>mudança de padrão<\/b> (frequência/intensidade crescentes) · <b>unilateral<\/b> fixa · <b>matinal<\/b> · <b>desperta a criança<\/b> · <b>desaceleração do crescimento<\/b> · <b>idade &lt; 5 anos<\/b>. <br>Vários alarmes, progressiva, matinal e noturna em &lt; 5 anos → <b>secundária<\/b> (HIC / processo expansivo) → neuroimagem.", "fala": "Os sinais de alarme da cefaleia são a questão mais pontuada desse capítulo. Decore: alteração neurológica ou convulsão, alteração ocular como edema de papila, estrabismo novo ou diplopia, vômitos que aumentam, dor que piora com esforço, tosse ou mudança de posição, mudança do padrão, dor sempre do mesmo lado, dor matinal, dor que acorda, crescimento que desacelera e idade abaixo de cinco anos. Com vários deles, é cefaleia secundária até prova em contrário.", "div": "unilat", "pega": "Na Camila (4 anos) os 4 alarmes do enunciado eram: <b>&lt; 5 anos<\/b>, <b>mudança de padrão<\/b>, <b>matinal<\/b>, <b>desperta<\/b>. Resposta: <b>secundária<\/b>.", "z": "Quatro anos, dor todo dia, pior de manhã e acordando de madrugada: isso não é enxaqueca, é cérebro pedindo ressonância. Secundária, porra.", "ills": ["c_cefal_al"], "cap": 3, "ord": 7, "slides": [], "hot": ["q03_4"], "g": [], "m": []}, {"id": "c_escala", "t": "Escalas de dor e diário", "s": "<b>Escala numérica 0–10<\/b> (com faces associadas) para crianças maiores; <b>escala de faces<\/b> para os pequenos. Usar junto com o <b>diário da dor<\/b> (frequência, duração, desencadeantes, o que alivia, faltas escolares).", "fala": "Para medir dor em criança, a aula traz a escala numérica de zero a dez, combinada com desenhos de faces, e a escala de faces sozinha para os menores, que ainda não entendem números. Ela rende mais quando vem junto com um diário da dor, onde a família anota frequência, duração, gatilhos, o que aliviou e quantas aulas a criança perdeu.", "pega": "Criança pequena → <b>escala de faces<\/b>; maior → <b>numérica 0–10<\/b>; sempre com <b>diário da dor<\/b>.", "z": "Perguntar “de zero a dez” pra criança de três anos dá sempre dez ou banana. Usa a escala de faces, caralho.", "ills": ["c_escala"], "cap": 3, "ord": 8, "slides": [], "hot": [], "g": [], "m": []}, {"id": "a_base", "t": "Linfonodo normal da criança", "s": "Linfonodo captura antígenos da região que drena. O <b>tecido linfoide cresce até a puberdade<\/b> (supera o do adulto); gânglios cervicais e inguinais pequenos são comuns. <b>Sombra tímica<\/b> no RX até <b>3 anos<\/b>. <br><b>Hiperplasia reacional<\/b> = maior causa de adenomegalia. <br><b>Generalizada<\/b> = mais de duas cadeias <b>não contíguas<\/b> (slide 11).", "fala": "Criança tem mais tecido linfoide que adulto, então gânglio palpável pequeno no pescoço ou na virilha é comum, e a causa mais frequente de aumento é a hiperplasia reacional a uma infecção da região drenada. No raio-x de tórax, a sombra do timo é normal até os três anos. E a definição de generalizada da aula é aumento em mais de duas cadeias que não são vizinhas.", "pega": "Sombra tímica é normal <b>até 3 anos<\/b>; mediastino alargado num adolescente <b>não<\/b> é timo.", "z": "Gânglio de ervilha no pescoço de pré-escolar é a imunidade trabalhando, não é linfoma. Calma, porra.", "ills": ["a_base"], "cap": 4, "ord": 1, "slides": [], "hot": [], "g": [], "m": []}, {"id": "a_aval", "t": "Critérios de suspeição (slide 12, em vermelho)", "s": "Benigno se &lt; 2 semanas. <b>Suspeitar / biopsiar<\/b>: duração ~<b>4 semanas<\/b> sem regressão · <b>supraclavicular<\/b> (também cervical inferior e epitroclear) · <b>&gt; 2–3 cm<\/b> · <b>aumento progressivo<\/b> · <b>endurecido e fixo<\/b> · sintomas sistêmicos (febre, perda de peso, sudorese) · idade maior (malignidade ↑ com a idade). <br>Causas: <b>75% infecciosas<\/b>, 20% embrionárias/outras, <b>5% neoplasias<\/b>.", "fala": "O slide em vermelho da aula traz os critérios que fazem pensar em doença séria: gânglio que não regride em cerca de quatro semanas, localização supraclavicular, tamanho maior que dois a três centímetros, crescimento progressivo e consistência endurecida e fixa, além de febre, perda de peso ou sudorese. Mesmo assim, três quartos das adenomegalias da criança são infecciosas e só cinco por cento são neoplasias.", "div": "aden_corte", "pega": "Supraclavicular <b>nunca<\/b> é “só reacional”. Tempo de biópsia: ~<b>4 semanas<\/b> sem regressão.", "z": "Gânglio supraclavicular, duro, grudado e crescendo há um mês: não é íngua, é biópsia, porra.", "ills": ["a_aval"], "cap": 4, "ord": 2, "slides": [], "hot": [], "g": [], "m": []}, {"id": "a_etio", "t": "Agudo × crônico, uni × bilateral: o agente provável", "s": "<b>Aguda bilateral<\/b> → <b>viroses<\/b> respiratórias. <b>Aguda unilateral<\/b> → <b><i>S. aureus<\/i> / estreptococo do grupo A<\/b> (adenite piogênica). <br><b>Crônica unilateral<\/b> → <b>micobactéria atípica<\/b>, <b>arranhadura do gato<\/b> (<i>Bartonella henselae<\/i>). <b>Crônica bilateral<\/b> → <b>EBV, CMV<\/b>, toxoplasmose. <br>Aguda &lt; 2 semanas; subaguda 2–6; crônica &gt; 6.", "fala": "Um jeito rápido de pensar no agente é cruzar tempo e lado. Gânglio agudo dos dois lados é virose respiratória. Agudo de um lado só, quente e doloroso, é adenite por estafilococo ou estreptococo. Crônico de um lado só lembra micobactéria atípica e doença da arranhadura do gato. Crônico dos dois lados lembra Epstein-Barr, citomegalovírus e toxoplasmose.", "pega": "Aguda <b>unilateral<\/b> inflamada = <b>S. aureus/estrepto<\/b>; crônica unilateral sem flogose = <b>micobactéria atípica / gato<\/b>.", "z": "Gânglio de um lado, crônico, e um gato novo em casa? Pergunta do gato antes de pedir biópsia, caralho.", "ills": ["a_etio"], "cap": 4, "ord": 3, "slides": [], "hot": [], "g": [], "m": []}, {"id": "a_infl", "t": "Inflamatório × neoplásico e a regra da supraclavicular", "s": "<b>Inflamatório<\/b>: <b>doloroso<\/b>, pele quente/hiperemiada, <b>flutuação<\/b>, fístula. <br><b>Neoplásico<\/b>: <b>duro, aderido, indolor<\/b>, confluente (pacote), <b>supraclavicular<\/b>, ≥ 2,5 cm. <br><b>Supraclavicular direita → tórax<\/b> (mediastino, pulmão) · <b>esquerda → abdome<\/b> (sinal de Virchow).", "fala": "À palpação, gânglio inflamatório dói, tem pele quente e vermelha e pode flutuar ou fistulizar. Gânglio neoplásico é duro, aderido aos planos, indolor e costuma formar pacotes. E a regra de prova da supraclavicular: a direita drena o tórax, então pense em lesão intratorácica; a esquerda drena o abdome, então pense em tumor ou processo inflamatório abdominal.", "pega": "Supraclavicular <b>D = tórax<\/b>; <b>E = abdome<\/b>. Duro, aderido e indolor = neoplásico até prova em contrário.", "z": "Direita olha pro peito, esquerda olha pra barriga. Trocou os lados na prova, perdeu ponto e ainda pediu o exame errado, porra.", "ills": ["a_infl"], "cap": 4, "ord": 4, "slides": [], "hot": ["q04_3"], "g": [], "m": []}, {"id": "a_adenite", "t": "Adenite aguda localizada: conduta e doses (slide 29)", "s": "Localizada, <b>sem sinais de gravidade<\/b>, inflamatória, cervical superior/submandibular, geralmente com porta de entrada (piodermite, dente, orofaringe) → <b>hemograma, VHS, PCR<\/b>. <br>Antibiótico <b>oral por 10 dias<\/b> cobrindo <i>S. aureus<\/i> e estrepto: <b>cefalexina 25–50 mg/kg/dia 6/6 h<\/b> · cefuroxima 20–30 mg/kg/dia 12/12 h · azitromicina 10 mg/kg no 1º dia → 5 mg/kg/dia por mais 4 dias · <b>clindamicina 10–20 mg/kg/dia<\/b> (6/6 ou 8/8 h) se MRSA/anaeróbio. <br><b>Reavaliar em 24–48 h<\/b>; <b>flutuação → punção aspirativa/drenagem<\/b>; sem resposta ou persistência &gt; 4 semanas → <b>biópsia<\/b>.", "fala": "Gânglio único, submandibular, doloroso, quente e com o centro flutuante numa criança em bom estado é adenite piogênica. Pede hemograma e provas inflamatórias e trata por via oral por dez dias, cobrindo estafilococo e estreptococo; a droga da aula é a cefalexina, vinte e cinco a cinquenta miligramas por quilo por dia, de seis em seis horas. Reavalia em vinte e quatro a quarenta e oito horas; se flutuar, punciona ou drena; se não melhorar, biópsia.", "div": "azitro", "pega": "Tamanho isolado não indica biópsia num gânglio <b>agudo inflamado<\/b>: primeiro <b>antibiótico 10 dias<\/b>; flutuação → <b>drenagem<\/b>; sem resposta → biópsia.", "z": "Gânglio quente, vermelho e flutuando é pus pedindo saída. Cefalexina, reavalia em quarenta e oito horas e, se flutuar, drena essa porra.", "ills": ["a_adenite"], "cap": 4, "ord": 5, "slides": [], "hot": ["q04_1"], "g": [], "m": []}, {"id": "a_grav", "t": "Adenomegalia com gravidade ou generalizada: os fluxos", "s": "<b>Localizada com sinais de gravidade<\/b> ou <b>generalizada com estado geral comprometido<\/b> → <b>hemograma, VHS/PCR, RX de tórax<\/b>: <br>• <b>blastos / pancitopenia<\/b> → <b>mielograma<\/b> (leucemia); <br>• <b>mediastino alargado<\/b> → TB, linfoma, sarcoidose, outros → PPD/TC → <b>biópsia<\/b>; <br>• <b>exames normais<\/b> → <b>biópsia<\/b> do gânglio mais significativo mesmo assim. <br><b>Generalizada em bom estado<\/b> → sorologias <b>EBV, CMV, toxoplasmose<\/b> (HIV conforme risco) + RX.", "fala": "Quando a adenomegalia vem com sinais de gravidade, ou é generalizada numa criança doente, o caminho é hemograma, provas inflamatórias e raio-x de tórax. Blastos ou pancitopenia levam ao mielograma, porque é leucemia até prova em contrário. Mediastino alargado leva à investigação de tuberculose, linfoma e outros tumores, com biópsia. E se tudo vier normal, biopsia o gânglio mais significativo assim mesmo. Generalizada em criança bem começa por sorologias.", "pega": "Generalizada + palidez + petéquias + visceromegalia: o próximo passo é <b>hemograma<\/b> (→ mielograma), não biópsia do gânglio.", "z": "Criança pálida, cheia de petéquia, com fígado e baço grandes e gânglio em todo lugar: não é virose, é medula gritando. Hemograma agora e mielograma depois, caralho.", "ills": ["a_grav"], "cap": 4, "ord": 6, "slides": [], "hot": ["q04_2"], "g": [], "m": []}, {"id": "a_bcg", "t": "Linfonodo pós-BCG", "s": "Linfonodo <b>axilar direito<\/b> (drenagem do deltoide direito vacinado). <br>Slide 32 (aula): <b>notificar + isoniazida<\/b>, com ou sem sinais flogísticos. <br>MEDCURSO/protocolo: gânglio &lt; 3 cm é evolução esperada (~10%); &gt; 3 cm <b>não supurado<\/b> → acompanhar; <b>supurado<\/b> → isoniazida; <b>não puncionar<\/b> gânglio supurado pós-BCG.", "fala": "O gânglio da axila direita depois da BCG é a drenagem do deltoide direito, onde a vacina foi aplicada. A aula da faculdade é simples: notificar e dar isoniazida, com ou sem sinais inflamatórios. O protocolo, ensinado no cursinho, é mais conservador: gânglio pequeno é evolução esperada, o grande sem supuração só se acompanha, e a isoniazida fica para o supurado, que não se punciona.", "div": "bcg", "pega": "Prova da faculdade: <b>notificar + isoniazida<\/b> (slide 32). Nunca punção do gânglio pós-BCG supurado.", "z": "Caroço na axila direita de bebê vacinado é a BCG dando oi, não é linfoma. Notifica e isoniazida, que é o que a Patrícia quer, porra.", "m": [["MEDCURSO · S27 03:38–09:58", "Isoniazida para linfadenopatia supurada; &lt; 3 cm é esperado em ~10%; &gt; 3 cm não supurado só se acompanha; não puncionar."]], "ills": ["a_bcg"], "cap": 4, "ord": 7, "slides": [], "hot": ["q04_4"], "g": []}, {"id": "a_cisto", "t": "Massas cervicais que não são gânglio", "s": "<b>Cisto do ducto tireoglosso<\/b>: <b>mediano<\/b>, sobe com a deglutição/protrusão da língua. <br><b>Cisto branquial<\/b>: <b>lateral<\/b>, borda anterior do esternocleidomastóideo. <br><b>Linfangioma / higroma cístico<\/b>: volumoso, mole, aparece cedo, aumenta com infecções. <br><b>Hemangioma<\/b>: vascular, avermelhado/arroxeado.", "fala": "Nem toda massa no pescoço é gânglio. Na linha média, que sobe quando a criança engole ou põe a língua para fora, é o cisto do ducto tireoglosso. Lateral, na borda do esternocleidomastóideo, é o cisto branquial. A massa grande, mole, que aparece cedo e cresce com infecções é o linfangioma, ou higroma cístico. E o hemangioma é a lesão vascular, avermelhada.", "pega": "Massa <b>mediana<\/b> que sobe com a língua = <b>tireoglosso<\/b>; <b>lateral<\/b> = branquial.", "z": "Caroço bem no meio do pescoço que sobe quando a criança mostra a língua? Tireoglosso. Não vai tratar com cefalexina, caralho.", "ills": ["a_cisto"], "cap": 4, "ord": 8, "slides": [], "hot": [], "g": [], "m": []}, {"id": "a_cancer", "t": "Câncer infantil: por que diagnosticar cedo", "s": "Não prevenível; <b>2–6%<\/b> dos cânceres; latência curta, crescimento rápido, sintomas vagos (imitam doenças comuns). <b>70–80% de cura<\/b> se diagnosticado cedo. Mensagem da aula: <b>não alarmar os pais, mas investigar precocemente<\/b>. <br>Alertas: palidez/pancitopenia, febre persistente, emagrecimento, hepatoesplenomegalia, gânglio duro/aderido/supraclavicular, mediastino alargado. <br><b>Campanha — 10 sinais<\/b>: dor óssea/abdominal, febre &gt; 1 semana, manchas roxas/sangramento, caroço, prurido sem lesão, cansaço/palidez, perda de peso, cefaleia matinal com vômitos, abdome que cresce, infecção que não melhora (+ leucocoria/estrabismo).", "fala": "O câncer da criança não se previne, mas se cura em setenta a oitenta por cento quando o diagnóstico é precoce. O problema é que ele cresce rápido e imita doença comum, com febre, palidez, dor e cansaço. A mensagem da professora é não alarmar a família, mas investigar cedo. Os sinais da campanha são dor óssea, febre por mais de uma semana, manchas roxas,
