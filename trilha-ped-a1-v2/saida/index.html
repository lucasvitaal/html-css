íngua com hipertrofia de papilas.<br><b>Caso 2:<\/b> 18 meses, febre &gt; 39 °C por 3 dias; no último dia de febre, discreto exantema róseo papular no dorso que sumiu em &lt; 24 h.<br><b>Caso 3:<\/b> 15 meses, febre persistente há mais de 5 dias; hiperemia conjuntival bilateral, edema de mãos e pés, eritema e fissuras labiais, exantema polimorfo.", "p": [{"p": "Hipótese de cada caso. (0,9)", "m": "1) <b>Escarlatina<\/b>. 2) <b>Exantema súbito (roséola, HHV-6)<\/b> — exantema quando a febre cai. 3) <b>Doença de Kawasaki<\/b>.", "c": ["escarlatina", "exantema súbito", "HHV-6", "Kawasaki"]}, {"p": "Prognóstico de cada um. (0,3)", "m": "Escarlatina: bom, mas pode complicar (abscesso periamigdaliano, otite; febre reumática, GNPE). Roséola: bom, autolimitada (atenção à convulsão febril). Kawasaki: <b>bom se tratado a tempo<\/b>; sem tratamento ~20–25% fazem aneurisma coronariano.", "c": ["febre reumática", "GNPE", "convulsão febril", "bom se tratado", "aneurisma coronariano"]}, {"p": "Tratamento de cada um. (0,3)", "m": "Escarlatina: penicilina benzatina dose única ou amoxicilina 10 dias. Roséola: sintomático (antitérmico). Kawasaki: <b>imunoglobulina EV 2 g/kg em 10 h<\/b> (até o 10º dia) + <b>AAS 80–100 mg/kg/dia<\/b> até afebril → <b>3–5 mg/kg/dia por 6–8 semanas<\/b>.", "c": ["benzatina", "amoxicilina", "sintomático", "imunoglobulina", "2 g/kg", "AAS", "10º dia"]}]}, {"id": "k_c_cef", "cap": 3, "blk": ["c_cefal_al", "c_cefal"], "t": "A cefaleia da Camila (caiu 2×, 2,4 pts)", "src": "Prova A1 (7 pts) · Q1 alta taxonomia — Profa. Patrícia", "enun": "Camila, 4 anos, cefaleia recorrente há mais de 2 meses. No início, ~2×/semana; agora <b>diária<\/b> e <b>principalmente pela manhã<\/b>. Em alguns dias <b>acorda no meio da noite<\/b> pela dor.", "p": [{"p": "Cite 4 dados do enunciado que são sinais de alarme. (0,8)", "m": "<b>Idade &lt; 5 anos<\/b> · <b>mudança de padrão<\/b> (aumento de frequência) · <b>cefaleia matinal<\/b> · <b>desperta a criança<\/b>.", "c": ["menor de 5 anos", "mudança de padrão", "matinal", "desperta"]}, {"p": "Cite outros 4 sinais de alarme não citados. (0,8)", "m": "Alterações neurológicas ou crises epilépticas · alterações oculares (edema de papila, anisocoria, nistagmo, estrabismo recente, diplopia, queda da acuidade) · vômitos persistentes/crescentes · dor precipitada por esforço, Valsalva ou mudança de postura · cefaleia unilateral · desaceleração do crescimento.", "c": ["neurológicas", "oculares", "vômitos", "Valsalva", "unilateral", "desaceleração do crescimento"]}, {"p": "Quais dados são indispensáveis no exame físico? (0,4)", "m": "<b>Pressão arterial<\/b> e <b>exame neurológico completo<\/b>, incluindo <b>fundo de olho<\/b> (“sempre”, slide 42).", "c": ["pressão arterial", "exame neurológico", "fundo de olho"]}, {"p": "Primária ou secundária? Justifique. (0,4)", "m": "<b>Secundária<\/b> (suspeita de hipertensão intracraniana / processo expansivo): múltiplos alarmes, padrão progressivo, matinal e noturno em criança &lt; 5 anos → neuroimagem.", "c": ["secundária", "hipertensão intracraniana", "processo expansivo", "múltiplos sinais de alarme", "neuroimagem"]}]}, {"id": "k_c_abd", "cap": 3, "blk": ["c_abdal", "c_abd"], "t": "Sinais de alerta da dor abdominal (2025/2)", "src": "Prova 2025/2 · Q1 — gabarito mínimo oficial", "enun": "Menino de 8 anos com dor abdominal periumbilical recorrente há 6 meses, 2 vezes por semana, faltando à escola. A mãe quer saber quando deve se preocupar.", "p": [{"p": "Essa dor preenche o critério de dor recorrente? Justifique.", "m": "Sim: <b>≥ 3 episódios<\/b> em <b>≥ 3 meses<\/b>, com intensidade que <b>interfere nas atividades<\/b> (faltas escolares).", "c": ["3 episódios", "3 meses", "interfere nas atividades"]}, {"p": "Cite os sinais de alerta da dor abdominal recorrente.", "m": "Gabarito oficial: <b>dor que repetidamente desperta a criança<\/b>; <b>dor de localização periférica<\/b>; <b>dor que irradia<\/b> para costas, escápula ou membros inferiores. Acrescentar: perda de peso/desaceleração do crescimento, febre recorrente, vômitos biliosos, visceromegalias/massas, sangramento, história familiar (DII, celíaca, péptica), alteração de VHS/PCR/hemograma/urina.", "c": ["desperta", "periférica", "irradia", "perda de peso", "vômitos biliosos", "sangramento", "história familiar"]}, {"p": "Sem sinais de alerta, qual a conduta?", "m": "<b>Abordagem ambulatorial<\/b>: anamnese com criança e pais separados, estressores, diário da dor, explicar a natureza funcional (90–95%), <b>orientar os sinais de alerta<\/b> e acompanhar; evitar “não é nada” e investigação extensa.", "c": ["ambulatorial", "funcional", "orientar sinais de alerta", "acompanhar", "evitar investigação extensa"]}]}, {"id": "k_c_cresc", "cap": 3, "blk": ["c_cresc", "c_geral"], "t": "O irmão com dor nas pernas à noite", "src": "Prova A1 (7 pts) · versão longa da Q1 de adenomegalia — Profa. Patrícia", "enun": "O irmão de 7 anos de uma criança atendida por adenite refere dor nas pernas à noite, algumas vezes por semana, há 4 meses. Brinca normalmente durante o dia.", "p": [{"p": "Quais os critérios de dor recorrente?", "m": "<b>≥ 3 episódios<\/b> de dor, com intensidade que <b>interfere nas atividades habituais<\/b>, num período de <b>≥ 3 meses<\/b>.", "c": ["3 episódios", "3 meses", "interfere nas atividades"]}, {"p": "Cite 3 critérios para suspeitar de dor de crescimento.", "m": "<b>6–13 anos<\/b> · dor intensa <b>bilateral<\/b> em MMII (coxa anterior, poplítea, panturrilha) · crises de 10–15 min no <b>fim da tarde/noite<\/b>, podendo acordar · difícil de localizar · sem outras queixas e <b>exame normal<\/b> · melhora com calor, massagem, analgésico.", "c": ["6 a 13 anos", "bilateral", "noite", "exame normal", "massagem"]}]}, {"id": "k_a_aden", "cap": 4, "blk": ["a_adenite", "a_infl", "a_grav"], "t": "O caroço no pescoço (caiu 3×, até 2,6 pts)", "src": "Prova A1 (7 pts) · Q3 / Q1 — caiu em 3 versões — Profa. Patrícia", "enun": "Criança de 5 anos, febre há 3 dias e “caroço no pescoço”. Um único gânglio <b>submandibular direito<\/b>, ~2 cm, <b>doloroso<\/b>, com <b>sinais flogísticos<\/b> e <b>região central flutuante<\/b>. Bom estado geral.", "p": [{"p": "Qual a primeira abordagem diagnóstica e a principal hipótese?", "m": "Localizada, sem sinais de gravidade, inflamatória, cervical superior → <b>adenite piogênica<\/b> (<i>S. aureus<\/i> / estreptococo do grupo A). Pedir <b>hemograma, VHS e PCR<\/b>.", "c": ["adenite", "S. aureus", "estreptococo", "hemograma", "PCR"]}, {"p": "Qual o tratamento? Se não melhorar, qual a próxima abordagem?", "m": "Antibiótico oral <b>10 dias<\/b> cobrindo <i>S. aureus<\/i> e estrepto: <b>cefalexina 25–50 mg/kg/dia 6/6 h<\/b> (alternativas: cefuroxima 20–30 mg/kg/dia 12/12 h; azitromicina 10 → 5 mg/kg; clindamicina 10–20 mg/kg/dia se MRSA/anaeróbio). Reavaliar em <b>24–48 h<\/b>; flutuação → <b>punção/drenagem<\/b>. Sem resposta → <b>biópsia<\/b>.", "c": ["cefalexina", "25 a 50 mg/kg/dia", "10 dias", "24 a 48 h", "drenagem", "biópsia"]}, {"p": "Meses depois surge adenomegalia supraclavicular direita. O que pensar e o que pedir?", "m": "Supraclavicular <b>direita → tumor intratorácico<\/b> ou processo inflamatório (esquerda → abdome). Pedir <b>hemograma, VHS/PCR e RX de tórax<\/b>: blastos → leucemia → <b>mielograma<\/b>; mediastino alargado → TB, linfoma, sarcoidose → <b>biópsia<\/b>; exames normais → <b>biópsia<\/b> mesmo assim.", "c": ["intratorácico", "RX de tórax", "hemograma", "mielograma", "mediastino", "biópsia"]}]}, {"id": "k_a_leuc", "cap": 4, "blk": ["a_leuc", "a_grav", "c_membal"], "t": "Luísa: dor nas pernas que não é de crescimento", "src": "Prova A1 (3 pts) · Q2 média taxonomia — Profa. Patrícia", "enun": "Luísa, 6 anos, dor em MMII bilateral e recorrente há ~5 meses, antes semanal e agora <b>diária<\/b>. Anorexia, <b>perda de peso<\/b> (1.800 g em 2 meses), cansaço. Exame: <b>adenomegalia<\/b> cervical, submandibular e inguinal bilateral; <b>fígado a 3–4 cm<\/b> do RCD e <b>ponta de baço<\/b>; <b>palidez acentuada<\/b>. Exame dos membros normal.", "p": [{"p": "Primeira abordagem: quais exames? (0,2)", "m": "<b>Hemograma completo<\/b> (+ VHS/PCR, DHL/ácido úrico, RX de tórax).", "c": ["hemograma", "VHS", "RX de tórax"]}, {"p": "Hipótese mais provável e justificativa. (0,2)", "m": "<b>Leucemia (LLA)<\/b>: dor óssea com sinais sistêmicos (palidez, perda de peso, astenia), adenomegalia generalizada e hepatoesplenomegalia. Dor de crescimento não tem nada disso.", "c": ["leucemia", "LLA", "palidez", "perda de peso", "hepatoesplenomegalia", "adenomegalia generalizada"]}, {"p": "O que espera nos exames iniciais e qual exame confirma? (0,2)", "m": "<b>Blastos<\/b> no sangue periférico ou <b>pancitopenia<\/b> (anemia, plaquetopenia) → <b>mielograma<\/b> confirma.", "c": ["blastos", "pancitopenia", "mielograma"]}]}, {"id": "k_a_osso", "cap": 4, "blk": ["c_membal", "a_solidos"], "t": "Dor do tumor ósseo × dor da leucemia (2025/2)", "src": "Prova 2025/2 · Q5 — gabarito mínimo oficial", "enun": "Adolescente de 13 anos com dor no joelho direito há 6 semanas, progressiva, que o acorda à noite e não melhora com analgésico. Sem febre, sem perda de peso, hemograma normal.", "p": [{"p": "Como diferenciar a dor do tumor ósseo da dor da leucemia?", "m": "Gabarito oficial: <b>tumor ósseo = dor localizada<\/b>, sem sinais sistêmicos; <b>leucemia = dor não localizada<\/b> + sintomas sistêmicos (prostração, palidez, perda de peso, visceromegalias).", "c": ["localizada", "não localizada", "sintomas sistêmicos", "palidez", "perda de peso"]}, {"p": "Qual a hipótese e a investigação deste caso?", "m": "<b>Tumor ósseo primário<\/b> (osteossarcoma — 10–19 anos, metáfise do joelho; Ewing 10–15): <b>RX do joelho<\/b> e, com lesão, encaminhamento à oncologia para <b>biópsia<\/b>.", "c": ["osteossarcoma", "joelho", "RX", "biópsia"]}]}, {"id": "k_v_sacud", "cap": 5, "blk": ["v_sacud", "v_conduta"], "t": "O lactente em coma (caiu nas 3 provas + 2025/2)", "src": "Caiu nas 3 provas antigas e em 2025/2 (0,5 pt) — Profa. Patrícia", "enun": "Lactente de 3 meses chega ao PS em <b>coma<\/b>. Relato confuso: a mãe diz que a criança chorava muito e ela tentou fazê-la parar. Não há hematomas nem escoriações no couro cabeludo.", "p": [{"p": "Suspeitando de síndrome do bebê sacudido, qual tríade espera encontrar?", "m": "<b>Hematoma subdural + hemorragia retiniana + ausência de trauma craniano<\/b> (slide 36) — gabarito 2025/2: “quadro neurológico agudo sem sinais de infecção”. Também: hemorragia subaracnóidea, edema cerebral, fratura de arcos costais posteriores.", "c": ["hematoma subdural", "hemorragia retiniana", "ausência de trauma", "sem sinais de infecção", "arcos costais"]}, {"p": "Quais exames solicitar para documentar?", "m": "<b>Tomografia de crânio<\/b>, <b>fundoscopia<\/b> (oftalmologia), <b>radiografias de esqueleto<\/b> (arcos costais, metáfises), coagulograma para afastar coagulopatia.", "c": ["tomografia", "fundoscopia", "radiografia de esqueleto", "coagulograma"]}, {"p": "Qual a conduta legal e ética?", "m": "Tratar e <b>internar<\/b> (proteção); <b>notificar o Conselho Tutelar<\/b> já na <b>suspeita<\/b> (ECA art. 245) e preencher a ficha <b>SINAN<\/b>; é <b>dever do médico<\/b> (CEM art. 28), supera o sigilo e não é denúncia policial.", "c": ["internar", "Conselho Tutelar", "suspeita", "ECA 245", "SINAN", "sigilo"]}]}, {"id": "k_v_queim", "cap": 5, "blk": ["v_fis", "v_desconf", "v_conduta"], "t": "Queimaduras circulares no dorso", "src": "Caso autoral no estilo da professora (slides 32, 50, 54–59)", "enun": "Menina de 2 anos, 12 kg, levada ao PS de madrugada com três lesões circulares de ~8 mm no dorso, em <b>estágios diferentes<\/b> de cicatrização. A mãe diz que “encostou no fogão”. Já foi atendida em outros dois hospitais neste ano. O pediatra não tem certeza de que houve agressão.", "p": [{"p": "Cite 4 dados que sugerem violência física.", "m": "Lesões <b>circulares (cigarro)<\/b> · <b>estágios diferentes<\/b> de cicatrização · <b>história incompatível<\/b> com o tipo de lesão · <b>área coberta<\/b> (dorso) · atendimento de <b>madrugada<\/b> e em <b>vários hospitais<\/b>.", "c": ["cigarro", "estágios diferentes", "história incompatível", "área coberta", "vários hospitais", "madrugada"]}, {"p": "Qual a conduta, mesmo sem certeza?", "m": "Tratar as lesões, <b>acolher<\/b> e anotar sem induzir, <b>avaliar o risco real<\/b> (internar se necessário) e <b>comunicar a suspeita ao Conselho Tutelar<\/b> (ECA 245) com ficha SINAN. Não precisa de confirmação; BO não substitui; o dever supera o sigilo.", "c": ["tratar", "avaliar risco", "internar", "Conselho Tutelar", "suspeita", "SINAN"]}]}, {"id": "k_g_B", "cap": 6, "blk": ["g_grupos", "g_ab", "g_def"], "t": "Dengue com 15 kg e petéquias (caiu nas 3 provas)", "src": "Caiu nas 3 provas antigas (0,6–1,2 pt) — Profa. Patrícia", "enun": "Paciente de 3 anos (<b>15 kg<\/b>), febre de 39 °C há 5 dias. Sem vômitos nem sangramentos. Sem foco. Hidratado, com <b>petéquias em face<\/b>.", "p": [{"p": "Quais sinais de alarme pesquisar no exame físico? (0,6)", "m": "Dor abdominal intensa/à palpação · <b>hepatomegalia dolorosa<\/b> (&gt; 2 cm) · acúmulo de líquidos (ascite, derrame pleural/pericárdico) · <b>hipotensão postural/lipotimia<\/b> · sangramento de mucosas · <b>letargia ou irritabilidade<\/b> · (anamnese: vômitos persistentes, diurese diminuída; laboratório: Ht subindo, plaquetas caindo).", "c": ["dor abdominal", "hepatomegalia dolorosa", "ascite", "hipotensão postural", "sangramento de mucosa", "letargia", "irritabilidade"]}, {"p": "Sem sinais de alarme: qual o grupo e qual o primeiro atendimento? (0,6)", "m": "<b>Grupo B<\/b> — petéquias = manifestação hemorrágica espontânea de pele, sem alarme. <b>Hemograma obrigatório<\/b> (até 4 h); <b>hidratação ORAL supervisionada<\/b> na unidade, antes do resultado, <b>≥ 50 mL/kg em 4–6 h = ≥ 750 mL<\/b>; reavaliar clínica, diurese, Ht e plaquetas; <b>Ht &gt; 38%<\/b>, alarme ou recusa da VO → venosa, conduta do <b>grupo C<\/b>. Sem anti-inflamatório; notificar.", "c": ["grupo B", "hemograma", "oral supervisionada", "50 mL/kg", "750 mL", "4 a 6 horas", "Ht > 38%"]}]}, {"id": "k_g_C", "cap": 6, "blk": ["g_cd", "g_diag", "g_def"], "t": "Dengue com alarme, 30 kg, 4º dia (2025/2)", "src": "Prova 2025/2 · Q2 (1,6 pt) — gabarito mínimo oficial", "enun": "Escolar de 9 anos, <b>30 kg<\/b>, no <b>4º dia<\/b> de febre, com dor abdominal, vômitos persistentes, irritabilidade e hemoconcentração. PA 100 × 68 mmHg, pulsos cheios, TEC 2 s.", "p": [{"p": "Classifique. (0,4)", "m": "<b>Grupo C<\/b>: sinais de alarme (dor abdominal, vômitos persistentes, irritabilidade, hemoconcentração) <b>sem choque<\/b> (PA diferencial 32, pulsos cheios, TEC 2 s).", "c": ["grupo C", "sinais de alarme", "sem choque"]}, {"p": "Qual exame confirmatório no 4º dia? (0,3)", "m": "<b>NS1 ou RT-PCR<\/b> (até o 5º dia); sorologia IgM só a partir do 6º.", "c": ["NS1", "PCR", "IgM a partir do 6º dia"]}, {"p": "Qual a conduta inicial? (0,9)", "m": "<b>Internação<\/b>, acesso venoso, <b>SF 0,9% ou Ringer 20 mL/kg = 600 mL em 1 hora<\/b>, reavaliação clínica <b>horária<\/b> e <b>Ht após 2 h<\/b>; até 3 expansões; melhorou → manutenção (Holliday-Segar: 1500 + 20 × 10 = <b>1700 mL/dia<\/b>) + reposição de perdas; não melhorou → conduta D.", "c": ["internação", "20 mL/kg", "600 mL", "reavaliação horária", "hematócrito após 2 horas", "3 expansões", "Holliday-Segar"]}]}, {"id": "k_h_rn", "cap": 7, "blk": ["h_prevB", "h_marc", "h_B"], "t": "A gestante HBsAg+ e o filho", "src": "Caso autoral no estilo da professora (slides 12, 14, 16, 17) — tema nunca caiu", "enun": "Gestante de 24 anos chega em trabalho de parto com sorologia do pré-natal: <b>HBsAg reagente, anti-HBc IgG reagente, anti-HBc IgM não reagente, HBeAg reagente<\/b>. O RN nasce a termo, 3.200 g, de parto vaginal.", "p": [{"p": "Interprete a sorologia materna e o risco para o RN.", "m": "<b>Hepatite B crônica<\/b> (HBsAg + anti-HBc IgG, sem IgM) <b>com replicação<\/b> (HBeAg+). Risco de infecção crônica no filho sem profilaxia: <b>70–90%<\/b>.", "c": ["hepatite B crônica", "anti-HBc IgG", "HBeAg", "replicação", "70 a 90%"]}, {"p": "Qual a conduta com o RN?", "m": "<b>Vacina hepatite B + imunoglobulina (IGHAHB)<\/b>, <b>preferencialmente nas primeiras 24 h<\/b> (MEDCURSO: 12 h), em <b>grupamentos musculares diferentes<\/b>; completar o esquema (pentavalente 2-4-6 meses). <b>Não<\/b> dosar HBsAg do RN ao nascer. <b>Aleitamento liberado.<\/b>", "c": ["vacina", "IGHAHB", "24 horas", "músculos diferentes", "pentavalente", "aleitamento"]}, {"p": "Aos 15 meses o HBsAg da criança veio reagente. O que fazer para confirmar cronicidade?", "m": "Acima de 12 meses: <b>repetir o HBsAg em 6 meses<\/b>; persistência confirma hepatite B <b>crônica<\/b>.", "c": ["repetir HBsAg", "6 meses", "crônica"]}]}, {"id": "k_m_rn", "cap": 8, "blk": ["m_trat", "m_etio"], "t": "Meningite em menor de 2 meses (caiu 2×)", "src": "Caiu em 2 provas antigas (0,5 pt) — Profa. Patrícia", "enun": "Lactente de 5 semanas, 4 kg, com hipotermia, recusa alimentar e gemência. Líquor com pleocitose neutrofílica.", "p": [{"p": "Cite o tratamento empírico da meningite em crianças menores de 2 meses.", "m": "<b>Ampicilina + cefalosporina de 3ª geração (cefotaxima)<\/b>. 2ª opção: <b>ampicilina + aminoglicosídeo<\/b> (gentamicina). A ampicilina cobre <i>Listeria<\/i> e enterococo. Doses (slide 33): ampicilina 200–300 mg/kg/dia 6/6 h · cefotaxima 200 mg/kg/dia 6/6 h.", "c": ["ampicilina", "cefotaxima", "gentamicina", "Listeria", "200 mg/kg/dia"]}, {"p": "Quais os agentes prováveis nessa idade?", "m": "<b>Enterobactérias<\/b> (<i>E. coli<\/i>), <b>estreptococo do grupo B<\/b> e <b><i>Listeria monocytogenes<\/i><\/b>.", "c": ["enterobactérias", "E. coli", "estreptococo do grupo B", "Listeria"]}]}, {"id": "k_m_bact", "cap": 8, "blk": ["m_lcr", "m_trat", "m_dexa", "m_clin"], "t": "Meningite bacteriana na criança maior (2025/2)", "src": "Prova 2025/2 · Q3 (1,5 pt) — gabarito mínimo oficial", "enun": "Menino de 5 anos, 18 kg, febre alta, cefaleia e vômitos há 12 h; teve uma convulsão em casa. Rigidez de nuca, Kernig e Brudzinski positivos. Líquor <b>turvo<\/b>: 2.800 leucócitos com 90% de neutrófilos, proteína 180 mg/dL, glicose 20 mg/dL, bacterioscopia com diplococos.", "p": [{"p": "Diagnóstico e justificativa. (0,6)", "m": "<b>Meningite bacteriana<\/b>: febre + cefaleia + vômitos, sinais de irritação meníngea, convulsão; líquor <b>turvo<\/b>, &gt; 1.000 células com <b>neutrófilos<\/b>, <b>glicose baixa<\/b> (&lt; 30), <b>proteína alta<\/b> (100–200), bacterioscopia positiva.", "c": ["meningite bacteriana", "rigidez de nuca", "turvo", "neutrófilos", "glicose baixa", "proteína alta"]}, {"p": "Agentes prováveis. (0,3)", "m": "<b>Pneumococo<\/b> e <b>meningococo<\/b> (Hib raro após a vacina); diplococos sugerem pneumococo (Gram +) ou meningococo (Gram −).", "c": ["pneumococo", "meningococo", "Hib"]}, {"p": "Tratamento. (0,6)", "m": "Suporte; <b>ceftriaxona 100 mg/kg/dia 12/12 h<\/b> (ou cefotaxima) <b>+ vancomicina 60 mg/kg/dia 6/6 h<\/b>; <b>dexametasona 0,15 mg/kg/dose 6/6 h por 2 dias<\/b>, antes ou junto da 1ª dose (&gt; 6 semanas); notificar e quimioprofilaxia dos contatos se meningococo.", "c": ["ceftriaxona", "100 mg/kg/dia", "vancomicina", "dexametasona", "0,15 mg/kg", "antes ou junto"]}]}, {"id": "k_m_3lcr", "cap": 8, "blk": ["m_lcr", "m_profil"], "t": "Três líquores (treino no estilo da professora)", "src": "Tour Provas · questão nova no estilo da professora", "enun": "Três crianças com febre, cefaleia e vômitos fazem punção lombar:<br><b>A)<\/b> 2 anos: 3.200 células, 90% neutrófilos, proteína 180, glicose 18, Gram com diplococos Gram-negativos.<br><b>B)<\/b> 6 anos: 180 células, 85% linfócitos, proteína 45, glicose 60, Gram negativo.<br><b>C)<\/b> 4 anos, contato domiciliar com adulto tossidor, 3 semanas de febre e sonolência: 250 células, linfócitos, proteína 310, glicose 22.", "p": [{"p": "Qual o tipo de meningite em cada caso? Justifique pelo líquor.", "m": "<b>A = bacteriana<\/b> (&gt; 1.000, neutrófilos, proteína 100–200, glicose &lt; 30, Gram +). <b>B = viral<\/b> (&lt; 1.000, linfócitos, proteína e glicose normais). <b>C = tuberculosa<\/b> (20–500, linfócitos, <b>proteína muito alta<\/b>, <b>glicose baixa<\/b>, evolução arrastada, contato com TB).", "c": ["bacteriana", "viral", "tuberculosa", "neutrófilos", "linfócitos", "proteína muito alta", "glicose baixa"]}, {"p": "Provável agente de A e conduta com o irmão de 5 anos que divide o quarto.", "m": "Diplococo Gram-negativo = <b>meningococo<\/b>. Irmão é contato íntimo → <b>quimioprofilaxia<\/b> independentemente da vacina: <b>rifampicina 10 mg/kg (máx. 600 mg) 12/12 h por 2 dias<\/b> (alternativa: ceftriaxona IM 125 mg dose única &lt; 15 anos). Paciente em precaução respiratória 24–48 h; notificar.", "c": ["meningococo", "rifampicina", "10 mg/kg", "12/12 h", "2 dias", "independente da vacina", "notificar"]}, {"p": "Qual pesquisa no líquor de C tem baixa positividade?", "m": "<b>Ziehl-Neelsen<\/b>: positivo em só <b>30%<\/b> — a confirmação vem do isolamento do BK.", "c": ["Ziehl-Neelsen", "30%"]}]}, {"id": "k_i_inv", "cap": 9, "blk": ["i_imagem", "i_profil"], "t": "Investigação após a 1ª ITU febril (caiu 2×)", "src": "Caiu em 2 provas antigas (0,6 pt) — Profa. Patrícia", "enun": "Menina de <b>1 ano<\/b> com ITU febril (febre alta, vômitos, comprometimento importante do estado geral), tratada adequadamente.", "p": [{"p": "Em que consiste a investigação? Cite os exames e o objetivo de cada um.", "m": "Investigar após o 1º episódio bem documentado (slide 28): <b>ultrassom de rins e vias urinárias<\/b> primeiro (em &lt; 2 anos, profilaxia até o USG); <b>uretrocistografia miccional<\/b> após o tratamento, para <b>refluxo vesicoureteral<\/b>; <b>cintilografia com DMSA<\/b> para <b>cicatriz renal<\/b>, <b>3 meses após a cura<\/b>. (DTPA só se suspeita de obstrução.)", "c": ["ultrassom", "uretrocistografia miccional", "refluxo vesicoureteral", "após o tratamento", "DMSA", "cicatriz renal", "3 meses"]}, {"p": "Ela deve receber profilaxia? Com qual droga?", "m": "Sim, <b>durante a investigação<\/b> (&lt; 2 anos até o USG; manter se RVU III–V, obstrução ou recidivas): <b>nitrofurantoína ou SMX-TMP<\/b> em dose subterapêutica (≈ 1/3, à noite), pois tem &gt; 2 meses.", "c": ["durante a investigação", "nitrofurantoína", "sulfametoxazol", "dose subterapêutica"]}]}, {"id": "k_i_trat", "cap": 9, "blk": ["i_trat", "i_lab", "i_coleta"], "t": "Pielonefrite no pré-escolar", "src": "Caso autoral no estilo da professora (slides 14–23)", "enun": "Menino de 3 anos, 14 kg, febre de 38,8 °C há 2 dias e dor lombar; bom estado geral, hidratado, aceitando dieta. EAS: piúria, esterase e nitrito positivos.", "p": [{"p": "Como colher a urocultura e qual resultado confirma?", "m": "Sem controle confiável: <b>cateterismo<\/b> ou <b>punção suprapúbica<\/b> (saco coletor só vale se negativo); com controle, <b>jato médio<\/b>. Confirma: <b>≥ 100.000 UFC/mL de uma bactéria<\/b> (punção: qualquer crescimento).", "c": ["cateterismo", "punção suprapúbica", "saco coletor", "100.000 UFC", "uma bactéria"]}, {"p": "Precisa internar? Prescreva o tratamento.", "m": "<b>Não<\/b>: sem toxemia, desidratação ou vômitos (internar todo RN e os graves). <b>Iniciar logo após a coleta<\/b>: <b>cefalexina 50–100 mg/kg/dia em 4 doses<\/b> (14 kg: 700–1.400 mg/dia) por <b>10 dias (7–14)<\/b>. Nitrofurantoína não serve para pielonefrite.", "c": ["não internar", "logo após a coleta", "cefalexina", "50 a 100 mg/kg/dia", "4 doses", "10 dias"]}]}, {"id": "k_s_sep", "cap": 10, "blk": ["s_recon", "s_hora1", "s_aminas"], "t": "Lactente toxemiado com impetigo (prova antiga, 1,3 pt)", "src": "Prova A1 (3 pts) · Q2 média taxonomia — Profa. Patrícia", "enun": "Lactente de 1 ano, <b>10 kg<\/b>, tosse e febre há 1 semana com piora e dificuldade respiratória. Prostrado, sonolento, toxemiado, febre 39,5 °C. <b>Extremidades quentes<\/b>, FC 154, <b>pulsos periféricos não palpáveis<\/b>, centrais diminuídos, <b>PA 60 × 40<\/b>, perfusão 4 s. MV diminuído com estertores bilaterais, FR 60, tiragem. <b>Impetigo em membros inferiores.<\/b>", "p": [{"p": "Classifique o choque, a origem e o provável agente.", "m": "<b>Choque séptico (distributivo), descompensado<\/b> — hipotensão (PA 60 &lt; 70 + 2 × 1 = 72), pulsos periféricos ausentes, rebaixamento de consciência. Origem: <b>pneumonia<\/b> a partir de <b>impetigo<\/b> → <b><i>Staphylococcus aureus<\/i><\/b>.", "c": ["séptico", "distributivo", "descompensado", "72", "pneumonia", "impetigo", "Staphylococcus aureus"]}, {"p": "Descreva o atendimento na primeira hora (10 kg).", "m": "O₂ em alta concentração (máscara não reinalante com reservatório; avaliar VM) · acesso venoso ou <b>intraósseo<\/b> · <b>SF/Ringer 20 mL/kg = 200 mL em 5–20 min<\/b> (grave: até 10 min), repetir reavaliando · após <b>40–60 mL/kg<\/b> sem resposta → <b>amina<\/b>: choque quente = <b>noradrenalina 0,05–1,0 µg/kg/min<\/b> · exames: hemograma, glicemia, gasometria, Ca, K, lactato · antibiótico precoce · UTI.", "c": ["oxigênio", "intraósseo", "20 mL/kg", "200 mL", "40 a 60 mL/kg", "noradrenalina", "lactato", "antibiótico"]}, {"p": "Explique as extremidades quentes.", "m": "<b>Choque quente<\/b>: predomina a <b>vasodilatação<\/b> (queda da resistência vascular pelos mediadores da sepse), com débito mantido ou alto — pele quente, pulsos amplos no início. O problema é o tônus, por isso a droga é a noradrenalina.", "c": ["choque quente", "vasodilatação", "resistência vascular", "mediadores da sepse", "noradrenalina"]}]}, {"id": "k_s_caso", "cap": 10, "blk": ["s_caso", "s_manut", "s_recon"], "t": "O caso da aula: 30 kg, febre e exantema", "src": "Caso dos slides 32–40 da professora", "enun": "Criança de 10 anos, 30 kg, febre há 5 dias e exantema, agora afebril e sonolenta. FC 140, PA 80 × 50, pulsos periféricos finos, perfusão 5 s.", "p": [{"p": "Classifique e diga a conduta inicial com volumes.", "m": "&gt; 10 anos: hipotensão = PAS &lt; 90 → <b>choque descompensado<\/b>. O₂, acesso, <b>SF 20 mL/kg = 600 mL<\/b> em 5–20 min, repetir até <b>3 vezes<\/b> (60 mL/kg) reavaliando.", "c": ["descompensado", "90", "20 mL/kg", "600 mL", "3 vezes", "reavaliar"]}, {"p": "Após 3 bolus: PA 90 × 60, perfusão 4 s, pulsos periféricos impalpáveis, pulmões limpos. Conduta?", "m": "<b>Choque persistente<\/b> (perfusão e pulsos): <b>manter expansão<\/b> (novo 20 mL/kg em 20 min), <b>iniciar amina<\/b> conforme o perfil (frio → adrenalina) e <b>solicitar exames<\/b>; UTI.", "c": ["choque persistente", "manter expansão", "amina", "exames", "UTI"]}, {"p": "Estabilizada, prescreva a manutenção de 24 h.", "m": "<b>Holliday-Segar<\/b>: 1500 + 20 × 10 = <b>1700 mL/dia<\/b> de SG 5% em 4 etapas de 425 mL, com <b>Na 3<\/b> e <b>K 2 mEq/kg/dia<\/b> (NaCl 20% 3,4 mEq/mL; KCl 19,1% 2,5 mEq/mL) → ~<b>72 mL/h<\/b>.", "c": ["Holliday-Segar", "1700 mL", "4 etapas", "sódio", "potássio", "72 mL/h"]}]}], "DIV": {"adren": ["Via da adrenalina na urticária grave", "Slide 16: adrenalina 0,01 mg/kg <b>via subcutânea<\/b>", "Protocolos atuais de anafilaxia: <b>intramuscular<\/b> (vasto lateral)", "Na prova da faculdade escreva a dose do slide (<b>0,01 mg/kg<\/b>) e “IM pelos protocolos atuais” em uma linha"], "desonida": ["Potência da desonida", "Slide 20: desonida como corticoide de <b>baixa<\/b> potência", "Slide 25: desonida como <b>média<\/b> potência", "Divergência interna do material: não use a desonida como exemplo de classe; cite hidrocortisona (baixa, face) e mometasona (corpo)"], "iverm": ["Dose da ivermectina", "Slide 38 (escabiose): “0,2 <b>mcg<\/b>/kg”", "Slide 40 (pediculose): “200 a 400 mcg/kg” — 0,2 <b>mg<\/b>/kg = 200 mcg/kg", "Erro de unidade no slide 38: escreva <b>200 mcg/kg (0,2 mg/kg)<\/b>, só &gt; 15 kg"], "saramp_iso": ["Isolamento no sarampo", "Slide 15: até <b>4 dias<\/b> após o exantema", "Slide 28: <b>5 dias<\/b> após o exantema", "Divergência interna: escreva “isolamento respiratório até 4–5 dias após o início do exantema”"], "saramp_ig": ["Imunoglobulina no sarampo", "Slide 28: <b>&lt; 1 ano<\/b>, até 6 dias", "MEDCURSO: <b>&lt; 6 meses<\/b> (≥ 6 meses recebe vacina de bloqueio)", "Prova da faculdade: <b>slide (&lt; 1 ano)<\/b>; cite o bloqueio a partir de 6 meses do cursinho em uma linha"], "escarl_gab": ["Tratamento da escarlatina no gabarito", "Slide 53: <b>benzatina<\/b> dose única (600 mil &lt; 25 kg / 1,2 milhão &gt; 25 kg)", "Gabarito oficial 2025/2: “<b>amoxicilina 10 dias<\/b> (ou macrolídeo) + afastamento por <b>48 h<\/b>”", "Escreva <b>as duas opções<\/b> e o afastamento de 48 h"], "var_bloq": ["Prazo do bloqueio da varicela", "Slide 66: vacina até <b>72–96 h<\/b>", "MEDCURSO: até <b>5 dias<\/b>", "Prova: <b>72–96 h<\/b> (slide)"], "b19_inc": ["Incubação do eritema infeccioso", "Slide 72: <b>4–14 dias<\/b>", "MEDCURSO: ~<b>16 dias<\/b>", "Prova: <b>4–14 dias<\/b> (slide)"], "subito_rot": ["Rótulo dos slides do exantema súbito", "Slides 80–83 têm o título “Eritema infeccioso”", "O conteúdo é de <b>exantema súbito<\/b> (HHV-6)", "Erro de rótulo: estude o conteúdo como exantema súbito"], "mono_inc": ["Incubação da mononucleose", "Slide 84: “10 até 30–50 dias”", "MEDCURSO: 30 a 50 dias", "Prova: o slide"], "kawa_aneu": ["Aneurisma sem tratamento no Kawasaki", "Slide 99: <b>15–25%<\/b>", "Slide 100: <b>20–30%<\/b> → 4–5% tratado", "Divergência interna: “cerca de 20–25% sem tratamento; ~5% com IGIV até o 10º dia”. Prognóstico = <b>bom se tratado<\/b>"], "organ": ["Percentual de causa orgânica", "Slide 8: global <b>10–15%<\/b>", "Slides 15/25/41: abdominal 5–10%, membros 3–4%, cefaleia 5%", "Os parciais não somam o global: escreva <b>10–15% orgânicas<\/b> no geral e o % do tipo quando a pergunta for específica"], "desperta": ["“Desperta a criança”", "Slides 22 e 43: dor que desperta = <b>sinal de alerta<\/b>", "Slide 27: dor de crescimento <b>pode acordar<\/b> a criança", "Contradição do material: na dor de crescimento, acordar é aceitável <b>se bilateral e exame normal<\/b>; na abdominal e na cefaleia, acordar é <b>alarme<\/b>"], "unilat": ["Cefaleia unilateral", "Slide 43: unilateral = <b>alarme<\/b>", "Slide 38: migrânea pode ser unilateral", "Alarme é a dor <b>sempre do mesmo lado<\/b> (fixa); migrânea que alterna lados não é alarme"], "aden_corte": ["Ponto de corte do tamanho", "Slide 12: “maior que <b>2–3 cm<\/b>”", "Slide 24: <b>≥ 2,5 cm<\/b> · slide 43: linfadenopatia &gt; 2 cm", "Divergência interna: escreva “<b>&gt; 2–3 cm<\/b> (slide 12)”; no Kawasaki o corte é &gt; 1,5 cm"], "azitro": ["Duração do antibiótico na adenite", "Slide 26: “tratar com antibiótico (<b>10 dias<\/b>)”", "Slide 29: azitromicina 10 mg/kg + 5 mg/kg/dia por mais 4 dias (<b>5 dias<\/b>)", "10 dias vale para cefalexina/cefuroxima/clindamicina; azitromicina tem esquema próprio de 5 dias"], "bcg": ["Linfonodo pós-BCG", "Slide 32: <b>notificar + isoniazida<\/b>, com ou sem sinais flogísticos", "MEDCURSO (S27 07:14–09:58): isoniazida só se <b>supurado<\/b>; &lt; 3 cm é esperado; &gt; 3 cm não supurado só acompanha", "Faculdade = <b>slide<\/b>; residência = protocolo. Em qualquer caso: <b>não puncionar<\/b>"], "cura": ["Taxa de cura do câncer infantil", "Slide 37: <b>70–80%<\/b>", "Slides 56/58–62: “80%” e “maiores que 80%”", "Na prova: <b>70–80%<\/b> (texto da professora)"], "triade": ["Tríade do bebê sacudido", "Slide 36 (texto em vermelho): <b>hematoma subdural + hemorragia retiniana + ausência de trauma craniano<\/b> · slide 35 (esquema): hemorragia retiniana + <b>edema cerebral<\/b> + HSD", "Gabarito oficial 2025/2: “hemorragia retiniana; <b>quadro neurológico agudo sem sinais de infecção<\/b>; hematoma subdural ou hemorragia encefálica”", "Escreva <b>HSD + hemorragia retiniana<\/b> e complete com “<b>sem trauma externo / quadro neurológico agudo sem infecção<\/b>”"], "grupoB_ht": ["Hidratação do grupo B com Ht aumentado", "Slide 32: VO <b>≥ 50 mL/kg em 4–6 h<\/b>; <b>Ht &gt; 38%<\/b> → conduta do grupo C", "Fluxograma do MS (slide 26, baixa resolução): =\"175\" font-size=\"13.5\" fill=\"#262223\">• nistatina ou miconazol 1% por 14<\/text><text x=\"352\" y=\"194\" font-size=\"13.5\" fill=\"#5A5250\">dias<\/text><circle cx=\"320\" cy=\"146\" r=\"15\" fill=\"#FBF9F6\" stroke=\"#d9d2c7\"/><text x=\"320\" y=\"151\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#5A5250\">×<\/text><rect x=\"24\" y=\"252\" width=\"592\" height=\"33\" rx=\"10\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-opacity=\".35\"/><text x=\"320\" y=\"274\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B5402F\">Sem melhora com óxido de zinco + satélites = Candida<\/text><\/svg>", "d_pio": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 333\" font-family=\"Carlito,Segoe UI,Arial,sans-serif\" role=\"img\" aria-label=\"Impetigo: quando antibiótico oral\"><rect width=\"640\" height=\"333\" rx=\"14\" fill=\"#FBF9F6\"/><text x=\"320\" y=\"32\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#262223\">Impetigo: quando antibiótico oral<\/text><rect x=\"24\" y=\"52\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B07D3A\" stroke-width=\"1.8\"/><circle cx=\"54\" cy=\"82\" r=\"20\" fill=\"#FBF2E2\" stroke=\"#B07D3A\" stroke-width=\"1.5\"/><text x=\"54\" y=\"89\" text-anchor=\"middle\" font-size=\"19\">🍯<\/text><text x=\"82\" y=\"79\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B07D3A\">Crosta melicérica<\/text><text x=\"38\" y=\"120\" font-size=\"13.5\" fill=\"#5A5250\">amarelo-mel, perioral e perinasal =<\/text><text x=\"38\" y=\"138\" font-size=\"13.5\" fill=\"#5A5250\">impetigo<\/text><rect x=\"326\" y=\"52\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B5402F\" stroke-width=\"1.8\"/><circle cx=\"356\" cy=\"82\" r=\"20\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-width=\"1.5\"/><text x=\"356\" y=\"89\" text-anchor=\"middle\" font-size=\"19\">🗺️<\/text><text x=\"384\" y=\"79\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B5402F\">Extenso<\/text><text x=\"340\" y=\"120\" font-size=\"13.5\" fill=\"#5A5250\">muitas lesões ou áreas grandes<\/text><rect x=\"24\" y=\"166\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B5402F\" stroke-width=\"1.8\"/><circle cx=\"54\" cy=\"196\" r=\"20\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-width=\"1.5\"/><text x=\"54\" y=\"203\" text-anchor=\"middle\" font-size=\"19\">🌡️<\/text><text x=\"82\" y=\"193\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B5402F\">Febre<\/text><text x=\"38\" y=\"234\" font-size=\"13.5\" fill=\"#5A5250\">sinal de doença sistêmica<\/text><rect x=\"326\" y=\"166\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B5402F\" stroke-width=\"1.8\"/><circle cx=\"356\" cy=\"196\" r=\"20\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-width=\"1.5\"/><text x=\"356\" y=\"203\" text-anchor=\"middle\" font-size=\"19\">👄<\/text><text x=\"384\" y=\"193\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B5402F\">Perto da boca / faringite<\/text><text x=\"340\" y=\"234\" font-size=\"13.5\" fill=\"#5A5250\">proximidade da cavidade oral ou<\/text><text x=\"340\" y=\"252\" font-size=\"13.5\" fill=\"#5A5250\">faringite associada<\/text><rect x=\"24\" y=\"280\" width=\"592\" height=\"33\" rx=\"10\" fill=\"#E5F0F3\" stroke=\"#1E5E6E\" stroke-opacity=\".35\"/><text x=\"320\" y=\"302\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#1E5E6E\">Erisipela: borda nítida · Celulite: borda mal definida<\/text><\/svg>", "d_zoo": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 353\" font-family=\"Carlito,Segoe UI,Arial,sans-serif\" role=\"img\" aria-label=\"Escabiose e pediculose: quem pode o quê\"><rect width=\"640\" height=\"353\" rx=\"14\" fill=\"#FBF9F6\"/><text x=\"320\" y=\"32\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#262223\">Escabiose e pediculose: quem pode o quê<\/text><rect x=\"24\" y=\"52\" width=\"592\" height=\"52\" rx=\"8\" fill=\"#F6EAF0\" stroke=\"#7A2E4A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"74\" font-size=\"14\" font-weight=\"700\" fill=\"#7A2E4A\">Permetrina 5%<\/text><text x=\"266\" y=\"74\" font-size=\"14\" fill=\"#262223\">corpo todo (lactente: inclusive face), 8–14 h,<\/text><text x=\"266\" y=\"92\" font-size=\"14\" fill=\"#262223\">repetir em 7 dias · NÃO &lt; 2 meses<\/text><rect x=\"24\" y=\"108\" width=\"592\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#7A2E4A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"130\" font-size=\"14\" font-weight=\"700\" fill=\"#7A2E4A\">&lt; 2 meses ou gestante<\/text><text x=\"266\" y=\"130\" font-size=\"14\" fill=\"#262223\">pasta d’água com enxofre 5–10%, 3 noites,<\/text><text x=\"266\" y=\"148\" font-size=\"14\" fill=\"#262223\">repetir após 7 dias<\/text><rect x=\"24\" y=\"164\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#F6EAF0\" stroke=\"#7A2E4A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"186\" font-size=\"14\" font-weight=\"700\" fill=\"#7A2E4A\">Ivermectina VO<\/text><text x=\"266\" y=\"186\" font-size=\"14\" fill=\"#262223\">só &gt; 15 kg · repetir em 1 semana<\/text><rect x=\"24\" y=\"202\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#7A2E4A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"224\" font-size=\"14\" font-weight=\"700\" fill=\"#7A2E4A\">Contatos<\/text><text x=\"266\" y=\"224\" font-size=\"14\" fill=\"#262223\">tratar todos ao mesmo tempo + lavar roupas<\/text><rect x=\"24\" y=\"240\" width=\"592\" height=\"52\" rx=\"8\" fill=\"#F6EAF0\" stroke=\"#7A2E4A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"262\" font-size=\"14\" font-weight=\"700\" fill=\"#7A2E4A\">Pediculose<\/text><text x=\"266\" y=\"262\" font-size=\"14\" fill=\"#262223\">permetrina 1% xampu, 10 min, repetir em 7–10<\/text><text x=\"266\" y=\"280\" font-size=\"14\" fill=\"#262223\">dias + pente fino<\/text><rect x=\"24\" y=\"304\" width=\"592\" height=\"33\" rx=\"10\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-opacity=\".35\"/><text x=\"320\" y=\"326\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B5402F\">Prurido noturno + contatos coçando + túnel = escabiose<\/text><\/svg>", "d_mic": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 317\" font-family=\"Carlito,Segoe UI,Arial,sans-serif\" role=\"img\" aria-label=\"Micoses: droga e tempo\"><rect width=\"640\" height=\"317\" rx=\"14\" fill=\"#FBF9F6\"/><text x=\"320\" y=\"32\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#262223\">Micoses: droga e tempo<\/text><rect x=\"24\" y=\"52\" width=\"592\" height=\"52\" rx=\"8\" fill=\"#FBF2E2\" stroke=\"#B07D3A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"74\" font-size=\"14\" font-weight=\"700\" fill=\"#B07D3A\">Tinea capitis<\/text><text x=\"266\" y=\"74\" font-size=\"14\" fill=\"#262223\">griseofulvina 10–20 mg/kg/dia, 6–8 semanas (&gt; 2<\/text><text x=\"266\" y=\"92\" font-size=\"14\" fill=\"#262223\">anos) + xampu selênio 2,5%<\/text><rect x=\"24\" y=\"108\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#B07D3A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"130\" font-size=\"14\" font-weight=\"700\" fill=\"#B07D3A\">Fluconazol (slide)<\/text><text x=\"266\" y=\"130\" font-size=\"14\" fill=\"#262223\">só &gt; 12 anos<\/text><rect x=\"24\" y=\"146\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#FBF2E2\" stroke=\"#B07D3A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"168\" font-size=\"14\" font-weight=\"700\" fill=\"#B07D3A\">Tinea corporis<\/text><text x=\"266\" y=\"168\" font-size=\"14\" fill=\"#262223\">imidazólico tópico por 4 semanas<\/text><rect x=\"24\" y=\"184\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#B07D3A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"206\" font-size=\"14\" font-weight=\"700\" fill=\"#B07D3A\">Pitiríase versicolor<\/text><text x=\"266\" y=\"206\" font-size=\"14\" fill=\"#262223\">tópico por 30 dias<\/text><rect x=\"24\" y=\"222\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#FBF2E2\" stroke=\"#B07D3A\" stroke-opacity=\".35\"/><text x=\"36\" y=\"244\" font-size=\"14\" font-weight=\"700\" fill=\"#B07D3A\">Sapinho<\/text><text x=\"266\" y=\"244\" font-size=\"14\" fill=\"#262223\">nistatina 6/6 h até 2 dias após sumir<\/text><rect x=\"24\" y=\"268\" width=\"592\" height=\"33\" rx=\"10\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-opacity=\".35\"/><text x=\"320\" y=\"290\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#B5402F\">Couro cabeludo nunca é tratado só com creme<\/text><\/svg>", "d_vir": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 315\" font-family=\"Carlito,Segoe UI,Arial,sans-serif\" role=\"img\" aria-label=\"Viroses de pele\"><rect width=\"640\" height=\"315\" rx=\"14\" fill=\"#FBF9F6\"/><text x=\"320\" y=\"32\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#262223\">Viroses de pele<\/text><rect x=\"24\" y=\"52\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#1E5E6E\" stroke-width=\"1.8\"/><circle cx=\"54\" cy=\"82\" r=\"20\" fill=\"#E5F0F3\" stroke=\"#1E5E6E\" stroke-width=\"1.5\"/><text x=\"54\" y=\"89\" text-anchor=\"middle\" font-size=\"19\">🫧<\/text><text x=\"82\" y=\"79\" font-size=\"15.5\" font-weight=\"700\" fill=\"#1E5E6E\">Molusco<\/text><text x=\"38\" y=\"120\" font-size=\"13.5\" fill=\"#5A5250\">poxvírus, umbilicação central,<\/text><text x=\"38\" y=\"138\" font-size=\"13.5\" fill=\"#5A5250\">autolimitado 6 m–2 a<\/text><rect x=\"326\" y=\"52\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B07D3A\" stroke-width=\"1.8\"/><circle cx=\"356\" cy=\"82\" r=\"20\" fill=\"#FBF2E2\" stroke=\"#B07D3A\" stroke-width=\"1.5\"/><text x=\"356\" y=\"89\" text-anchor=\"middle\" font-size=\"19\">🪨<\/text><text x=\"384\" y=\"79\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B07D3A\">Verruga<\/text><text x=\"340\" y=\"120\" font-size=\"13.5\" fill=\"#5A5250\">HPV, áspera, pontos negros, ácido<\/text><text x=\"340\" y=\"138\" font-size=\"13.5\" fill=\"#5A5250\">salicílico<\/text><rect x=\"24\" y=\"166\" width=\"290\" height=\"84\ ulopapular<\/text><text x=\"38\" y=\"120\" font-size=\"13.5\" fill=\"#5A5250\">sarampo, rubéola, escarlatina,<\/text><text x=\"38\" y=\"138\" font-size=\"13.5\" fill=\"#5A5250\">exantema súbito, eritema infeccioso<\/text><rect x=\"326\" y=\"52\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#5B3F8C\" stroke-width=\"1.8\"/><circle cx=\"356\" cy=\"82\" r=\"20\" fill=\"#EFEAF7\" stroke=\"#5B3F8C\" stroke-width=\"1.5\"/><text x=\"356\" y=\"89\" text-anchor=\"middle\" font-size=\"19\">💧<\/text><text x=\"384\" y=\"79\" font-size=\"15.5\" font-weight=\"700\" fill=\"#5B3F8C\">Vesicular<\/text><text x=\"340\" y=\"120\" font-size=\"13.5\" fill=\"#5A5250\">varicela, mão-pé-boca, herpes<\/text><rect x=\"24\" y=\"166\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B5402F\" stroke-width=\"1.8\"/><circle cx=\"54\" cy=\"196\" r=\"20\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-width=\"1.5\"/><text x=\"54\" y=\"203\" text-anchor=\"middle\" font-size=\"19\">🩸<\/text><text x=\"82\" y=\"193\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B5402F\">Petequial / purpúrico<\/text><text x=\"38\" y=\"234\" font-size=\"13.5\" fill=\"#5A5250\">meningococcemia: emergência — não some<\/text><text x=\"38\" y=\"252\" font-size=\"13.5\" fill=\"#5A5250\">à digitopressão<\/text><rect x=\"326\" y=\"166\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#1E5E6E\" stroke-width=\"1.8\"/><circle cx=\"356\" cy=\"196\" r=\"20\" fill=\"#E5F0F3\" stroke=\"#1E5E6E\" stroke-width=\"1.5\"/><text x=\"356\" y=\"203\" text-anchor=\"middle\" font-size=\"19\">😷<\/text><text x=\"384\" y=\"193\" font-size=\"15.5\" font-weight=\"700\" fill=\"#1E5E6E\">Aerossol<\/text><text x=\"340\" y=\"234\" font-size=\"13.5\" fill=\"#5A5250\">só sarampo e varicela → N95 e quarto<\/text><text x=\"340\" y=\"252\" font-size=\"13.5\" fill=\"#5A5250\">privativo<\/text><\/svg>", "e_saramp": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 400\" font-family=\"Carlito,Segoe UI,Arial,sa F8C\" stroke-width=\"1.5\"/><text x=\"356\" y=\"89\" text-anchor=\"middle\" font-size=\"19\">♿<\/text><text x=\"384\" y=\"79\" font-size=\"15.5\" font-weight=\"700\" fill=\"#5B3F8C\">Onde persiste<\/text><text x=\"340\" y=\"120\" font-size=\"13.5\" fill=\"#5A5250\">mielomeningocele, bexiga neurogênica,<\/text><text x=\"340\" y=\"138\" font-size=\"13.5\" fill=\"#5A5250\">cateterismo<\/text><rect x=\"24\" y=\"166\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B5402F\" stroke-width=\"1.8\"/><circle cx=\"54\" cy=\"196\" r=\"20\" fill=\"#FBEDE8\" stroke=\"#B5402F\" stroke-width=\"1.5\"/><text x=\"54\" y=\"203\" text-anchor=\"middle\" font-size=\"19\">🚫<\/text><text x=\"82\" y=\"193\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B5402F\">Conduta<\/text><text x=\"38\" y=\"234\" font-size=\"13.5\" fill=\"#5A5250\">não tratar e não fazer profilaxia<\/text><rect x=\"326\" y=\"166\" width=\"290\" height=\"102\" rx=\"12\" fill=\"#fff\" stroke=\"#B07D3A\" stroke-width=\"1.8\"/><circle cx=\"356\" cy=\"196\" r=\"20\" fill=\"#FBF2E2\" stroke=\"#B07D3A\" stroke-width=\"1.5\"/><text x=\"356\" y=\"203\" text-anchor=\"middle\" font-size=\"19\">⚠️<\/text><text x=\"384\" y=\"193\" font-size=\"15.5\" font-weight=\"700\" fill=\"#B07D3A\">Por quê<\/text><text x=\"340\" y=\"234\" font-size=\"13.5\" fill=\"#5A5250\">seleciona germe mais virulento → ITU<\/text><text x=\"340\" y=\"252\" font-size=\"13.5\" fill=\"#5A5250\">sintomática<\/text><\/svg>", "i_trat": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 431\" font-family=\"Carlito,Segoe UI,Arial,sans-serif\" role=\"img\" aria-label=\"Tratamento e doses (mg/kg/dia)\"><rect width=\"640\" height=\"431\" rx=\"14\" fill=\"#FBF9F6\"/><text x=\"320\" y=\"32\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#262223\">Tratamento e doses (mg/kg/dia)<\/text><rect x=\"24\" y=\"52\" width=\"592\" height=\"52\" rx=\"8\" fill=\"#E7F2EC\" stroke=\"#2E6B4F\" stroke-opacity=\".35\"/><text x=\"36\" y=\"74\" font-size=\"14\" font-weight=\"700\" fill=\"#2E6B4F\">Internar<\/text><text x=\"266\" y=\"74\" font-size=\"14\" fill=\"#262223\">toxemia · desidratação · vômitos · choque ·<\/text><text x=\"266\" y=\"92\" font-size=\"14\" fill=\"#262223\">todo RN<\/text><rect x=\"24\" y=\"108\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#2E6B4F\" stroke-opacity=\".35\"/><text x=\"36\" y=\"130\" font-size=\"14\" font-weight=\"700\" fill=\"#2E6B4F\">Cefalexina VO<\/text><text x=\"266\" y=\"130\" font-size=\"14\" fill=\"#262223\">50–100 em 4 doses · 10 dias (7–14)<\/text><rect x=\"24\" y=\"146\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#E7F2EC\" stroke=\"#2E6B4F\" stroke-opacity=\".35\"/><text x=\"36\" y=\"168\" font-size=\"14\" font-weight=\"700\" fill=\"#2E6B4F\">Cefadroxil VO<\/text><text x=\"266\" y=\"168\" font-size=\"14\" fill=\"#262223\">30–50 em 2 doses<\/text><rect x=\"24\" y=\"184\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#2E6B4F\" stroke-opacity=\".35\"/><text x=\"36\" y=\"206\" font-size=\"14\" font-weight=\"700\" fill=\"#2E6B4F\">SMX-TMP VO<\/text><text x=\"266\" y=\"206\" font-size=\"14\" fill=\"#262223\">40 + 8 em 2 doses<\/text><rect x=\"24\" y=\"222\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#E7F2EC\" stroke=\"#2E6B4F\" stroke-opacity=\".35\"/><text x=\"36\" y=\"244\" font-size=\"14\" font-weight=\"700\" fill=\"#2E6B4F\">Amoxi-clav VO<\/text><text x=\"266\" y=\"244\" font-size=\"14\" fill=\"#262223\">40 em 2 doses<\/text><rect x=\"24\" y=\"260\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#2E6B4F\" stroke-opacity=\".35\"/><text x=\"36\" y=\"282\" font-size=\"14\" font-weight=\"700\" fill=\"#2E6B4F\">Ceftriaxona EV/IM<\/text><text x=\"266\" y=\"282\" font-size=\"14\" fill=\"#262223\">50–100 em 1–2 doses<\/text><rect x=\"24\" y=\"298\" width=\"592\" height=\"34\" rx=\"8\" fill=\"#E7F2EC\" stroke=\"#2E6B4F\" stroke-opacity=\".35\"/><text x=\"36\" y=\"320\" font-size=\"14\" font-weight=\"700\" fill=\"#2E6B4F\">Gent function agPause(){if(!PL.on)return;PL.on=false;PL.tok++;clearTimeout(PL.timer);if(SS)SS.cancel();paintAG();msState('paused')}
function agToggle(){if(PL.on)agPause();else{if(!$('#v-aula').classList.contains('on'))show('aula');agPlay(PL.seg>=PL.segs.length?0:PL.seg)}}
let MSA=null;
function silentWav(){const sr=8000,sec=10,n=sr*sec,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,(i%2?1:-1),true);let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return 'data:audio/wav;base64,'+btoa(bin)}
function msAudio(){if(MSA)return MSA;MSA=document.createElement('audio');MSA.src=silentWav();MSA.loop=true;MSA.preload='auto';MSA.setAttribute('playsinline','');MSA.volume=0.05;document.body.appendChild(MSA);
MSA.addEventListener('pause',()=>{if(PL.on&&!MSA._self)agPause()});MSA.addEventListener('play',()=>{if(!PL.on&&!MSA._self)agPlay(PL.seg>=PL.segs.length?0:PL.seg)});return MSA}
function msSelf(fn){const a=msAudio();a._self=true;try{fn(a)}finally{setTimeout(()=>a._self=false,50)}}
function msMeta(){if(!('mediaSession' in navigator))return;try{const L=agList(AG.c);const b=L[AG.i];const k=b&&b.slides.find(x=>IMG[x]);
navigator.mediaSession.metadata=new MediaMetadata({title:b?b.t:'Aula guiada',artist:CFG.profTitulo+' · '+CFG.titulo,album:`Cap. ${AG.c} · bloco ${AG.i+1}/${L.length}`,artwork:k?[{src:img(k),sizes:'680x392',type:'image/jpeg'}]:[]})}catch(e){}}
function msState(st){msSelf(a=>{if(st==='playing'){const p=a.play();if(p&&p.catch)p.catch(()=>{})}else a.pause()});if('mediaSession' in navigator){try{navigator.mediaSession.playbackState=st}catch(e){}}msMeta()}
if('mediaSession' in navigator){const H=navigator.mediaSession;const set=(n,f)=>{try{H.setActionHandler(n,f)}catch(e){}};
set('play',()=>{if(!PL.on)agToggle()});set('pause',()=>{if(PL.on)agPause()});set('stop',()=>agPause());
set('nexttrack',()=>agGo(1,PL.on||AUTO));set('previoustrack',()=>agGo(-1,false));
set('seekforward',()=>{if(PL.seg<PL.segs.length-1){PL.seg++;if(PL.on)speakSeg();else paintAG()}});set('seekbackward',()=>{if(PL.seg>0){PL.seg--;if(PL.on)speakSeg();else paintAG()}})}

/* ---------- CADERNO (db, com fallback local) ---------- */
const CAD=(function(){let items=LS.get('cad',{});let db=null,uid=null,col=null,status='local (aguardando conexão)';
const key=(t,id)=>t+'_'+String(id).replace(/[^\w-]/g,'_').slice(0,120);
function save(k,v){if(v)items[k]=v;else delete items[k];LS.set('cad',items);if(col){const ref=col.doc(k);(v?ref.set(v):ref.delete()).catch(e=>{status='erro ao salvar ('+(e&&e.code||'?')+') — guardado no aparelho';paintStatus()})}}
async function init(){try{if(!window.claude||!claude.use){status='só neste aparelho (sem conexão com o banco)';paintStatus();return}
db=await claude.use('db');const user=await claude.use('user');if(!db||!user){status='só neste aparelho (banco indisponível)';paintStatus();return}
uid=await user.id();col=db.collection('data/users/'+uid+'/caderno/items');const snap=await col.get();const remote={};snap.docs.forEach(d=>{remote[d.id]=d.data()});
for(const [k,v] of Object.entries(items)){if(!remote[k]){try{await col.doc(k).set(v)}catch(e){}remote[k]=v}}
items=remote;LS.set('cad',items);status='salvo no banco do artefato ✓ (sobrevive a troca de aparelho)';paintStatus();renderRes();renderQuest();if($('#v-cad').classList.contains('on'))renderCad()}catch(e){status='só neste aparelho ('+(e&&e.code||e&&e.message||'erro')+')';paintStatus()}}
function paintStatus(){const el=$('#syncst');if(el)el.textContent='Caderno: '+status}
return {init,status:()=>status,paintStatus,all:()=>items,put:(k,v)=>save(k,v),
has:(t,id)=>!!items[key(t,id)],
toggle(t,id,meta){const k=key(t,id);save(k,items[k]?null:Object.assign({tipo:t,ref:id,t:Date.now()},meta))},
add(t,obj){const k=key(t,Date.now().toString(36)+Math.random().toString(36).slice(2,6));save(k,Object.assign({tipo:t,t:Date.now()},obj));return k},
del(k){save(k,null)},
answer(q,i){const k=key('resp',q.id);save(k,{tipo:'resp',ref:q.id,pick:i,ok:i===q.ok,cap:q.cap,titulo:q.tag,t:Date.now()})},
answers(){const R={};Object.values(items).forEach(v=>{if(v.tipo==='resp')R[v.ref]=v.ok});return R},
pick(id){const v=items[key('resp',id)];return v?v.pick:-1}}})();

const lab={fav:'☆ Favoritos',grifo:'🖍 Grifos',nota:'✎ Notas',prints:'🖼 Prints',casos:'✍️ Casos',erros:'⚠ Meus erros'};const L=sets[CT]||[];
const items=L.slice().sort(CT==='erros'?(a,b)=>(a.cap||9)-(b.cap||9):()=>0).map(x=>{let body='';

while(d.length>180000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}if(d.length>180000){const c2=document.createElement('canvas');c2.width=Math.round(w*.7);c2.height=Math.round(h*.7);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);d=c2.toDataURL('image/jpeg',.6)}res(d)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function savePrint(file){try{const img=await shrinkImg(file);const leg=$('#capiq').value.trim();$('#capiq').value='';const L=agList(AG.c),b=L[AG.i];
CAD.add('print',{img,legenda:leg,titulo:leg||('Print · '+(b?b.t:'')),cap:b?b.cap:null,ref:b?b.id:null});cmsg(`<img class="cprint" src="${img}" alt="print"><div class="xs">${leg?esc(leg)+' · ':''}guardado no caderno (🖼 Prints) e no Meu flash. 🍌 Hm. Arquivado. Não vou esquecer — diferente de você.</div>`,'me');gain(3,'print guardado')}
catch(e){cmsg('Não consegui ler essa imagem. Tenta outro print.','bot')}}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SIM&&SIM.fase==='run'&&$('#v-prova').classList.contains('on'))simTick()});
{const _shP=show;show=function(v,sc){_shP(v,sc);document.body.classList.toggle('provamode',v==='prova');if(v==='prova')renderProva();else clearInterval(SIMT)}}
